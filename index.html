re": "Polypes colorectaux : définitions et classifications endoscopiques","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 6px\"><b><i>Maladie de Rendu-Osler (télangiectasie hémorragique héréditaire) : atteinte hépato-gastro-entérologique</i></b></p><p style=\"margin:0 0 10px\"><i>Synthèse centrée sur les atteintes digestive et hépatique, à partir des recommandations internationales HHT (Faughnan ME, et al., 2020).</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Généralités et génétique</p><p style=\"margin:0 0 8px\">Maladie vasculaire <b>autosomique dominante</b>, liée à une anomalie de la voie de signalisation TGF-β/BMP dans l'endothélium vasculaire, responsable d'un défaut de maturation des vaisseaux et de la formation de <b>télangiectasies</b> et de <b>malformations artérioveineuses</b> dans plusieurs organes (\"hyperangiogénèse\").</p><p style=\"margin:0 0 8px\"><b>Gènes principaux</b> : <i>ENG</i> (endogline, HHT de type 1 — associé davantage aux malformations pulmonaires et cérébrales), <i>ACVRL1/ALK1</i> (HHT de type 2 — associé davantage aux malformations hépatiques, début souvent plus tardif), et <i>SMAD4</i> (syndrome combiné polypose juvénile-HHT, avec risque de cancer colorectal associé).</p><p style=\"margin:0\"><b>Diagnostic clinique</b> : critères de Curaçao — <b>épistaxis spontanées récidivantes,</b> <b>télangiectasies cutanéo-muqueuses caractéristiques</b> (lèvres, cavité buccale, doigts, nez), <b>atteinte viscérale </b>(digestive, pulmonaire, hépatique, cérébrale ou spinale), antécédent familial au premier degré. <font color=\"#0a19eb\"><b>Diagnostic certain si 3 critères ou plus, possible si 2, peu probable si moins de 2.</b></font></p><p style=\"margin:0\"><img src=\"b63861309b6d2c467b8a353ffed227be.png\"><br></p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Atteinte gastro-intestinale (télangiectasies digestives)</p><p style=\"margin:0 0 8px\">Des <b>télangiectasies digestives</b> sont retrouvées chez environ <b>15 à 30 % </b>des patients, avec une prévalence croissante avec l'âge ; elles siègent surtout au niveau <b>gastrique et duodénal</b>, plus rarement coliques.</p><p style=\"margin:0 0 8px\"><b>Présentation clinique</b> : le plus souvent asymptomatiques, elles peuvent être responsables d'un <b>saignement digestif occulte chronique</b> et d'une <b>anémie ferriprive</b>, en particulier après 50 ans ; l'hémorragie digestive extériorisée franche est plus rare.</p><p style=\"margin:0 0 8px\"><b>Aspect endoscopique</b> : petites lésions rouges planes, similaires aux télangiectasies observées ailleurs (peau, muqueuse buccale).</p><p style=\"margin:0 0 8px\"><img src=\"682c39d2f9ee95e080d96fa45f3db7c9.png\"><br></p><p style=\"margin:0\"><b>Prise en charge</b> : traitement endoscopique par <b>coagulation au PLASMA ARGON&nbsp;</b>des lésions accessibles et hémorragiques ; supplémentation martiale systématique en cas d'anémie ; en cas de saignement récidivant malgré le traitement endoscopique, recours possible à <b>l'acide tranexamique</b>, à une <b>hormonothérapie </b>(œstroprogestative) ou, dans les formes sévères réfractaires, au <b>BEVACIZUMAB&nbsp;</b>(anti-VEGF) par voie systémique hors AMM.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">3. Atteinte hépatique (malformations vasculaires du foie)</p><p style=\"margin:0 0 8px\">Des <b>malformations vasculaires hépatiques</b> sont retrouvées à l'imagerie chez une large proportion des patients avec Rendu-Osler (jusqu'à 70-80 % selon les séries), mais seule une minorité (environ 8 %) devient symptomatique.</p><p style=\"margin:0 0 8px\"><b>Trois types de shunt possibles</b>, pouvant coexister :</p><table><thead><tr><th>Type de shunt</th><th>Conséquence principale</th></tr></thead><tbody><tr><td>Artère hépatique → veine hépatique (artérioveineux)</td><td><b>Insuffisance cardiaque à haut débit</b> — complication symptomatique la plus fréquente</td></tr><tr><td>Artère hépatique → veine porte (artério-portal)</td><td>Hypertension portale</td></tr><tr><td>Veine porte → veine hépatique (porto-veineux)</td><td>Encéphalopathie hépatique (par shunt porto systémique)</td></tr></tbody></table><p style=\"margin:10px 0 0\">Autres associations décrites : augmentation de l'incidence d'<b>hyperplasie nodulaire focale</b>, et exceptionnellement ischémie mésentérique ou biliaire par vol vasculaire.</p></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">4. Piège majeur à connaître</p><p style=\"margin:0\"><b>L'embolisation de l'artère hépatique est contre-indiquée</b> dans la maladie de Rendu-Osler, en dehors de situations d'urgence vitale exceptionnelles encadrées par un centre expert : les voies biliaires n'ont, chez ces patients, qu'une vascularisation artérielle (pas de suppléance portale efficace du fait des anomalies vasculaires), et l'embolisation expose à un risque élevé de <b>nécrose biliaire ischémique</b>, parfois fatale. La prise en charge des complications hépatiques symptomatiques repose en priorité sur le <b>traitement médical</b> (notamment de l'insuffisance cardiaque), la <b>transplantation hépatique</b> restant le seul traitement curatif des formes réfractaires.</p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">5. Dépistage recommandé</p><ul class=\"bullet-list\"><li><b>Dépistage hépatique systématique</b> : <b>échographie-Doppler hépatique</b> recommandée chez tout patient porteur d'un diagnostic certain ou probable de Rendu-Osler, au moins une fois ; complétée par un scanner ou une IRM avec injection en cas d'anomalie ou de doute.</li><li><b>Dépistage digestif non systématique</b> : pas de coloscopie ou d'endoscopie haute de dépistage systématique en l'absence de symptôme ; une exploration est indiquée devant une <b>anémie inexpliquée</b> ou un <b>saignement digestif</b>.</li><li>Le dépistage des malformations artérioveineuses pulmonaires (échocardiographie de contraste) et cérébrales fait partie du bilan global, mais sort du cadre hépato-gastro-entérologique de cette fiche.</li></ul></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">6. Cas particulier : syndrome SMAD4 (polypose juvénile-HHT)</p><p style=\"margin:0\">Le syndrome combiné <b>polypose juvénile-HHT</b> (mutation <i>SMAD4</i>) associe les manifestations de la maladie de Rendu-Osler à une <b>polypose juvénile</b>, exposant à un <b>risque accru de cancer colorectal et gastrique</b>. Chez ces patients, une <b>surveillance endoscopique digestive spécifique et renforcée</b> (coloscopie et endoscopie haute avec polypectomie des polypes juvéniles) est nécessaire, en plus du dépistage hépatique standard.</p></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Faughnan ME, Mager JJ, Hetts SW, et al. Second International Guidelines for the Diagnosis and Management of Hereditary Hemorrhagic Telangiectasia. Ann Intern Med 2020;173:989-1001 ; Garcia-Tsao G, et al., atteinte hépatique de la maladie de Rendu-Osler. À confronter systématiquement à un avis spécialisé, notamment auprès d'un centre de référence HHT.</i></p>","id": "rendu-osler-hge","tags": ["Rendu-Osler","HHT","angiodysplasies","malformation vasculaire hépatique","SMAD4"],"titre": "MALADIE DE RENDU-OSLER : atteinte hépato-gastro-entérologique","urgent": false},{"categorie": "MICI","contenu": "<p style=\"margin:0 0 6px;\"><b>Surveillance endoscopique des MICI et dépistage de la dysplasie colique</b></p><p style=\"margin:0 0 10px;\"><i>Synthèse à partir des recommandations de l'ECCO (European Crohn's and Colitis Organisation) et de la fiche SFED « Surveillance des MICI et dépistage de la dysplasie colique ».</i></p><div style=\"background:#F1E7F7;border-left:4px solid #6A3D8A;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#6A3D8A;font-weight:bold;\">1. Qui dépister ?</p><ul class=\"bullet-list\"><li>Tout patient dont la <b>RCH dépasse le rectum</b> (les formes limitées au rectum, E1, n'ont pas de sur-risque de CCR et suivent les règles de dépistage de la population générale).</li><li>Tout patient ayant une <b>maladie de Crohn colique jugée significative</b> — critère non strictement défini, mais la majorité des experts retiennent une atteinte de plus d'un tiers du côlon.</li><li>Le dépistage par recherche de sang occulte dans les selles (FIT) <b>n'est pas indiqué</b> chez les patients MICI, en raison d'un taux élevé de faux positifs.</li></ul></div><div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#1F5C3F;font-weight:bold;\">2. Quand débuter le dépistage ?</p><ul class=\"bullet-list\"><li>Coloscopie de référence <b>8 ans après les premiers symptômes</b> (ou le diagnostic) de toute colite inflammatoire, à l'exception des proctites isolées et de la maladie de Crohn limitée à un court segment.</li><li>Chez les patients avec une <b>cholangite sclérosante primitive</b> (CSP) associée, transplantée ou non — risque de CCR très élevé — le dépistage débute <b>dès le diagnostic de la MICI</b>, sans attendre 8 ans.</li><li>Lors de cette première coloscopie de dépistage, il est utile de refaire des biopsies étagées pour préciser l'extension histologique de la maladie.</li></ul></div><div style=\"background:#FCEBDD;border-left:4px solid #9C5A16;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#9C5A16;font-weight:bold;\">3. Facteurs de risque de dysplasie</p><ul class=\"bullet-list\"><li>Cholangite sclérosante primitive</li><li>Durée d'évolution de la MICI</li><li>Sténose colique</li><li>Extension pancolique</li><li>Persistance d'une activité inflammatoire</li><li>Antécédent personnel de dysplasie</li><li>Antécédent familial de cancer colorectal chez un apparenté au premier degré avant 50 ans</li></ul></div><div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#24507C;font-weight:bold;\">4. Rythme de la surveillance selon le niveau de risque</p><p style=\"margin:0 0 8px;\">Le rythme est adapté aux caractéristiques individuelles de chaque patient : risque génétique, pathologies associées (CSP…), caractéristiques évolutives de la maladie colique (extension, durée d'activité non contrôlée) et constatations des examens antérieurs.</p><table><thead><tr><th>Niveau de risque</th><th>Facteurs</th><th>Rythme</th></tr></thead><tbody><tr><td><b>Haut risque</b></td><td>CSP associée ; sténose ou dysplasie dans les 5 dernières années ; colite étendue avec inflammation active sévère ; antécédent familial de CCR au 1<sup>er</sup> degré avant 50 ans</td><td><b>Annuel</b></td></tr><tr><td><b>Risque intermédiaire</b></td><td>Situations n'atteignant ni les critères de haut risque ni ceux de bas risque</td><td><b>Tous les 2 à 3 ans</b></td></tr><tr><td><b>Risque faible</b></td><td>Aucun des facteurs de haut risque, maladie quiescente, colite peu étendue</td><td><b>Tous les 5 ans</b></td></tr></tbody></table></div><div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#1F5C3F;font-weight:bold;\">5. Comment dépister ?</p><ul class=\"bullet-list\"><li>Dépistage à réaliser si possible en <b>phase quiescente</b> de la maladie : les remaniements muqueux liés à l'inflammation active gênent le diagnostic macroscopique et histologique des lésions dysplasiques.</li><li><b>Endoscopes haute définition</b>, <b>chromoendoscopie</b> (colorant ou virtuelle) et <b>excellente préparation colique</b> sont nécessaires.</li><li><b>Temps de retrait prolongé</b> : non strictement fixé par les recommandations, mais l'usage suggère un temps supérieur à 10 minutes ; une étude française (ECCO 2024) a montré qu'une lumière blanche haute définition avec <b>double passage segmentaire</b> (temps médian 20 minutes) n'est pas inférieure à la chromoendoscopie pour le dépistage de la dysplasie — une alternative validée lorsque la chromoendoscopie n'est pas disponible.</li><li><b>Biopsies</b> : en cas de chromoendoscopie réalisée par un endoscopiste entraîné à la détection des lésions dysplasiques, seule l'exérèse des lésions visibles est requise — il n'est plus recommandé de biopsier systématiquement la muqueuse d'aspect normal autour d'une lésion réséquée. Les biopsies aléatoires étagées restent conseillées en cas de <b>CSP</b> ou d'<b>antécédent personnel de dysplasie</b>.</li></ul></div><div style=\"background:#FBE7EC;border-left:4px solid #9B3355;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#9B3355;font-weight:bold;\">6. Détection et résection des lésions dysplasiques</p><p style=\"margin:0 0 8px;\"><b>Aspect de la dysplasie colique dans les MICI</b> : lésions souvent multifocales, planes ou discrètement surélevées, villeuses, papillomateuses voire nodulaires. Rechercher et photographier toute variation de couleur (érythème) ou disparition de la trame vasculaire, toute variation de relief ou interruption des sillons muqueux, toute déformation de la paroi à l'insufflation/exsufflation, et toute zone fragile ou friable saignant au contact.</p><p style=\"margin:0 0 8px;\"><b>Description des lésions</b> : localisation, taille, morphologie, pit pattern, limites.</p><p style=\"margin:0;\"><b>Résection</b> : peut être endoscopique — y compris par dissection sous-muqueuse si &gt; 2 cm — en monobloc, à condition qu'il n'y ait pas de dysplasie multifocale associée.</p></div><div style=\"background:#FDF3D6;border-left:4px solid #8A6D0E;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#8A6D0E;font-weight:bold;\">7. Surveillance du réservoir iléo-anal</p><p style=\"margin:0;\">Une surveillance endoscopique <b>annuelle du réservoir</b>, avec biopsies, doit être envisagée chez les patients porteurs d'une anastomose iléo-anale ayant : un antécédent de dysplasie ou de CCR sur la pièce de colectomie, une CSP associée, ou une atrophie/inflammation sévère persistante du réservoir.</p></div><p style=\"margin:16px 0 0; font-size:0.85em; color:#6E6A5D;\"><i>Sources : ECCO (European Crohn's and Colitis Organisation), recommandations de surveillance de la dysplasie dans les MICI ; SFED, fiche « Surveillance des MICI et dépistage de la dysplasie colique » (POST'U) ; Murthy S, et al. (stratification du risque) ; étude française DYSCO (congrès ECCO 2024) sur le double passage segmentaire en lumière blanche haute définition. À adapter au contexte clinique individuel et au matériel d'imagerie disponible.</i></p>","id": "surveillance-mici-dysplasie","tags": ["MICI","dysplasie","surveillance","ECCO","SFED","chromoendoscopie"],"titre": "Surveillance endoscopique des MICI et dépistage de la dysplasie colique","urgent": false},{"categorie": "Endoscopie","contenu": "<p style=\"margin:0 0 6px\"><b>Surveillance après polypectomie colique</b></p><p style=\"margin:0 0 10px\"><i>Actualisation des recommandations HAS 2013 (« Surveillance après polypectomie », parfois citées 2014) par les recommandations SFED 2021 sous l'égide du CNP-HGE, adaptation française du guide ESGE 2020.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">Contexte et sources</p><p style=\"margin:0 0 8px\">En 2013, la HAS avait associé le CNP-HGE et la FSMAD pour définir les modalités de surveillance après polypectomie colique, sur la base des recommandations internationales alors en vigueur.</p><p style=\"margin:0 0 8px\">Ces recommandations historiques ont depuis été <b>actualisées en 2021 par la SFED</b>, sous l'égide du CNP-HGE, en adaptation des recommandations européennes ESGE 2020. Les principales modifications portent sur la définition des niveaux de risque de cancer colorectal (CCR) après polypectomie et sur les modalités de suivi, avec l'introduction d'une consultation spécialisée de prévention et, pour certains patients à faible risque, la possibilité d'un dépistage par test immunologique fécal (FIT) plutôt que par coloscopie.</p><p style=\"margin:0\">Ce sont ces recommandations actualisées (SFED 2021) qui font référence en pratique courante ; le contenu ci-dessous les présente.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">Facteurs déterminant le rythme de surveillance</p><p style=\"margin:6px 0 4px\"><b>Facteurs techniques</b> — tenus pour responsables de 70 à 85 % des cancers d'intervalle (polypes manqués ou exérèse incomplète)</p><ul class=\"bullet-list\"><li>Qualité de la préparation colique suffisante</li><li>Caractère complet de l'examen (exploration jusqu'au cæcum, temps de retrait adéquat)</li><li>Exérèse monobloc et résection complète, ablation de la totalité des lésions identifiées lors de la même séance</li></ul><p style=\"margin:8px 0 4px\"><b>Facteurs liés au patient</b></p><ul class=\"bullet-list\"><li>Comorbidités et espérance de vie, à évaluer lors de la consultation spécialisée de prévention</li><li>Antécédents familiaux de CCR ou de polypes adénomateux — à ce jour, <b>aucune recommandation ne préconise de raccourcir les délais de surveillance</b> sur ce seul critère</li><li>Âge &gt; 60 ans et sexe masculin : facteurs de risque identifiés, mais non retenus à eux seuls comme justifiant une augmentation de la fréquence des contrôles</li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">Stratification du risque et rythme de surveillance (SFED 2021)</p><p style=\"margin:0 0 8px\">Le risque de néoplasie avancée métachrone est stratifié selon la taille, l'histologie et le nombre de polypes réséqués.</p><table><thead><tr><th>Niveau de risque</th><th>Critères</th><th>Conduite</th></tr></thead><tbody><tr><td><b>Risque élevé</b></td><td><b>5 adénomes ou plus réséqués </b>; OU <b>au moins un adénome &gt; 10 mm ou en dysplasie de haut grade</b> ; OU a<b>u moins un polype festonné &gt; 10 mm ou avec dysplasie</b></td><td><b>Coloscopie de contrôle<u> à 3 ans</u></b></td></tr><tr><td><b>Risque faible</b></td><td><b>Résection complète de 1 ou 2 adénomes &lt; 10 mm en dysplasie de bas grade</b></td><td>Consultation de prévention personnalisée à 5 ans, à l'issue de laquelle coloscopie <b>ou</b> dépistage par FIT selon la balance bénéfice/risque</td></tr><tr><td><b>Risque faible</b></td><td><b>Résection complète de 3 ou 4 adénomes &lt; 10 mm en dysplasie de bas grade</b></td><td><b>Coloscopie de contrôle <u>à 5 ans</u></b></td></tr><tr><td><b>Risque faible</b></td><td><b>Résection complète d'un ou plusieurs polypes festonnés &lt; 10 mm sans dysplasie</b></td><td><b>Coloscopie de contrôle<u> à 5 ans</u></b></td></tr></tbody></table><img src=\"86a8b01e6addc62bfbf363564c632af7.png\"><img src=\"bd6a3c7a459c30e7bc7761ed44baf29d.png\"><br></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">Cas particuliers</p><ul class=\"bullet-list\"><li><b>Résection en plusieurs fragments</b> (piecemeal) d'un polype ≥ 20 mm, macroscopiquement complète et non dégénéré : coloscopie de contrôle<b> entre 3 et 6 MOIS,</b> puis à&nbsp;<b>&nbsp;12 MOIS</b>, pour dépister une récidive locale tardive.</li><li><b>Coloscopie incomplète ou préparation insuffisante</b> : à répéter dans l'année, indépendamment du niveau de risque initial des polypes déjà réséqués.</li><li><b>Après des contrôles normaux répétés</b> : la surveillance peut être espacée, jusqu'à 10 ans, voire un retour au programme de dépistage organisé dans certains cas.</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">Bonnes pratiques</p><ul class=\"bullet-list\"><li>La <b>consultation spécialisée de prévention</b> permet d'évaluer les comorbidités et l'espérance de vie du patient, et de déterminer les modalités de suivi en tenant compte de son choix.</li><li>Le délai préconisé pour la coloscopie de contrôle doit être <b>communiqué par écrit au patient</b> et <b>tracé dans le dossier</b>.</li><li>Ces recommandations sont indissociables des critères de qualité de la coloscopie (préparation, temps de retrait, taux de détection des adénomes).</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : HAS, Surveillance après polypectomie, 2013 (recommandations historiques, CNP-HGE/FSMAD) ; SFED, sous l'égide du CNP-HGE, Recommandations pour le suivi après polypectomie, 2021, adaptation française du guide ESGE (Hassan C, et al., Endoscopy 2020) ; POST'U 2014 (Heresbach D, Marteau P) et POST'U 2022 (Robaszkiewicz M, et al.), FMC-HGE. À adapter au contexte clinique individuel et à la qualité du programme de dépistage organisé local.</i></p>","id": "surveillance-post-polypectomie","tags": ["surveillance","polypectomie","coloscopie","HAS","SFED","ESGE"],"titre": "Surveillance après polypectomie colique","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 6px\"><b>TIPS (<font color=\"#291dd3\">Transjugular Intrahepatic Portosystemic Shunt</font>) : principe, indications, contre-indications, bilan pré-thérapeutique</b></p><p style=\"margin:0 0 10px\"><i>Synthèse technique et clinique, en complément de la fiche dédiée au TIPS dans le contexte de l'hypertension portale (Baveno VIII).</i></p><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">1. Principe technique</p><p style=\"margin:0 0 8px\">Le TIPS est une <b>anastomose porto-cave intrahépatique</b>, créée par voie percutanée sous contrôle radiologique, qui relie directement une branche de la <b>veine porte</b> à une <b>veine hépatique</b> à travers le parenchyme hépatique, court-circuitant ainsi la résistance vasculaire intrahépatique responsable de l'hypertension portale.</p><p style=\"margin:0 0 8px\"><img src=\"63ae7fdf37bab24a5a77415c7e825281.png\"><br></p><p style=\"margin:0 0 8px\"><b>Étapes du geste</b> :</p><ol><li><b>Abord veineux jugulaire</b> (le plus souvent jugulaire interne droite), sous anesthésie locale ou générale selon le contexte.</li></ol><div><img src=\"ba62858b85178d17cb5dd4d9937ce8e3.png\"><br></div><ol><li><b>Cathétérisme d'une veine hépatique</b> (généralement la veine hépatique droite ou médiane) par voie transjugulaire, avec mesure du <b>gradient de pression porto-cave</b> avant et après la procédure (HTPCS gradient &gt; 10 mmHg).</li><li><b>Ponction transhépatique de la veine porte</b> depuis la veine hépatique cathétérisée, sous guidage fluoroscopique (± échographique), créant un trajet intra parenchymateux entre les deux systèmes veineux.</li><li><b>Dilatation du trajet</b>&nbsp;par ballonnet puis mise en place d'une <b>endoprothèse couverte</b> (le plus souvent en polytétrafluoroéthylène, PTFE) reliant la veine porte à la veine hépatique, créant le shunt.</li></ol><div><img src=\"f3480cf140f4bb769b3ea5181b3d2275.png\"><br></div><ol><li><b>Contrôle angiographique et mesure du gradient résiduel</b> ; le calibre de la prothèse est choisi au cas par cas, en visant le plus petit diamètre permettant une réponse clinique satisfaisante, afin de limiter le risque de sur-shuntage (encéphalopathie, insuffisance cardiaque).</li></ol><div><img src=\"a19152189af2c10d50e7c33b87412a76.png\"><br></div><p style=\"margin:8px 0 0\">Le TIPS abaisse la pression portale en dérivant une partie du flux splanchnique directement vers la circulation systémique, sans passer par le foie.</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Indications</p><table><thead><tr><th>Contexte</th><th>Indication</th></tr></thead><tbody><tr><td><b>Hémorragie digestive liée à l'HTP</b></td><td><b>TIPS préemptif précoce</b> (Child-Pugh C 10-13, ou Child-Pugh B &gt; 7 avec saignement actif à l'endoscopie, ou gradient ≥ 20 mmHg) ; <b>TIPS de sauvetage</b> en cas d'échec du traitement pharmacologique et endoscopique combiné</td></tr><tr><td><b>Prévention secondaire de l'hémorragie</b></td><td>Échec de la bithérapie bêtabloquant + ligature (récidive hémorragique)</td></tr><tr><td><b>Varices gastriques</b></td><td>Traitement définitif de référence pour les varices gastro-œsophagiennes de type 2 et les varices gastriques isolées de type 1, avec ou sans embolisation associée</td></tr><tr><td><b>Ascite</b></td><td><b>Ascite récidivante</b> (≥ 3 ponctions évacuatrices/an) ou <b>réfractaire</b> au traitement médical maximal</td></tr><tr><td><b>Hydrothorax hépatique</b></td><td>Réfractaire au traitement médical standard</td></tr><tr><td><b>Gastropathie ou entéropathie d'hypertension portale</b></td><td>Formes sévères ou hémorragiques réfractaires au traitement médical</td></tr><tr><td><b>Syndrome de Budd-Chiari</b></td><td>Échec de l'anticoagulation et de la désobstruction, avant recours à la transplantation</td></tr><tr><td><b>Thrombose porte</b></td><td>Absence d'amélioration sous anticoagulation avec complications d'hypertension portale, ou en 1re intention si anticoagulation contre-indiquée</td></tr><tr><td><b>Chirurgie extra-hépatique majeure programmée</b></td><td>À discuter au cas par cas pour réduire le risque de décompensation post-opératoire chez un patient avec hypertension portale sévère</td></tr></tbody></table></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">3. Contre-indications</p><p style=\"margin:6px 0 4px\"><b>Contre-indications absolues</b></p><ul class=\"bullet-list\"><li><b>Insuffisance cardiaque droite sévère ou hypertension artérielle pulmonaire sévère</b> : le shunt augmente brutalement le retour veineux vers le cœur droit, avec risque de décompensation cardiaque aiguë</li><li><b>Polykystose hépatique sévère</b> rendant le trajet intra parenchymateux impossible ou dangereux</li><li><b>Infection biliaire non contrôlée / cholangite active</b> (risque de bactériémie et de sepsis sur le matériel prothétique)</li><li><b>Obstruction biliaire non drainée</b></li></ul><p style=\"margin:8px 0 4px\"><b>Contre-indications relatives, à discuter au cas par cas</b></p><ul class=\"bullet-list\"><li>Thrombose porte extensive ou cavernome portal rendant le geste techniquement difficile (non systématiquement rédhibitoire selon l'expertise du centre)</li><li>Insuffisance hépatocellulaire sévère (MELD très élevé) en dehors d'une indication de sauvetage vital</li><li>Tumeur hépatique interposée sur le trajet prévu du shunt</li><li>Antécédent d'encéphalopathie hépatique sévère ou récidivante : n'est <b>pas une contre-indication absolue</b>, mais impose une décision individualisée et une surveillance renforcée</li><li>Insuffisance rénale sévère (à intégrer dans l'évaluation globale du rapport bénéfice/risque)</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Bilan pré-thérapeutique</p><ul class=\"bullet-list\"><li><b>Échocardiographie</b> : recherche systématique d'une insuffisance cardiaque ou d'une hypertension artérielle pulmonaire, contre-indications majeures au geste.</li><li><b>Bilan hépatique complet</b> : calcul du score de Child-Pugh et du MELD, éléments centraux de la décision et du pronostic.</li><li><b>Fonction rénale</b>, avec stadification de la maladie rénale chronique si besoin, à visée de stratification du risque.</li><li><b>Imagerie en coupes avec injection</b> (scanner ou IRM) : cartographie de l'anatomie vasculaire hépatique, perméabilité de l'axe porte, recherche d'un carcinome hépatocellulaire ou d'une autre lésion focale interposée sur le trajet prévu.</li><li><b>Recherche d'un antécédent d'encéphalopathie hépatique</b> et des traitements spécifiques en cours.</li><li><b>Bilan infectieux</b> : recherche et traitement de tout foyer infectieux actif avant le geste (biliaire notamment).</li><li><b>Évaluation nutritionnelle, de la sarcopénie et de la fragilité.</b></li><li><b>Discussion parallèle de la candidature à la transplantation hépatique</b>, systématique dès lors qu'un TIPS est envisagé pour une complication sévère de l'hypertension portale.</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">5. Complications principales</p><ul class=\"bullet-list\"><li><b>Encéphalopathie hépatique</b> : complication la plus fréquente, liée au shunt du sang portal évitant le foie ; prévention par <b>RIFAXIMINE&nbsp;</b>chez les candidats à un TIPS électif, et par le choix du plus petit calibre de prothèse efficace.</li><li><b>Dysfonction ou thrombose du TIPS</b> : moins fréquente depuis l'usage des prothèses couvertes, imposant une surveillance échographique régulière.</li><li><b>Insuffisance cardiaque / sur-shuntage</b> : justifie le bilan cardiologique pré-procédure et l'adaptation du calibre de la prothèse.</li><li>Complications liées au geste lui-même : hémopéritoine par ponction capsulaire, hémobilie, fièvre transitoire.</li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">6. Surveillance</p><ul class=\"bullet-list\"><li><b>Échographie-Doppler</b> de contrôle à intervalles réguliers pour vérifier la perméabilité du shunt.</li><li><b>Surveillance clinique de l'encéphalopathie</b>, avec adaptation thérapeutique (traitement médical, réduction ou occlusion partielle du TIPS, embolisation d'un shunt spontané associé) en cas de forme récidivante ou persistante.</li><li><b>Réévaluation régulière de la fonction hépatique</b> et de la candidature à la transplantation.</li><li>En l'absence d'amélioration de l'ascite malgré un TIPS fonctionnel : <b>dilatation par paliers</b> de la prothèse.</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 ; EASL Clinical Practice Guidelines for the management of patients with decompensated cirrhosis, J Hepatol 2018 ; recommandations de radiologie interventionnelle (SFR/CIRSE) sur le TIPS. À adapter au plateau technique et au protocole local.</i></p>","id": "tips-technique-indications","tags": ["TIPS","shunt porto-systémique","hypertension portale","technique","radiologie interventionnelle"],"titre": "TIPS : Notions de base","urgent": false}];


  var MEDS_SEED = [{"categorie": "","contenu": "<p style=\"margin:0 0 6px\"><b>BEVACIZUMAB (Avastin® et biosimilaires) — Anti-VEGF</b></p><p style=\"margin:0 0 10px\"><i>Anticorps monoclonal humanisé recombinant anti-VEGF, à partir du résumé des caractéristiques du produit (RCP) et des recommandations d'usage courant en oncologie digestive.</i></p><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">1. Mécanisme d'action et physiopathologie</p><p style=\"margin:0 0 8px\">La croissance tumorale au-delà de quelques millimètres cubes dépend de la formation de nouveaux vaisseaux (<b>angiogenèse tumorale</b>), sous la dépendance principale du <b>VEGF-A</b> (<i>Vascular Endothelial Growth Factor A</i>), produit notamment par les cellules tumorales hypoxiques.</p><p style=\"margin:0 0 8px\">Le bevacizumab est un <b>anticorps monoclonal humanisé</b> qui se lie avec une haute affinité au VEGF-A circulant et l'empêche de se fixer à ses récepteurs (VEGFR-1 et VEGFR-2) à la surface des cellules endothéliales.</p><p style=\"margin:0\">Conséquences : inhibition de la néoangiogenèse tumorale, régression partielle de la vascularisation tumorale existante, et <b>« normalisation vasculaire »</b> transitoire des vaisseaux tumoraux résiduels, qui améliorerait la délivrance des chimiothérapies associées — c'est pourquoi le bevacizumab est utilisé en association et non en monothérapie dans la plupart de ses indications.</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Indications et AMM</p><p style=\"margin:0 0 8px\">Toujours utilisé <b>en association</b> à une chimiothérapie ou un autre traitement (sauf en traitement d'entretien après induction) :</p><ul class=\"bullet-list\"><li><b>Cancer colorectal métastatique</b>, en association à une chimiothérapie à base de fluoropyrimidine (FOLFOX, FOLFIRI, XELOX…) — indication de référence en oncologie digestive</li><li><i>Cancer du sein métastatique, en association au paclitaxel (indication restreinte selon les pays)</i></li><li><i>Cancer bronchique non à petites cellules, non épidermoïde, avancé/métastatique/récidivant</i></li><li><i>Cancer du rein avancé et/ou métastatique, en association à l'interféron alfa-2a</i></li><li><i>Cancer épithélial de l'ovaire, de la trompe de Fallope ou péritonéal primitif, aux stades avancés, en association à la chimiothérapie puis en entretien</i></li><li><i>Cancer du col utérin persistant, récidivant ou métastatique, en association à une chimiothérapie</i></li></ul><p style=\"margin:8px 0 0\"><i><b>Usage hors AMM</b> reconnu pa</i>r les recommandations internationales : traitement systémique des formes sévères et réfractaires de <b>maladie de Rendu-Osler</b> (télangiectasies digestives hémorragiques réfractaires, malformations vasculaires hépatiques symptomatiques) — schéma non standardisé, à discuter en centre expert.</p></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">3. Posologie</p><p style=\"margin:0 0 8px\">Administration exclusivement par <b>perfusion intraveineuse</b> (jamais en bolus ni en injection IV rapide) ; la première perfusion est généralement administrée sur 90 minutes, puis progressivement raccourcie selon la tolérance.</p><table><thead><tr><th>Indication</th><th>Posologie usuelle</th></tr></thead><tbody><tr><td><b>Cancer colorectal métastatique</b></td><td>5 mg/kg toutes les 2 semaines, ou 7,5 mg/kg toutes les 3 semaines (selon le schéma de chimiothérapie associé)</td></tr><tr><td><i>Cancer bronchique non à petites cellules</i></td><td><i>7,5 ou 15 mg/kg toutes les 3 semaines</i></td></tr><tr><td><i>Cancer du rein</i></td><td><i>10 mg/kg toutes les 2 semaines</i></td></tr><tr><td><i>Cancer de l'ovaire</i></td><td><i>15 mg/kg (ou 7,5 mg/kg selon le protocole) toutes les 3 semaines</i></td></tr><tr><td><i>Cancer du col utérin</i></td><td><i>15 mg/kg toutes les 3 semaines</i></td></tr></tbody></table><p style=\"margin:8px 0 0\">Poursuite jusqu'à progression de la maladie ou toxicité inacceptable.</p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Bilan pré-thérapeutique</p><ul class=\"bullet-list\"><li><b>Pression artérielle</b> : à contrôler et équilibrer avant l'introduction (l'HTA est très fréquente sous traitement).</li><li><b>Bandelette urinaire</b> (± protéinurie des 24 h si positive) : recherche d'une protéinurie préexistante.</li><li><b>Bilan de coagulation et recherche d'antécédents thromboemboliques ou hémorragiques.</b></li><li><b>Recherche d'une chirurgie récente ou programmée</b> : le bevacizumab doit être <b><font color=\"#ec0909\">interrompu au moins 28 jours avant une chirurgie élective, </font></b>et ne doit être repris qu'après cicatrisation complète de la plaie opératoire (délai d'au moins 28 jours après l'intervention).</li><li><b>Recherche d'antécédent de perforation digestive, de fistule ou de diverticulite active</b>, qui contre-indiquent ou font discuter fortement le traitement.</li><li><b>Test de grossesse</b> chez la femme en âge de procréer, et mise en place d'une <b>contraception efficace</b> pendant le traitement et poursuivie plusieurs mois après la dernière injection.</li><li>Bilan standard de la chimiothérapie associée (NFS, fonction hépatique et rénale).</li></ul></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">5. Effets indésirables</p><p style=\"margin:6px 0 4px\"><b>Très fréquents</b></p><ul class=\"bullet-list\"><li><font color=\"#299e52\"><b>Hypertension artérielle</b></font></li><li><font color=\"#299e52\"><b>Protéinurie</b></font></li><li><font color=\"#299e52\"><b>Asthénie, diarrhée, douleurs abdominales (souvent majorées par la chimiothérapie associée)</b></font></li><li><font color=\"#299e52\"><b>Épistaxis</b></font></li></ul><p style=\"margin:8px 0 4px\"><b>Complications à surveiller activement</b></p><ul class=\"bullet-list\"><li><b>Hémorragies</b>, potentiellement sévères (digestives, pulmonaires — hémoptysie notamment en cas de cancer bronchique épidermoïde)</li><li><b>Événements thromboemboliques</b>, artériels (AVC, infarctus du myocarde) et veineux (thrombose veineuse profonde, embolie pulmonaire)</li><li><b>Perforation digestive</b> et <b>fistules</b> (digestives ou autres) — complication rare mais potentiellement grave</li><li><b>Retard ou trouble de cicatrisation</b></li><li><b>Syndrome de leucoencéphalopathie postérieure réversible (PRES)</b> — rare, à évoquer devant des céphalées, convulsions, troubles visuels ou confusion</li><li><b>Insuffisance cardiaque</b>, notamment en cas d'association aux anthracyclines ou d'antécédent cardiovasculaire</li></ul></div><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">6. Contre-indications</p><ul class=\"bullet-list\"><li>Hypersensibilité connue au bevacizumab, aux protéines de cellules ovariennes de hamster chinois (CHO) ou à d'autres anticorps recombinants humains ou humanisés</li><li><b>Grossesse</b> (potentiel tératogène)</li><li><b>Cancer bronchique à composante épidermoïde prédominante</b> (contre-indication spécifique à cette histologie, en raison du risque hémorragique pulmonaire élevé)</li><li><b>Chirurgie majeure récente</b> (&lt; 28 jours) ou <b>plaie chirurgicale non cicatrisée</b></li><li><b>Antécédent de perforation gastro-intestinale ou de fistule trachéo-œsophagienne</b></li><li><b>Hémorragie sévère active ou récente</b></li></ul></div><div style=\"background:#E4E9FA; border-left:4px solid #35449B; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#35449B; font-weight:bold\">7. Surveillance</p><ul class=\"bullet-list\"><li><b>Pression artérielle</b> à chaque cure, avec traitement antihypertenseur adapté si besoin (l'HTA n'impose pas systématiquement l'arrêt du traitement).</li><li><b>Bandelette urinaire</b> avant chaque cure ; protéinurie des 24 h en cas de positivité significative, avec discussion de l'arrêt si protéinurie néphrotique.</li><li>Surveillance clinique des <b>signes hémorragiques et thromboemboliques</b>.</li><li><b>Respect scrupuleux des délais péri-opératoires</b> (arrêt avant chirurgie, reprise seulement après cicatrisation complète).</li><li>NFS et bilan hépatorénal selon le rythme de la chimiothérapie associée.</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Résumé des caractéristiques du produit (RCP) Avastin® (ANSM/EMA) ; recommandations d'usage en oncologie digestive (référentiels nationaux de cancérologie digestive, TNCD) ; Faughnan ME, et al., 2020 (usage hors AMM dans la maladie de Rendu-Osler). À vérifier auprès du RCP en vigueur et à adapter au protocole local.</i></p>","id": "bevacizumab","tags": ["Bevacizumab","anti-VEGF","angiogenèse","oncologie digestive"],"titre": "BEVACIZUMAB (Avastin®)","urgent": false},{"categorie": "","contenu": "<p style=\"margin:0 0 10px;\"><b>INFLIXIMAB (Anti-TNFα) — MICI</b></p><div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#24507C;font-weight:bold;\">1. Mécanisme d'action et indications</p><p style=\"margin:6px 0 4px;\"><b>Mécanisme d'action</b></p><p style=\"margin:0 0 8px;\">Anticorps monoclonal <b>chimérique</b> dirigé contre le <b>TNFα</b>, cytokine pro-inflammatoire centrale dans la physiopathologie des MICI.</p><p style=\"margin:0 0 8px;\">TNFα ↑ → activation immunitaire → recrutement cellulaire → inflammation intestinale → lésions muqueuses.</p><p style=\"margin:0 0 8px;\">L'infliximab se lie au TNFα soluble et membranaire et inhibe son activité :<br>→ diminution de l'inflammation → diminution de l'activité de la maladie → cicatrisation muqueuse → maintien de la rémission.</p><p style=\"margin:0 0 10px;\">Il peut également entraîner une lyse/apoptose des cellules exprimant le TNFα membranaire.</p><p style=\"margin:6px 0 4px;\"><b>Indications principales en gastro-entérologie</b></p><ul class=\"bullet-list\"><li>Maladie de Crohn modérée à sévère</li><li>Maladie de Crohn fistulisante / périnéale</li><li>RCH modérée à sévère</li></ul><p style=\"margin:8px 0 0;\">L'infliximab fait partie des anti-TNF recommandés par l'ECCO et le GETAID dans les MICI modérées à sévères.</p></div><div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#1F5C3F;font-weight:bold;\">2. Posologie et optimisation du traitement</p><p style=\"margin:6px 0 4px;\"><b>Induction IV</b></p><ul class=\"bullet-list\"><li>5 mg/kg IV à S0, S2 et S6, puis passage à l'entretien.</li></ul><p style=\"margin:8px 0 4px;\"><b>Entretien IV</b></p><ul class=\"bullet-list\"><li>5 mg/kg toutes les 8 semaines.</li><li>Intensification possible selon le GETAID, dans la maladie de Crohn, jusqu'à 10 mg/kg toutes les 4 semaines selon la situation clinique et la réponse au traitement.</li></ul><p style=\"margin:8px 0 4px;\"><b>Formulation sous-cutanée</b></p><ul class=\"bullet-list\"><li>Chez les patients en entretien IV, relais possible par Remsima® SC 120 mg toutes les 2 semaines.</li><li>En cas de réponse insuffisante ou d'effet fin de dose, le GETAID mentionne notamment 120 mg SC toutes les semaines, ou 240 mg SC toutes les 2 semaines, selon la situation.</li></ul><p style=\"margin:10px 0 4px;\"><b>Optimisation en cas de perte de réponse</b></p><p style=\"margin:0 0 6px;\">Une perte de réponse ne signifie pas nécessairement un échec mécanistique : rechercher une sous-exposition pharmacocinétique.</p><ul class=\"bullet-list\"><li><b>1. Vérifier l'activité objective de la MICI</b> : clinique, CRP, calprotectine fécale, endoscopie/imagerie selon le contexte.</li><li><b>2. Dosage pharmacologique</b> : concentration résiduelle d'infliximab, anticorps anti-infliximab.</li><li><b>3. Adapter le traitement</b> : raccourcir l'intervalle, augmenter la dose, ou changer de mécanisme si véritable échec pharmacodynamique.</li></ul><p style=\"margin:8px 0 0;\">Le GETAID recommande une évaluation de la réponse clinique et biologique dans les 12 semaines suivant l'introduction, et une évaluation endoscopique/transmurale dans les 6 à 12 mois.</p></div><div style=\"background:#E4E9FA;border-left:4px solid #35449B;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#35449B;font-weight:bold;\">3. Immunogénicité</p><p style=\"margin:0 0 8px;\">L'infliximab, anticorps chimérique, est immunogène :<br>Infliximab → anticorps anti-infliximab (ATI) → concentration d'infliximab ↓ → perte de réponse ± réaction à la perfusion.</p><p style=\"margin:0 0 6px;\">L'association à un immunomodulateur peut réduire l'immunogénicité :</p><ul class=\"bullet-list\"><li>Azathioprine</li><li>6-mercaptopurine</li><li>Méthotrexate</li></ul><p style=\"margin:8px 0 0;\">Le GETAID indique qu'une association à un immunomodulateur peut être utilisée, notamment pendant les premiers mois du traitement.</p></div><div style=\"background:#FBE7EC;border-left:4px solid #9B3355;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#9B3355;font-weight:bold;\">4. Effets indésirables et contre-indications</p><p style=\"margin:6px 0 4px;\"><b>Infections</b> — risque augmenté</p><ul class=\"bullet-list\"><li>Infections bactériennes, virales, fongiques, opportunistes</li><li><b>Tuberculose</b></li><li>Réactivation du VHB</li></ul><p style=\"margin:6px 0 0;\">Le GETAID considère les patients sous anti-TNF comme <b>immunodéprimés</b>.</p><p style=\"margin:10px 0 4px;\"><b>Réactions à la perfusion</b></p><ul class=\"bullet-list\"><li>Céphalées, fièvre, frissons, prurit, rash, dyspnée, hypotension/hypertension</li><li>Réaction anaphylactique exceptionnelle</li></ul><p style=\"margin:6px 0 0;\">Les premières perfusions IV sont généralement réalisées avec une surveillance rapprochée.</p><p style=\"margin:10px 0 4px;\"><b>Autres effets indésirables</b></p><ul class=\"bullet-list\"><li>Cytopénies, élévation des transaminases, réactions cutanées</li><li>Insuffisance cardiaque / aggravation d'une insuffisance cardiaque</li><li>Maladies démyélinisantes rares, syndrome lupique induit</li><li>Certains cancers, notamment cutanés et lymphoprolifératifs</li></ul><p style=\"margin:12px 0 4px;\"><b>Contre-indications majeures</b></p><ul class=\"bullet-list\"><li>Infection sévère active</li><li>Tuberculose active</li><li>Hypersensibilité à l'infliximab</li><li>Insuffisance cardiaque modérée à sévère (NYHA III-IV)</li></ul><p style=\"margin:10px 0 4px;\"><b>Situations temporaires à rechercher</b></p><ul class=\"bullet-list\"><li>Infection évolutive, abcès abdominal ou périnéal</li><li>Tuberculose latente non prise en charge</li><li>Infection chronique active, hépatite B active/réactivation</li></ul><p style=\"margin:8px 0 0;\">Le GETAID rappelle qu'une infection évolutive ou un abcès abdominal/périnéal constitue une contre-indication temporaire jusqu'au contrôle de l'infection.</p></div><div style=\"background:#FDF3D6;border-left:4px solid #8A6D0E;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#8A6D0E;font-weight:bold;\">5. Bilan pré-thérapeutique, vaccinations et grossesse</p><p style=\"margin:6px 0 4px;\"><b>Bilan avant introduction</b></p><ul class=\"bullet-list\"><li><b>Tuberculose</b> : IGRA ± radiographie thoracique, à la recherche d'une tuberculose latente ou active.</li><li><b>Hépatite B</b> : Ag HBs + Ac anti-HBc + Ac anti-HBs → prise en charge spécialisée si infection ancienne ou active.</li><li><b>Selon le contexte</b> : VHC, VIH, VZV, recherche d'infection en cours.</li></ul><p style=\"margin:10px 0 4px;\"><b>Vaccinations</b></p><p style=\"margin:0 0 6px;\">À mettre à jour avant l'introduction du traitement si possible. Le GETAID recommande de vérifier le statut vaccinal dès le diagnostic de MICI et considère les patients sous anti-TNF comme immunodéprimés.</p><p style=\"margin:0 0 4px;\"><b>Vaccins vivants à éviter pendant le traitement</b> : BCG, ROR, varicelle, fièvre jaune, rotavirus, polio orale.</p><p style=\"margin:0 0 0;\">Lorsqu'un vaccin vivant est nécessaire, le GETAID recommande de respecter un délai avant l'introduction ou la reprise de l'immunosuppresseur.</p><p style=\"margin:10px 0 4px;\"><b>Grossesse</b></p><p style=\"margin:0;\">L'infliximab peut être utilisé pendant la grossesse lorsque nécessaire. Le GETAID considère les anti-TNF comme compatibles avec la conception et utilisables pendant la grossesse, avec adaptation éventuelle du calendrier thérapeutique au cas par cas.</p></div><div style=\"background:#E4EEEA;border-left:4px solid #1F4B3F;border-radius:8px;padding:14px 18px;margin:16px 0;\"><p style=\"margin:0 0 10px;color:#1F4B3F;font-weight:bold;\">À retenir</p><p style=\"margin:0 0 6px;\"><b>Infliximab = anti-TNFα</b> — MICI modérée/sévère.</p><p style=\"margin:0 0 6px;\"><b>Schéma classique</b> : 5 mg/kg IV, S0 → S2 → S6, puis toutes les 8 semaines.</p><p style=\"margin:0 0 6px;\"><b>Si perte de réponse</b> : activité objective → taux résiduel + anticorps anti-infliximab → optimisation ou changement de mécanisme.</p><p style=\"margin:0 0 6px;\"><b>Optimisation possible</b> : jusqu'à 10 mg/kg toutes les 4 semaines (IV) ; ou 120 mg/semaine ou 240 mg/2 semaines (SC) selon la situation.</p><p style=\"margin:0 0 6px;\"><b>Avant de commencer</b> : tuberculose + VHB + vaccinations + recherche d'infection/abcès.</p><p style=\"margin:0 0 6px;\"><b>3 complications majeures</b> : infections, réactions à la perfusion, immunogénicité (ATI).</p><p style=\"margin:0 0 6px;\"><b>4 situations à connaître</b> : tuberculose active, infection sévère active, hypersensibilité, insuffisance cardiaque NYHA III-IV.</p><p style=\"margin:0;\"><b>Message pratique</b> : ne pas conclure trop vite à un échec de l'infliximab — rechercher d'abord une sous-exposition pharmacocinétique.</p></div>","id": "f83290ba-fc6e-40b3-9176-fe07565303a2","tags": [],"titre": "INFLIXIMAB","urgent": false},{"categorie": "","contenu": "<p style=\"margin:0 0 6px\"><i style=\"color: var(--ink); font-family: inherit\">Panorama des préparations commercialisées en France, à partir des données ANSM, HAS et du consensus SFED sur la préparation colique.</i><br></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">Généralités</p><ul class=\"bullet-list\"><li>La qualité de la préparation conditionne directement le taux de détection des polypes et la sécurité de l'examen.</li><li>Un régime pauvre en résidus est généralement recommandé les <b>1 à 3 jours</b>&nbsp;précédant l'examen.</li><li>La <b>prise fractionnée</b> (« split-dose » : une partie la veille, une partie le matin de l'examen, en respectant un délai minimal avant le geste) améliore la qualité de la préparation par rapport à une prise unique, quelle que soit la préparation utilisée, et est recommandée par la SFED.</li></ul></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">1. MACROGOL (PEG)</p><p style=\"margin:0 0 8px\"><b>Mécanisme</b> : laxatif osmotique iso-osmotique au plasma, non absorbé — l'effet est purement mécanique par lavage volumique, sans échange hydro-électrolytique significatif avec l'organisme.</p><table><thead><tr><th>Nom commercial</th><th>DCI / composition</th><th>Volume total à ingérer</th></tr></thead><tbody><tr><td><b>Fortrans®</b></td><td>Macrogol 4000 + électrolytes (chlorure de sodium, bicarbonate de sodium, chlorure de potassium)</td><td>4 L (4 sachets)</td></tr><tr><td><b>Klean-Prep®</b></td><td>Macrogol 3350/4000 + électrolytes</td><td><b>4 L (</b>4 sachets)</td></tr><tr><td><b>Colopeg®</b></td><td>Macrogol 3350, chlorure de sodium, sulfate de sodium, chlorure de potassium, bicarbonate de sodium</td><td><b>4 L </b>(4 sachets)</td></tr><tr><td><b>Ximepeg®</b></td><td>Macrogol + électrolytes (générique)</td><td>4 L</td></tr><tr><td><b>Moviprep®</b></td><td>Macrogol 3350 + ascorbate de sodium/acide ascorbique + électrolytes</td><td><b>2 L </b>de solution + <b>1 L </b>de liquide clair supplémentaire (total 3 L)</td></tr><tr><td><b>Plenvu®</b></td><td>Macrogol 3350 + sulfate de sodium + acide ascorbique/ascorbate de sodium</td><td>2 doses de 500 mL + au moins 500 mL de liquide clair après chaque dose (total environ 3 L) — non remboursé en France</td></tr></tbody></table></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Solutions à base de sulfates</p><p style=\"margin:0 0 8px\"><b>Mécanisme</b> : laxatif osmotique à base de sulfates (sodium, magnésium, potassium) ou associant un stimulant (picosulfate de sodium) à un osmotique (citrate de magnésium) — volume de solution à ingérer plus faible, mais nécessitant un apport hydrique additionnel important pour prévenir la déshydratation.</p><table><thead><tr><th>Nom commercial</th><th>DCI / composition</th><th>Volume total à ingérer</th></tr></thead><tbody><tr><td><b>Izinova®</b></td><td>Sulfate de sodium, sulfate de potassium, sulfate de magnésium</td><td>2 sachets dilués chacun dans 500 mL d'eau + au moins 500 mL de liquide clair après chaque prise (total environ 2 L)</td></tr><tr><td><b>Citrafleet®</b></td><td>Picosulfate de sodium + oxyde de magnésium léger + acide citrique (11 g)</td><td>2 sachets dilués chacun dans 150 mL d'eau + hydratation abondante conseillée (1,5 à 2 L de liquide clair au total) ; réservé à l'adulte (&gt; 18 ans)</td></tr><tr><td><b>Picoprep®</b></td><td>Picosulfate de sodium + citrate de magnésium + acide citrique (12 g)</td><td>Identique à Citrafleet® ; utilisable dès l'âge de 1 an</td></tr></tbody></table></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">3. Préparations phosphatées (usage restreint)</p><p style=\"margin:0 0 8px\"><b>Mécanisme</b> : laxatif osmotique à base de phosphate de sodium, entraînant des mouvements hydriques importants vers la lumière intestinale.</p><p style=\"margin:0 0 8px\">Classe historique (Colokit®, Prepacol®, Recholan®, Normacol lavement® — ce dernier étant un lavement rectal et non une préparation par voie orale complète) dont l'usage a fortement régressé en France, en raison du <b>risque de troubles hydro-électrolytiques et de néphropathie aiguë aux phosphates</b>, potentiellement grave et parfois irréversible.</p><p style=\"margin:0\">Ces préparations sont désormais largement supplantées par les macrogols et les solutions sulfatées, à privilégier en première intention.</p></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">4. Laxatifs stimulants (séné)</p><p style=\"margin:0\"><b>Xprep®</b> (séné, dérivé anthracénique) : laxatif stimulant, utilisé ponctuellement en complément d'une préparation osmotique plutôt qu'en préparation unique de référence pour une coloscopie totale.</p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">5. Indications communes</p><p style=\"margin:0\">Toutes ces préparations partagent la même indication de principe : <b>lavage colique préalable à un examen ou une intervention nécessitant un côlon propre</b> — coloscopie, exploration radiologique, chirurgie colique.</p></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">6. Contre-indications et précautions</p><p style=\"margin:6px 0 4px\"><b>Communes à toutes les préparations</b></p><ul class=\"bullet-list\"><li>Occlusion ou perforation digestive suspectée ou confirmée</li><li>Iléus, mégacôlon toxique, colite grave évolutive</li><li>Hypersensibilité connue à l'un des composants</li></ul><p style=\"margin:8px 0 4px\"><b>Spécifiques aux macrogols</b></p><ul class=\"bullet-list\"><li>Prudence en cas <b>d'insuffisance cardiaque sévère</b> (volume important à ingérer)</li></ul><p style=\"margin:8px 0 4px\"><b>Spécifiques aux solutions sulfatées et picosulfatées</b></p><ul class=\"bullet-list\"><li><b>Insuffisance rénale sévère, insuffisance cardiaque décompensée</b></li><li>Prudence en cas de traitement par diurétiques, IEC/ARA2, ou risque de déshydratation (sujet âgé, hydratation insuffisante)</li></ul><p style=\"margin:8px 0 4px\"><b>Spécifiques aux préparations phosphatées</b></p><ul class=\"bullet-list\"><li>Insuffisance rénale, insuffisance cardiaque, âge avancé, déshydratation, traitement par IEC/ARA2/diurétiques/AINS — situations à haut risque de néphropathie aiguë aux phosphates, justifiant leur évitement en pratique courante</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : ANSM, Risques liés à l'utilisation des préparations coliques ; HAS, avis de la Commission de la Transparence (Colopeg, Ximepeg, Plenvu) ; Heresbach D, et al., Consensus en endoscopie digestive : préparation colique pour la coloscopie totale, SFED, 2011 (addendum 2012). À vérifier auprès du résumé des caractéristiques du produit (RCP) de chaque spécialité et à adapter aux disponibilités et recommandations locales.</i></p>","id": "preparations-coliques","tags": ["préparation colique","coloscopie","PEG"],"titre": "PREPARATIONS COLIQUES POUR COLOSCOPIE","urgent": false}];


  var RECO_SEED = [{"categorie": "MICI","contenu": "Le GUSELKUMAB est désormais remboursé dans 2 indications : \n- Maladie de Crohn : en 2ème ligne après échec d'au moins 1 anti-TNFalpha en IV ou en SC \n- RCH: en 3ème ligne après échec d'au moins 1 anti-TNFalpha et 1 anti intégrine en SC seulement\n\nAnticorps monoclonal, anti IL-23\n\nEtude GALAXI2 et GALAXI3 ont montré que le Guselkumab faisait mieux que le placébo et au moins aussi bien que certains autres traitements de type Ustékinumab dans la Maladie de Crohn. Pour la RCH les études QUASAR et ASTRO ont montré de bon résultats également.\n\nInduction :\n- IV : S0, S4 et S8 200 mg\n- SC : S0, S4 et S8 400 mg\nEntretien en SC :\n- S16 toutes les 8 semaines 100 mg\n- S12 toutes les 4 semaines 200 mg\n\nEffets indésirables :\n- Hypersensibilité à la molécule\n- Infections\n- Réaction au point d'injection\n- Maux de tête\n\nSource : GETAID","id": "2ef89ad8-8d69-41a5-966d-a1a4034d30ba","tags": ["GUSELKUMAB","anti IL-23","MICI"],"titre": "GUSELKUMAB (Tremfya)","urgent": false}];
  var ETUDES_SEED = [{"categorie": "Pancréatologie","contenu": "<i>INÉBILIZUMAB DANS LA MALADIE LIÉE AUX IgG4</i><div><br></div><div>🎯 <u>Question<br></u><p><b><span style=\"color: var(--ink); font-family: inherit\">L'INEBILIZUMAB</span>&nbsp;permet-il de prévenir les poussées de maladie liée aux IgG4 (MAG4) et de réduire le recours aux corticoïdes ?</b></p><u>💊 Traitement étudié</u><p><b><span>INEBILIZUMAB</span><br></b></p><ul><li><p>Anticorps monoclonal <b>anti-CD19.</b></p></li><li><p>Provoque une déplétion importante des lymphocytes B CD19+.</p></li><li><p>Les lymphocytes B et les plasmablastes jouent un rôle important dans la physiopathologie de la maladie liée aux IgG4.</p></li></ul><u>🔬 Méthodologie</u><ul><li><p>Essai de <strong>phase 3</strong>.</p></li><li><p>Randomisé.</p></li><li><p>Double aveugle.</p></li><li><p>Contrôlé contre placebo.</p></li><li><p><strong>135 patients</strong>.</p></li><li><p>68 patients : inébilizumab.</p></li><li><p>67 patients : placebo.</p></li><li><p>Suivi : <strong>52 semaines</strong>.</p></li><li><p>Patients atteints de maladie liée aux IgG4 avec atteinte d’un ou plusieurs organes.</p></li></ul><u>Atteinte pancréatique</u><p>Environ <strong>52 % des patients</strong> présentaient une atteinte du pancréas.</p><p>⚠️ L’étude porte donc sur la <strong>maladie liée aux IgG4 dans son ensemble</strong>, et non exclusivement sur la pancréatite auto-immune de type 1.</p><u>🔎 Critère de jugement principal</u><p><strong>Temps jusqu’à la première poussée de maladie liée aux IgG4 nécessitant un traitement</strong>, après décroissance des corticoïdes.</p><p>En pratique :<br>→ L’objectif était de déterminer si l’inébilizumab pouvait <strong>retarder ou prévenir les rechutes</strong>.</p><u>📊 Résultats principaux</u><table><thead><tr><th></th><th>INEBILIZUMAB</th><th>Placebo</th></tr></thead><tbody><tr><td>≥ 1 poussée</td><td><strong>10 %</strong></td><td><strong>60 %</strong></td></tr></tbody></table><p><strong>HR = 0,13 ; IC95 % 0,06–0,28 ; p &lt; 0,001</strong></p><p>→ Réduction majeure du risque de poussée sous&nbsp;<span>INEBILIZUMAB</span>.</p>🟢 <u>Rémission<br></u><p><span style=\"color: var(--ink); font-family: inherit\">L'INEBILIZUMAB</span>&nbsp;augmentait également la probabilité :</p><ul><li><p>de rémission complète sans poussée ;</p></li><li><p>de rémission sans poussée et sans corticoïdes.</p></li></ul><u>⚠️ Tolérance</u><p>Événements indésirables graves :</p><ul><li><p><strong>18 %</strong> sous&nbsp;<span>INEBILIZUMAB</span>&nbsp;;</p></li><li><p><strong>9 %</strong> sous placebo.</p></li></ul><p>La déplétion des lymphocytes B expose notamment à une problématique de <strong>risque infectieux</strong>.</p><u>🧠 À RETENIR</u><p><strong>MITIGATE = anti-CD19 dans la maladie liée aux IgG4.</strong></p><p>➡️ 135 patients, essai randomisé contre placebo.<br>➡️ INEBILIZUMAB = déplétion des lymphocytes B CD19+.<br>➡️ Environ 52 % avaient une atteinte pancréatique.<br>➡️ <strong>10 % de poussées sous inébilizumab vs 60 % sous placebo.</strong><br>➡️ Réduction très importante du risque de rechute à 1 an.<br>➡️ Augmentation des rémissions sans corticoïdes.</p><u>⚠️ Message clinique</u><p>MITIGATE démontre surtout l’intérêt de l'<span>INEBILIZUMAB</span>&nbsp;pour la <strong>prévention des rechutes de maladie liée aux IgG4</strong>.</p><p>Ce n’est pas une étude démontrant que l'<span>INEBILIZUMAB</span>&nbsp;doit être utilisé comme traitement initial d’une <strong>pancréatite auto-immune inaugurale</strong>.</p></div>","id": "4d1094e2-06e7-4ff2-a88f-ce6ce305e5eb","tags": ["MITIGATE","igG4","pancréatite"],"titre": "MITIGATE","urgent": false},{"categorie": "Oncologie","contenu": "<b><u>RASolute 302</u></b><div><br></div><div><u>1. Introduction&nbsp;</u><p>L’adénocarcinome canalaire du pancréas (PDAC) est caractérisé par une activation très fréquente de la voie RAS : des mutations oncogéniques de RAS sont retrouvées chez <b>plus de 90 % </b>des patients, principalement au niveau de <b>KRAS.</b></p><p>Le <strong>DARAXONRASIB (RMC-6236)</strong> est un inhibiteur oral « RAS(ON) » <b>multisélectif</b> qui cible la forme active de RAS et inhibe la signalisation dépendante de RAS.</p><p>RASolute 302 évalue le DARAXONRASIB chez des patients présentant un PDAC métastatique ayant déjà reçu une première ligne de traitement.</p><u>2. Présentation de l’étude</u><ul><li><p><strong>RASolute 302</strong></p></li><li><p><strong>NCT06625320</strong></p></li><li><p><strong>Phase III</strong></p></li><li><p>Internationale, multicentrique, ouverte, randomisée</p></li><li><p><strong>500 patients randomisés</strong></p></li><li><p>Ratio de randomisation : <strong>1:1</strong></p></li><li><p><b>Population : PDAC métastatique préalablement traité</b></p></li><li><p>Promoteur : Revolution Medicines</p></li><li><p>L’étude est aujourd’hui <strong>close aux inclusions</strong>.</p></li></ul><u>3. Objectif principal</u><p>Évaluer si le <strong>DARAXONRASIB</strong> améliore la <strong>survie globale (OS)</strong> et la <strong>survie sans progression (PFS)</strong> par rapport à une chimiothérapie choisie par l’investigateur.</p><p>Les deux critères principaux étaient évalués dans la population présentant une <strong>mutation RAS G12</strong>.</p><u>4. Critères de jugement principaux</u><p><strong>Double critère principal :</strong></p><ul><li><p><strong>Survie globale (OS)</strong></p></li><li><p><strong>Survie sans progression (PFS)</strong></p></li></ul><p>dans la population <strong>RAS G12 mutée</strong>, évaluées notamment par une revue centralisée indépendante en <b>aveugle</b>.</p><p><u>Les critères secondaires </u>comprenaient notamment l'OS, la PFS, le taux de réponse objective (ORR), la durée de réponse et la qualité de vie dans la population globale.</p><u>5. Principaux critères d'inclusion</u><ul><li><p>≥ <strong>18 ans</strong></p></li><li><p>PDAC confirmé histologiquement ou cytologiquement</p></li><li><p>Maladie <strong>métastatique</strong></p></li><li><p><strong>1 ligne antérieure</strong> de traitement dans le contexte métastatique, à base de 5-FU ou de GEMCITABINE</p></li><li><p>Progression de la maladie après cette ligne</p></li><li><p><strong>ECOG 0–1</strong></p></li><li><p>Maladie mesurable selon <strong>RECIST 1.1</strong></p></li><li><p>Fonction médullaire, hépatique, rénale et coagulation adéquates</p></li><li><p>Statut mutationnel <strong>RAS documenté</strong></p></li><li><p>Capacité à prendre un traitement oral.</p></li></ul><p>À noter : la présence d'une mutation RAS G12 n'était pas nécessaire pour l'inclusion. La population globale comprenait les patients avec mutation RAS G12, G13 ou Q61 ainsi que certains patients sans mutation RAS identifiée.</p><u>6. Traitements étudiés&nbsp;</u></div><div>- BRAS EXPÉRIMENTAL<p><strong>DARAXONRASIB 300 mg PO 1 fois/jour</strong></p><p>Traitement poursuivi jusqu'à progression ou toxicité inacceptable.</p>- BRAS CONTRÔLE<p><strong>CHIMIOTHÉRAPIE AU CHOIX DE L'INVESTIGATEUR</strong>, parmi :</p><ul><li><p><strong>GEMCITABINE + NAB-PACLITAXEL</strong></p></li><li><p><strong>mFOLFIRINOX</strong></p></li><li><p><strong>NAL-IRI + 5-FU + ACIDE FOLINIQUE</strong></p></li><li><p><strong>FOLFOX</strong></p></li></ul><p>Les patients recevaient le traitement jusqu'à progression ou toxicité inacceptable.</p><u>7. Premiers résultats</u></div><div><span style=\"color: var(--ink); font-family: inherit\">Les résultats définitifs de RASolute 302 ont été publiés en 2026 dans le </span><b><em style=\"color: var(--ink); font-family: inherit\">New England Journal of Medicine</em><span style=\"color: var(--ink); font-family: inherit\">.</span></b><p><strong>500 patients</strong> ont été randomisés :</p><ul><li><p><strong>248</strong> dans le bras <strong>DARAXONRASIB</strong></p></li><li><p><strong>252</strong> dans le bras <strong>CHIMIOTHÉRAPIE</strong>.</p></li></ul><p>Dans la population <strong><u>RAS G12</u></strong> : Daraxonrasib vs chimiothérapie&nbsp;</p><strong>- OS médiane&nbsp;</strong><strong>13,2 mois vs&nbsp;</strong><strong>6,6 mois (HR OS 0,40)</strong></div><div><strong>- PFS médiane&nbsp;</strong><strong>7,3 mois vs&nbsp;</strong><strong>3,5 mois (</strong><b>HR PFS</b>&nbsp;<strong>0,45)</strong><p>Les différences étaient statistiquement significatives (<strong>p &lt; 0,001</strong>).</p><p>Dans la <u><strong>population globale</strong> </u>:</p><ul><li><p>OS médiane : <strong>13,2 vs 6,7 mois</strong></p></li><li><p>PFS médiane : <strong>7,2 vs 3,6 mois</strong></p></li><li><p>HR OS : <strong>0,40</strong></p></li><li><p>HR PFS : <strong>0,49</strong></p></li><li><p><strong>p &lt; 0,001</strong> pour les deux comparaisons.</p></li></ul><u>8. Tolérance</u><p>Des événements indésirables ont été rapportés chez 100 % des patients dans le bras <strong>DARAXONRASIB</strong> et 97,7 % dans le bras chimiothérapie.</p><p>Événements indésirables de grade ≥3 :</p><ul><li><p><strong>61,8 %</strong> avec <strong>DARAXONRASIB</strong></p></li><li><p><strong>69,6 %</strong> avec chimiothérapie</p></li></ul><p>Les événements indésirables liés au traitement ayant conduit à l'arrêt du traitement concernaient :</p><ul><li><p><strong>1,2 %</strong> avec <strong>DARAXONRASIB</strong></p></li><li><p><strong>11,2 %</strong> avec chimiothérapie.</p></li></ul><u>9. Conclusion</u><p>RASolute 302 est une étude de phase III majeure évaluant une approche ciblant directement la voie <strong>RAS</strong> dans le PDAC métastatique préalablement traité.</p><p>Dans cette population, le <strong>DARAXONRASIB</strong> a montré une amélioration de la <strong>survie globale</strong> et de la <strong>survie sans progression</strong> par rapport à la chimiothérapie choisie par l'investigateur, avec un bénéfice également retrouvé dans la population globale de l'étude.</p><p><strong>Attention :</strong> cette étude concerne des patients <strong>déjà traités pour leur maladie métastatique</strong>. Elle ne correspond donc pas à une situation de première ligne métastatique.</p><p><u>Actualité</u> : En <strong>août 2026, la FDA a approuvé le DARAXONRASIB</strong> pour certains adultes atteints d'adénocarcinome pancréatique métastatique ayant reçu au moins une ligne systémique ou n'étant pas candidats à une polychimiothérapie.<br></p></div>","id": "60c059fb-20a1-48ce-92ac-9b8e0f213404","tags": ["RASOLUTE 302","DARAXONRASIB","pancréas"],"titre": "RASOLUTE 302","urgent": false},{"categorie": "Oncologie","contenu": "<b><u>RASolute 303&nbsp;</u></b><div><br></div><div><u>1. Introduction&nbsp;</u><p>L'adénocarcinome canalaire du pancréas (PDAC) métastatique reste associé à un pronostic défavorable malgré les chimiothérapies disponibles.</p><p>La voie <strong>RAS</strong> constitue un mécanisme oncogénique majeur du PDAC : des altérations de RAS sont retrouvées chez plus de 90 % des patients.</p><p>Le <strong>DARAXONRASIB</strong> est un inhibiteur oral « RAS(ON) » multisélectif qui cible la forme active de RAS et inhibe sa signalisation.</p><p>Après des résultats encourageants obtenus en phase I/II, RASolute 303 évalue le DARAXONRASIB en <strong>première ligne</strong> du PDAC métastatique, seul ou associé à une chimiothérapie.</p><u>2. Présentation de l'étude</u><ul><li><p><strong>RASolute 303</strong></p></li><li><p><strong>NCT07491445</strong></p></li><li><p><strong>Phase III</strong></p></li><li><p>Internationale, multicentrique, ouverte, randomisée</p></li><li><p>Environ <strong>900 patients</strong></p></li><li><p>Randomisation <strong>1:1:1</strong></p></li><li><p><b>PDAC métastatique non préalablement traité</b></p></li><li><p>Étude actuellement <strong>en cours de recrutement</strong>.</p></li></ul><u>3. Objectif principal</u><p>Évaluer l'efficacité et la tolérance :</p><ul><li><p>du <strong>DARAXONRASIB</strong> en monothérapie</p></li><li><p>du <strong>DARAXONRASIB + GEMCITABINE + NAB-PACLITAXEL</strong></p></li></ul><p>par rapport à <strong>GEMCITABINE + NAB-PACLITAXEL</strong> en première ligne du PDAC métastatique.</p><u>4. Critères de jugement principaux</u><p>Double critère principal :</p><ul><li><p><strong>SURVIE GLOBALE (OS)</strong></p></li><li><p><strong>SURVIE SANS PROGRESSION (PFS)</strong></p></li></ul><p>L'étude est conçue pour évaluer ces critères dans la population globale.</p><u>5. Principaux critères d'inclusion</u><ul><li><p>≥ <strong>18 ans</strong></p></li><li><p>PDAC métastatique confirmé histologiquement ou cytologiquement</p></li><li><p><strong>Aucun traitement antérieur dans le contexte métastatique</strong></p></li><li><p>ECOG <strong>0–1</strong></p></li><li><p>Statut RAS documenté : mutation ou type sauvage</p></li><li><p>Fonction médullaire, hépatique et rénale compatible avec le traitement</p></li><li><p>Maladie évaluable selon les critères RECIST 1.1.</p></li></ul><p><strong>&gt; Point important : la présence d'une mutation RAS n'est pas obligatoire.</strong></p><p>RASolute 303 est donc conçue pour inclure les patients <strong>quel que soit leur génotype RAS</strong>.</p><u>6. Traitements étudiés</u></div><div>BRAS 1 – EXPÉRIMENTAL<p><strong>DARAXONRASIB 300 mg PO 1×/jour</strong></p><p>→ Monothérapie</p>BRAS 2 – EXPÉRIMENTAL<p><strong>DARAXONRASIB 200 mg PO 1×/jour</strong></p><p><strong>GEMCITABINE + NAB-PACLITAXEL</strong></p><p>→ Administration de la chimiothérapie selon le schéma prévu dans le protocole.</p>BRAS 3 – CONTRÔLE<p><strong>GEMCITABINE + NAB-PACLITAXEL</strong></p><p>→ Traitement standard de comparaison.</p><u>7. Quels résultats avons-nous actuellement ?</u></div><div>Résultats de phase III : PAS ENCORE DISPONIBLES<p>RASolute 303 est toujours en cours de recrutement en 2026. Il n'est donc <strong>pas encore possible de comparer l'OS ou la PFS des trois bras</strong>.</p><p>Le registre européen indique actuellement une étude de phase III en cours, avec environ <strong>900 patients prévus</strong>.</p><u>Données préliminaires de phase I/II</u><p>Ces données ont néanmoins conduit au lancement de RASolute 303.</p>- <b>DARAXONRASIB en monothérapie</b><p>Chez des patients avec PDAC métastatique en première ligne, les données préliminaires rapportaient :</p><ul><li><p><strong>ORR : 47 %</strong></p></li><li><p><strong>DCR : 89 %</strong></p></li><li><p>suivi médian : <strong>9,3 mois</strong></p></li></ul><p>Ces résultats étaient obtenus chez 38 patients suffisamment suivis et nécessitent donc confirmation dans un essai randomisé de phase III.</p><b>- DARAXONRASIB + GEMCITABINE + NAB-PACLITAXEL</b><p>Dans la cohorte de première ligne :</p><ul><li><p><strong>ORR : 55 %</strong></p></li><li><p><strong>DCR : 90 %</strong></p></li><li><p>suivi médian : <strong>6,9 mois</strong></p></li></ul><p>Là encore, ces résultats sont préliminaires et ne permettent pas de conclure à un bénéfice comparatif par rapport à la chimiothérapie standard.</p><u>9. Conclusion</u><p>RASolute 303 est une étude de phase III qui cherche à déterminer si l'inhibition de RAS par le <strong>DARAXONRASIB</strong>, seul ou en association avec une chimiothérapie, peut améliorer les résultats en <strong>première ligne du PDAC métastatique</strong>.</p><p>Les données de phase I/II sont encourageantes, avec une activité antitumorale observée à la fois avec le <strong>DARAXONRASIB seul</strong> et avec <strong>DARAXONRASIB + GEMCITABINE + NAB-PACLITAXEL</strong>.</p><p><strong>Mais attention : les résultats de phase III de RASolute 303 ne sont pas encore disponibles.</strong></p><p><span style=\"color: var(--ink); font-family: inherit\"><u><b>Actualité</b></u> :&nbsp;</span><strong style=\"color: var(--ink); font-family: inherit\">Statut en septembre 2026 : étude de phase III en cours, pas encore de résultats comparatifs.</strong><br></p></div>","id": "8f8eb41e-3d7e-4a14-b567-6ab027d7b552","tags": ["RASOLUTE 303","pancréas","Daraxonrasib"],"titre": "RASOLUTE 303","urgent": false},{"categorie": "Oncologie","contenu": "<div>mFOLFIRINOX vs CAPECITABINE/GEMCITABINE en adjuvant des adénocarcinomes de l'ampoule réséqués.</div><div><br></div><div><u>1.Introduction&nbsp;</u><p>L’<strong>adénocarcinome de l’ampoule de Vater</strong> est une tumeur digestive rare, représentant environ <b>0,2 %</b> des cancers digestifs. Malgré une résection chirurgicale à visée curative, le risque de récidive reste important, avec environ <b>40 % de récidives dans les 2 ans</b> suivant la chirurgie.</p><p>Il existe une importante hétérogénéité histologique, avec notamment des sous-types <strong>intestinal</strong> et <b>pancréato-biliaire</b>.</p><p>La place de la chimiothérapie adjuvante reste discutée, notamment en raison de l’absence d’essai randomisé prospectif ayant clairement démontré le bénéfice d'une stratégie donnée. Les pratiques reposent donc sur des extrapolations des cancers pancréatiques, biliaires ou digestifs et sur des données rétrospectives.</p><u>2. Présentation de l’étude</u><ul><li><p><strong>Nom :</strong> AMPIRINOX</p></li><li><p><strong>Promoteur :</strong> FFCD</p></li><li><p><strong>Étude :</strong> PRODIGE 98 / FFCD 2105</p></li><li><p><strong>Phase III</strong>, randomisée, multicentrique, ouverte</p></li><li><p><strong>Population prévue :</strong> 294 patients</p></li><li><p><strong>Situation :</strong> <b>adénocarcinome de l’ampoule de Vater réséqué</b></p></li><li><p><strong>NCT :</strong> NCT06813976</p></li><li><p><strong>Début des inclusions :</strong> 2024</p></li><li><p><strong>Fin prévisionnelle des inclusions :</strong> octobre 2028.</p></li></ul><u>3. Objectif principal</u><p>Évaluer si une chimiothérapie adjuvante par <strong>mFOLFIRINOX</strong> améliore la <strong>survie sans récidive (DFS)</strong> par rapport à une monochimiothérapie par <strong>CAPECITABINE ou GEMCITABINE</strong> après résection d’un adénocarcinome ampullaire.</p><u>4. Critère de jugement principal</u><p><strong>Survie sans récidive (DFS) à 2 ans.</strong></p><p>L’hypothèse de l’étude est une amélioration de la DFS à 2 ans de :</p><p><strong>60 % → 71 %&nbsp;</strong><span style=\"color: var(--ink); font-family: inherit\">soit un </span><strong style=\"color: var(--ink); font-family: inherit\">HR attendu de 0,67</strong><span style=\"color: var(--ink); font-family: inherit\">.</span></p><p><u style=\"color: var(--ink); font-family: inherit\">5. Critères de jugement secondaires</u><br></p><ul><li><p><strong>Survie globale (OS)</strong></p></li><li><p>Tolérance / toxicités selon NCI-CTCAE v5.0</p></li><li><p>Pourcentage de patients complétant 3 et 6 mois de chimiothérapie</p></li><li><p>Qualité de vie : <strong>EORTC QLQ-C30 et QLQ-PAN26</strong></p></li><li><p>Analyses de DFS et OS dans des sous-groupes prédéfinis.</p></li></ul><u>6. Principaux critères d’inclusion</u><ul><li><p>≥ <strong>18 ans</strong></p></li><li><p><b>Adénocarcinome ampullaire confirmé histologiquement</b></p></li><li><p>Résection chirurgicale macroscopiquement complète : <strong>R0 ou R1</strong></p></li><li><p>Chirurgie réalisée depuis ≤ <strong>12 semaines</strong></p></li><li><p>Absence de maladie métastatique au scanner</p></li><li><p><strong>WHO 0–1</strong> ; WHO 0 si &gt;75 ans</p></li><li><p>CA 19-9 postopératoire <strong>&lt;180 U/mL</strong></p></li><li><p>Fonction biologique compatible avec le traitement</p></li><li><p>Consentement éclairé.</p></li></ul><p><u>Principaux critères d’exclusion :</u></p><ul><li><p>Chimiothérapie néoadjuvante</p></li><li><p>Tumeur <strong>pT1N0M0</strong></p></li><li><p>Neuropathie périphérique ≥ grade 2</p></li><li><p>Insuffisance rénale, hépatique ou hématologique significative</p></li><li><p>Déficit en DPD</p></li><li><p>Infection active non contrôlée</p></li><li><p>Altération de l’état nutritionnel importante.</p></li></ul><u>7. Traitements étudiés</u><p><strong>Bras expérimental – mFOLFIRINOX</strong></p><p>Toutes les 2 semaines pendant <strong>12 cures / 24 semaines</strong> :</p><ul><li><p>Oxaliplatine 85 mg/m²</p></li><li><p>Irinotécan 150 mg/m²</p></li><li><p>Acide folinique 400 mg/m²</p></li><li><p>5-FU 2400 mg/m² sur 46 h</p></li></ul><p><strong>Bras contrôle – monochimiothérapie</stron
