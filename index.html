ique</b> lorsqu'elle évolue depuis <b>plus de 4 semaines</b>, caractérisée par une augmentation de la fréquence <b>(habituellement &gt; 3 selles molles ou liquides par jour) et/ou du poids des selles (&gt; 200 g/j).</b></p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Signes d'alarme et interrogatoire</p><p style=\"margin:0 0 8px\"><b>Signes devant faire évoquer une cause organique</b> et accélérer le bilan :</p><ul class=\"bullet-list\"><li><font color=\"#e4281b\"><b>Amaigrissement, altération de l'état général</b></font></li><li><font color=\"#e4281b\"><b>Rectorragies ou méléna, réveil nocturne par les selles</b></font></li><li><font color=\"#e4281b\"><b>Fièvre associée</b></font></li><li><font color=\"#e4281b\"><b>Âge &gt; 50 ans (ou tout âge avec antécédents familiaux de cancer colorectal ou de MICI)</b></font></li><li><font color=\"#e4281b\"><b>Anomalies biologiques (anémie, syndrome inflammatoire, hypoalbuminémie)</b></font></li></ul><p style=\"margin:8px 0 0\"><b>Éléments systématiques de l'interrogatoire</b> : caractéristiques des selles (aqueuses, graisseuses, sanglantes), prise médicamenteuse (laxatifs, metformine, IPP, AINS, antibiotiques récents, chimiothérapie/immunothérapie), chirurgie digestive antérieure (résection iléale, cholécystectomie, chirurgie bariatrique), radiothérapie abdomino-pelvienne, voyages récents, contexte d'immunodépression.</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">3. Bilan de première intention</p><ul class=\"bullet-list\"><li><b>Biologie de première intention</b> : NFS, CRP, ionogramme sanguin, bilan hépatique, <b>TSH,</b> TP, albumine, sérologies VIH.</li><li><b>Calprotectine fécale</b> (ou CRP) : bonne valeur d'orientation entre cause organique et fonctionnelle selon le contexte clinique.</li><li><b>Sérologie de la maladie cœliaque</b> : anticorps anti-transglutaminase de type IgA, associés au dosage des IgA totales (pour ne pas méconnaître un déficit en IgA).</li><li><b>Examen parasitologique des selles sur 3 jours</b> (recherche notamment d'une giardiase), coproculture selon le contexte.</li><li>Selon l'orientation clinique : <b>élastase fécale</b> (insuffisance pancréatique exocrine), <b>test respiratoire</b> (pullulation bactérienne du grêle/SIBO), <b>chromogranine A et 5-HIAA urinaires</b> (suspicion de tumeur neuroendocrine).</li><li><b>Coloscopie avec iléoscopie et biopsies étagées systématiques</b> — y compris sur une muqueuse macroscopiquement normale, pour ne pas méconnaître une colite microscopique.</li><li><b>Endoscopie haute avec biopsies duodénales</b> en cas de suspicion de maladie cœliaque ou de malabsorption.</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Classification physiopathologique</p><table><thead><tr><th>Mécanisme</th><th>Caractéristiques</th><th>Exemples</th></tr></thead><tbody><tr><td><b>Osmotique</b></td><td>Cède au jeûne, trou osmotique fécal augmenté</td><td>Intolérance au lactose, ingestion de polyols/laxatifs osmotiques, malabsorption glucidique</td></tr><tr><td><b>Sécrétoire</b></td><td>Persiste au jeûne, trou osmotique normal, volume souvent important</td><td>Tumeurs neuroendocrines (VIPome, gastrinome, carcinoïde), laxatifs stimulants, malabsorption des sels biliaires</td></tr><tr><td><b>Malabsorption / maldigestion</b></td><td>Souvent associée à une stéatorrhée</td><td>Maladie cœliaque, insuffisance pancréatique exocrine, pullulation bactérienne du grêle</td></tr><tr><td><b>Inflammatoire / exsudative</b></td><td>Présence possible de sang ou de glaires, syndrome inflammatoire biologique</td><td>MICI, colites microscopiques, colite infectieuse chronique, cancer colorectal</td></tr><tr><td><b>Motrice</b></td><td>Accélération du transit sans anomalie sécrétoire ou absorptive majeure</td><td>Syndrome de l'intestin irritable, hyperthyroïdie, neuropathie diabétique autonome, séquelles chirurgicales (vagotomie, résection iléale)</td></tr></tbody></table></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">5. Principales causes à connaître</p><table><thead><tr><th>Catégorie</th><th>Causes principales</th></tr></thead><tbody><tr><td>Fonctionnelle</td><td>Syndrome de l'intestin irritable à prédominance diarrhéique (critères de Rome IV)</td></tr><tr><td>Organique digestive</td><td>MICI, colites microscopiques, maladie cœliaque, cancer colorectal, polype villeux sécrétant</td></tr><tr><td>Endocrinienne</td><td>Hyperthyroïdie, diabète (neuropathie autonome), tumeurs neuroendocrines, insuffisance surrénalienne</td></tr><tr><td>Médicamenteuse</td><td>Metformine, IPP, AINS, laxatifs, antibiotiques (colite à <i>C. difficile</i>), chimiothérapies, immunothérapies (colite immuno-induite)</td></tr><tr><td>Post-chirurgicale</td><td>Résection iléale (malabsorption des sels biliaires), vagotomie, résection gastrique, chirurgie bariatrique</td></tr><tr><td>Infectieuse chronique</td><td>Giardiase ; chez l'immunodéprimé : cryptosporidiose, microsporidiose, CMV</td></tr></tbody></table></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">6. Pièges à connaître</p><p style=\"margin:0 0 8px\"><b>Colites microscopiques</b> (colite collagène et colite lymphocytaire) : coloscopie <b>macroscopiquement normale</b> — le diagnostic ne peut être fait que sur des <b>biopsies systématiques</b>, y compris en muqueuse d'aspect normal. À évoquer devant une diarrhée aqueuse chronique, notamment chez le sujet d'âge moyen à avancé, avec une association fréquente à certains médicaments (IPP, AINS, inhibiteurs sélectifs de la recapture de la sérotonine).</p><p style=\"margin:0\"><b>Malabsorption des sels biliaires</b> : cause sous-diagnostiquée de diarrhée chronique, notamment après résection iléale ou cholécystectomie, mais aussi idiopathique. Peut être évoquée devant l'échec d'un bilan étiologique standard, et confirmée par un <b>test thérapeutique à la cholestyramine</b> lorsque les tests spécifiques (SeHCAT) ne sont pas disponibles.</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">7. Traitement</p><ul class=\"bullet-list\"><li><b>Traitement étiologique</b> en priorité, une fois la cause identifiée.</li><li><b>Traitement symptomatique</b> (uniquement une fois une cause organique grave raisonnablement écartée ou en association au traitement étiologique) : ralentisseurs du transit (lopéramide), racécadotril, réhydratation orale.</li><li><b>Cholestyramine</b> en cas de suspicion de malabsorption des sels biliaires.</li><li>Prise en charge nutritionnelle en cas de dénutrition ou de carences associées (fer, vitamines liposolubles en cas de malabsorption).</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : SNFGE/CREGG, recommandations sur la prise en charge de la diarrhée chronique de l'adulte ; American College of Gastroenterology (ACG) Clinical Guideline: Diagnosis and Management of Chronic Diarrhea; World Gastroenterology Organisation (WGO) Global Guideline: Diarrhoea. À confronter au contexte clinique individuel.</i></p>","id": "diarrhees-chroniques","tags": ["diarrhée chronique","colite microscopique","malabsorption","SNFGE","ACG"],"titre": "Diarrhées chroniques","urgent": false},{"categorie": "Imagerie","contenu": "<p style=\"margin:0 0 6px\"><b><i>Technique et coupes standardisées</i></b></p><p style=\"margin:0 0 10px\"><i>Repères pratiques pour la réalisation et la lecture d'une échographie hépatique, à partir des recommandations générales de bonne pratique en imagerie abdominale.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Préparation et matériel</p><ul class=\"bullet-list\"><li><b>Jeûne</b> d'au moins <b>6 heures</b> recommandé, pour limiter les gaz digestifs et permettre une réplétion vésiculaire satisfaisante.</li><li><b>Sonde convexe basse fréquence</b> (2 à 5 MHz), adaptée à la profondeur d'exploration abdominale ; une <b>sonde superficielle haute fréquence</b> peut compléter l'examen pour l'analyse fine d'une lésion sous-capsulaire.</li><li>Patient en <b>décubitus dorsal</b> en première intention, avec compléments en <b>décubitus latéral gauche</b> et en <b>position semi-assise ou debout</b> selon les besoins (dégagement costal, mobilisation d'une lithiase vésiculaire).</li><li><b>Inspiration profonde bloquée</b> : manœuvre clé pour abaisser le foie sous le rebord costal et améliorer l'accès aux segments hauts.</li></ul></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Voies d'abord et coupes standardisées</p><table><thead><tr><th>Coupe</th><th>Description et intérêt</th></tr></thead><tbody><tr><td><b>Sous-costale transversale</b> (balayage)</td><td>Balayage de gauche à droite le long du rebord costal ; vue d'ensemble du foie gauche et d'une grande partie du foie droit</td></tr><tr><td><b>Sous-costale oblique</b></td><td>Sonde orientée selon l'axe des côtes ; utile pour suivre la convexité diaphragmatique et explorer le dôme hépatique</td></tr><tr><td><b>Intercostale droite</b></td><td>Sonde placée dans les espaces intercostaux droits, patient en inspiration ; indispensable pour explorer les segments VI et VII du foie droit, souvent mal vus par voie sous-costale</td></tr><tr><td><b>Sagittale/longitudinale sous-xiphoïdienne</b></td><td>Exploration du lobe gauche (segments II, III et IV) et de la veine cave inférieure rétro-hépatique</td></tr><tr><td><b>Coupe sur la bifurcation portale</b></td><td>Repère central pour l'analyse de la veine porte et de ses branches droite et gauche</td></tr><tr><td><b>Coupe haute sous-costale ou intercostale, veines sus-hépatiques</b></td><td>Visualisation de la convergence des trois veines hépatiques dans la veine cave inférieure, juste sous le diaphragme</td></tr><tr><td><b>Coupe sur la vésicule et la voie biliaire principale</b></td><td>Souvent facilitée par le décubitus latéral gauche ou la position semi-assise, qui mobilisent une éventuelle lithiase</td></tr></tbody></table></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">3. Repères de la segmentation échographique</p><p style=\"margin:0 0 8px\">La segmentation de Couinaud peut être approchée en échographie à l'aide de repères vasculaires simples :</p><ul class=\"bullet-list\"><li>Le <b>ligament rond</b> (hyperéchogène, dans la scissure ombilicale) sépare les segments III et IV.</li><li>La <b>veine hépatique médiane</b> chemine dans le plan de la ligne de Cantlie, séparant le foie droit fonctionnel du foie gauche fonctionnel.</li><li>La <b>veine hépatique droite</b> sépare les segments antérieurs (V, VIII) des segments postérieurs (VI, VII) du foie droit.</li></ul><div><img src=\"5c1607562228efa2be3ca9f48d61f40c.png\"><br></div><ul class=\"bullet-list\"><li>La <b>veine porte</b> et ses branches segmentaires permettent de distinguer les segments supérieurs des segments inférieurs, de part et d'autre du plan portal.</li></ul><div><img src=\"f6680751ad55f30630fa6dad85a75239.png\"><br></div></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Étude Doppler</p><ul class=\"bullet-list\"><li><b>Veine porte</b> : analyse du sens du flux (normalement hépatopète, c'est-à-dire dirigé vers le foie), de la vitesse et du caractère modulé ou continu du flux.</li><li><b>Artère hépatique</b> : étude de l'index de résistance, utile notamment dans le bilan des hypertensions portales et le suivi post-transplantation.</li><li><b>Veines hépatiques</b> : analyse du caractère triphasique normal du flux, dont la perte oriente vers une pathologie parenchymateuse ou un obstacle au drainage veineux.</li><li>Le Doppler couleur et pulsé est systématique dans le bilan d'une hypertension portale, d'une suspicion de thrombose porte ou de syndrome de Budd-Chiari, et dans le suivi des shunts (TIPS).</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">5. Éléments à décrire systématiquement</p><ul class=\"bullet-list\"><li><b>Taille du foie</b> (flèche hépatique, mesurée sur la ligne médio-claviculaire) et <b>morphologie générale</b> des contours (réguliers ou bosselés, évocateurs de cirrhose).</li><li><b>Échostructure et échogénicité</b> du parenchyme (homogène ou hétérogène, hyperéchogène évoquant une stéatose). Comparaison avec l'échostructure rénale (semblable en situation normale). Foie stéatosique = hyperéchogène.</li><li><b>Recherche de lésion(s) focale(s)</b>, avec description de leur taille, contours, échostructure et vascularisation au Doppler.</li><li><b>Perméabilité de l'axe porte</b> et des veines hépatiques.</li><li><b>Voies biliaires</b> : calibre de la voie biliaire principale, présence de calculs vésiculaires, épaisseur de la paroi vésiculaire.</li><li><b>Rate</b> (taille) et recherche d'une ascite, souvent explorées dans le même temps que le foie en cas de suspicion d'hypertension portale<img src=\"c712cc49b33dc139c917612f495d564c.png\"><img src=\"70c699c83cef5d2cc8ff75e63a0ac3fc.png\"></li></ul><div>Foie hyperéchogène par rapport au rein droit -&gt; signe de stéatose&nbsp;</div></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">6. Limites et pièges</p><ul class=\"bullet-list\"><li><b>Obésité</b> et <b>interposition gazeuse digestive</b> : principales limites techniques, pouvant gêner l'analyse notamment du dôme hépatique et du foie gauche.</li><li><b>Opérateur-dépendance</b> : la qualité de l'examen varie selon l'expérience de l'échographiste, contrairement aux examens en coupes (scanner, IRM).</li><li>L'échographie reste néanmoins l'examen de première intention pour l'exploration hépatobiliaire, en raison de son accessibilité, de son innocuité (absence d'irradiation) et de sa bonne sensibilité pour la lithiase vésiculaire et la dilatation des voies biliaires.</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : ouvrages de référence en échographie abdominale (Bruel JM, et al.) ; recommandations générales de bonne pratique en imagerie hépatobiliaire. À adapter au matériel disponible et au protocole local.</i></p>","id": "echographie-hepatique","tags": ["échographie","foie","coupes","Doppler","technique"],"titre": "ECHOGRAPHIE HEPATIQUE","urgent": false},{"categorie": "Endoscopie","contenu": "<p style=\"margin:0 0 6px\"><i style=\"font-family: inherit\">Deux présentations d'une même complication rare de la lithiase biliaire : la migration d'un calcul par une fistule bilio-digestive.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Définitions et physiopathologie</p><p style=\"margin:0 0 8px\">Une lithiase vésiculaire ancienne, souvent méconnue, peut entraîner une <b>inflammation chronique</b> responsable de l'accolement de la vésicule biliaire à un organe digestif creux voisin — le plus souvent le <b>duodénum</b>, du fait de sa proximité anatomique. L'inflammation et la pression du calcul finissent par éroder la paroi, créant une <b>fistule bilio-digestive</b> (cholécysto-duodénale dans environ deux tiers des cas ; plus rarement cholécysto-colique ou cholécysto-gastrique), par laquelle le calcul migre dans la lumière digestive.</p><p style=\"margin:0 0 8px\">Selon la taille du calcul et le site où il vient buter :</p><ul class=\"bullet-list\"><li><b><font color=\"#3616d4\">Iléus biliaire</font></b> (au sens classique) : le calcul chemine dans l'intestin grêle et s'enclave le plus souvent au niveau de la <b>valvule iléo-cæcale</b>, zone la plus étroite du grêle, réalisant une <b>occlusion mécanique.</b></li><li><b><font color=\"#3918dc\">Syndrome de Bouveret</font></b> : variante plus rare, où le calcul reste bloqué plus haut, au niveau du <b>bulbe duodénal ou du pylore</b>, réalisant un tableau de sténose digestive haute.</li></ul><p style=\"margin:8px 0 0\">Un calcul doit généralement mesurer <b>plus de 2 à 2,5 cm</b> pour provoquer une obstruction symptomatique.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Épidémiologie et terrain</p><ul class=\"bullet-list\"><li>Cause rare d'occlusion du grêle (1 à 4 % des occlusions du grêle toutes causes confondues), mais qui doit être évoquée en priorité chez le <b>sujet âgé</b> (représentant jusqu'à 25 % des occlusions du grêle chez les plus de 65 ans <b>sans antécédent de chirurgie abdominale</b>).</li><li>Terrain typique : <b>femme âgée</b>, avec antécédent de lithiase vésiculaire connue ou méconnue.</li><li>Le syndrome de Bouveret représente une minorité des cas de migration lithiasique par fistule bilio-digestive, mais touche le même type de terrain.</li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">3. Présentation clinique</p><p style=\"margin:6px 0 4px\"><b>Iléus biliaire (occlusion du grêle)</b></p><ul class=\"bullet-list\"><li>Tableau <b>d'occlusion intestinale</b> : douleurs abdominales, vomissements, arrêt des matières et des gaz.</li><li>Évolution parfois <b>intermittente</b> caractéristique (« <i>tumbling obstruction</i> ») : le calcul peut migrer par à-coups dans le grêle, provoquant des épisodes occlusifs transitoires avant l'obstruction définitive — source fréquente de retard diagnostique.</li></ul><p style=\"margin:8px 0 4px\"><b>Syndrome de Bouveret (obstruction duodéno-pylorique)</b></p><ul class=\"bullet-list\"><li>Tableau de <b>sténose digestive haute</b> : vomissements alimentaires répétés et précoces après les repas, amaigrissement.</li><li>Une hématémèse est possible en cas d'érosion muqueuse associée.</li></ul></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">4. Diagnostic</p><p style=\"margin:0 0 8px\">Le <b>scanner abdomino-pelvien avec injection</b> est <u>l'examen de référence,</u> à la recherche de la <b>triade de RIGLER&nbsp;</b>(évocatrice mais inconstante, présente dans environ un tiers des cas) :</p><ol><li><b>Aérobilie</b> (pneumobilie) — air visible dans les voies biliaires, signant l'existence de la fistule</li><li><b>Occlusion mécanique</b> du grêle (iléus biliaire) ou <b>dilatation gastrique</b> (syndrome de Bouveret)</li><li><b>Calcul ectopique</b>, visible en dehors de la vésicule biliaire, au site de l'obstruction</li></ol><p style=\"margin:8px 0 0\">Dans le syndrome de Bouveret, l'<b>endoscopie digestive haute</b> permet le plus souvent de visualiser directement le calcul enclavé au niveau du bulbe duodénal ou du pylore, et constitue à la fois un outil diagnostique et le premier temps d'un geste thérapeutique.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">5. Prise en charge thérapeutique</p><p style=\"margin:6px 0 4px\"><b><u>Iléus biliaire (grêle)</u></b></p><ul class=\"bullet-list\"><li>Traitement le plus souvent <b>chirurgical</b> : <b>entérolithotomie</b> (extraction du calcul par voie chirurgicale), le plus souvent <b>sans traiter la fistule bilio-digestive dans le même temps</b> chez les patients âgés ou fragiles, cette dernière pouvant se refermer spontanément et le risque de récidive symptomatique étant faible.</li><li>Le traitement complet en un temps (entérolithotomie + cholécystectomie + fermeture de la fistule) est réservé aux patients en bon état général, du fait d'une morbi-mortalité opératoire plus élevée.</li></ul><p style=\"margin:8px 0 4px\"><b><u>Syndrome de Bouveret</u></b></p><ul class=\"bullet-list\"><li><b>Extraction endoscopique</b> à privilégier en première intention lorsque le calcul est accessible : extraction directe, fragmentation mécanique, ou lithotritie (laser, électrohydraulique) selon la taille et la disponibilité technique.</li><li>En cas d'échec endoscopique ou de calcul volumineux, recours à la <b>chirurgie</b> (gastrotomie ou duodénotomie avec extraction), avec traitement de la fistule au cas par cas selon le terrain.</li></ul><p style=\"margin:8px 0 0\">Dans les deux situations, une <b>prise en charge globale du terrain</b> est essentielle (réhydratation, correction hydroélectrolytique, antibiothérapie en cas de sepsis associé), compte tenu de la fréquence des comorbidités chez ces patients âgés.</p></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">6. Pronostic</p><p style=\"margin:0\">La mortalité de l'iléus biliaire reste plus élevée que celle des occlusions du grêle d'autres causes (historiquement de l'ordre de 12 à 18 % dans les séries anciennes), principalement en raison du <b>terrain fragile</b> (âge avancé, comorbidités) et d'un <b>retard diagnostique</b> fréquent, lié au caractère parfois trompeur ou intermittent de la présentation clinique initiale.</p></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Rigler LG, et al. Gallstone obstruction: pathogenesis and roentgen manifestations. JAMA 1941 (description de la triade de Rigler) ; revues générales sur l'iléus biliaire et le syndrome de Bouveret. À confronter au contexte clinique et au plateau technique disponible (faisabilité de l'extraction endoscopique).</i></p>","id": "ileus-biliaire-bouveret","tags": ["iléus biliaire","Bouveret","fistule bilio-digestive","lithiase vésiculaire","triade de Rigler"],"titre": "Iléus biliaire et syndrome de Bouveret","urgent": false},{"categorie": "Imagerie","contenu": "<div style=\"background:#E4EDF7; border-left:4px solid #24507C; padding:12px 16px; border-radius:6px; margin-bottom:16px\"><strong>Principe général :</strong> l'IRM abdominale combine plusieurs <b>séquences</b> (pondérations) qui n'explorent pas la même chose. Comprendre ce que \"voit\" chaque séquence permet d'interpréter le protocole adapté à chaque question clinique (foie, pancréas, voies biliaires, intestin grêle/côlon).</p></div><p style=\"margin:0 0 6px\"><b>1. Séquences de base, communes à tous les protocoles abdominaux</b></p><ul><li><b>T1 en phase / hors phase (in/out of phase, Dixon) :</b> détecte la <b>stéatose</b> (chute de signal en hors-phase) et différencie les lésions riches en graisse (adénome) ou en fer.</li><li><b>T2 (avec et sans saturation de graisse) :</b> excellent contraste liquidien ; les lésions kystiques, l'œdème et la bile apparaissent en <b>hypersignal franc</b>. Base de la cholangio-IRM.</li><li><b>Diffusion (DWI, plusieurs valeurs de b) et carte ADC :</b> sensible à la <b>cellularité</b> des tissus ; les lésions tumorales et les collections/abcès restreignent la diffusion (hypersignal b élevé + hyposignal ADC). Très sensible mais peu spécifique.</li><li><b>T1 dynamique après injection de gadolinium (3D, multiphasique) :</b> acquisitions répétées au temps <b>artériel</b>, <b>portal</b>, <b>veineux tardif</b> (± tardif à 5-10 min) pour caractériser le <b>rehaussement</b> des lésions (ex : CHC = rehaussement artériel puis <i>wash-out</i> portal/tardif).</li></ul><p style=\"margin:16px 0 6px\"><b>2. IRM hépatique</b></p><div style=\"background:#F1E7F7; border-left:4px solid #6B4C8A; border-radius:8px; padding:14px 18px; margin:10px 0\"><p style=\"margin:0 0 8px; font-weight:bold; color:#6B4C8A\">Indications principales</p><p style=\"margin:0\">Caractérisation de nodule hépatique, bilan d'extension de métastases (CCR notamment), diagnostic de CHC chez le cirrhotique, bilan de surcharge (fer, graisse), maladies vasculaires (Budd-Chiari, syndrome d'obstruction sinusoïdale).</p></div><ul><li><b>Produits de contraste extracellulaires</b> (gadolinium standard) : étude du rehaussement classique en 3-4 temps.</li><li><b>Produits de contraste hépatobiliaires</b> (gadoxétate disodique, Primovist®) : en plus des temps vasculaires, une <b>phase hépatobiliaire tardive</b> (15-20 min après injection) est acquise car le produit est capté par les hépatocytes puis excrété dans la bile → utile pour différencier <b>hyperplasie nodulaire focale</b> (captation, reste iso/hyperintense) d'<b>adénome</b> (pas de captation, hypo-intense), et pour détecter des métastases infracentimétriques.</li><li><b>Imagerie du fer :</b> séquences T2* multi-écho pour quantifier la surcharge en fer (hémochromatose).</li></ul><p style=\"margin:16px 0 6px\"><b>3. IRM pancréatique et wirsungo-IRM</b></p><div style=\"background:#EAF3EC; border-left:4px solid #2F6F5E; border-radius:8px; padding:14px 18px; margin:10px 0\"><p style=\"margin:0 0 8px; font-weight:bold; color:#2F6F5E\">Indications principales</p><p style=\"margin:0\">TIPMP (caractérisation du canal pancréatique principal et des canaux secondaires), pancréatite chronique (calcifications mieux vues en TDM, mais IRM excellente pour le canal), tumeurs kystiques, bilan d'extension d'adénocarcinome en complément du scanner.</p></div><ul><li>Séquences T1 avec saturation de graisse (le pancréas normal est spontanément hyperintense en T1, une perte de ce signal oriente vers une pancréatite chronique).</li><li>T2 et diffusion pour les lésions kystiques et solides.</li><li><b>Wirsungo-IRM (= cholangio-pancréato-IRM, CP-IRM) :</b> séquences T2 lourdes (fortement pondérées, type single-shot) centrées sur le canal de Wirsung et ses branches secondaires, permettant d'apprécier une communication canalaire (typique des TIPMP).</li><li><b>Épreuve à la sécrétine (optionnelle) :</b> injection IV de sécrétine qui stimule transitoirement la sécrétion pancréatique exocrine, distendant mieux le canal de Wirsung et améliorant la visualisation des canaux secondaires et de la réserve fonctionnelle pancréatique.</li></ul><p style=\"margin:16px 0 6px\"><b>4. Cholangio-IRM (bili-IRM)</b></p><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:10px 0\"><p style=\"margin:0 0 8px; font-weight:bold; color:#A94430\">Indications principales</p><p style=\"margin:0\">Lithiase de la voie biliaire principale, sténose biliaire (bénigne ou tumorale), cholangite sclérosante primitive (CSP), anomalies anatomiques des voies biliaires (bilan pré-don de foie, pré-chirurgie), dilatation des voies biliaires d'origine indéterminée.</p></div><ul><li>Technique <b>non invasive</b>, ne nécessite pas d'injection de gadolinium pour l'étude canalaire elle-même (contrairement à la CPRE, qui est invasive).</li><li>Repose sur des séquences <b>T2 single-shot fast spin echo</b> très lourdement pondérées T2 : la bile stationnaire (liquide immobile) apparaît en hypersignal franc, le parenchyme environnant est supprimé.</li><li>Deux approches complémentaires : coupes <b>fines 2D multiplanaires</b> (meilleure résolution spatiale, utile pour une sténose focale) et acquisition <b>3D volumique</b> avec reconstructions type MIP (vue d'ensemble \"cholangiographique\").</li><li>Le jeûne préalable (4-6h) limite le liquide gastrique/duodénal superposé et favorise la réplétion vésiculaire.</li><li>Dans la CSP : aspect caractéristique en \"<b>chapelet</b>\" avec alternance de sténoses et dilatations courtes, multifocales, intra- et/ou extra-hépatiques.</li></ul><p style=\"margin:16px 0 6px\"><b>5. Entéro-IRM (et colo-IRM)</b></p><div style=\"background:#FCEFD9; border-left:4px solid #B8860B; border-radius:8px; padding:14px 18px; margin:10px 0\"><p style=\"margin:0 0 8px; font-weight:bold; color:#8a6500\">Indications principales</p><p style=\"margin:0\">Bilan initial et suivi de la <b>maladie de Crohn</b> (atteinte du grêle en particulier), recherche de complications (sténose, fistule, abcès), évaluation de la cicatrisation muqueuse sous traitement ; alternative à la vidéo-capsule/entéroscopie quand une sténose est suspectée.</p></div><ul><li><b>Préparation :</b> ingestion d'un grand volume de solution de contraste <b>hydrique neutre</b> (polyéthylène glycol ou mannitol dilué, environ 1,5 à 2 litres sur 45-60 min avant l'examen) pour distendre les anses grêles sans masquer la paroi (contraste dit \"biphasique\").</li><li>Injection d'un <b>antispasmodique</b> (ex : phloroglucinol ou glucagon) juste avant l'acquisition pour limiter le péristaltisme et les artefacts de flou.</li><li>Séquences <b>T2</b> (étude morphologique de la paroi et de l'épaississement), <b>diffusion</b> (très sensible à l'inflammation active), et <b>T1 dynamique après gadolinium</b> (quantifie le rehaussement pariétal, marqueur d'activité inflammatoire).</li><li>Séquences <b>ciné</b> (ciné-IRM, images répétées sur le même plan) : étudient la <b>motilité</b> et aident à différencier une sténose fixe (fibreuse) d'un simple spasme.</li><li><b>Score MaRIA</b> (Magnetic Resonance Index of Activity) : score radiologique validé combinant épaisseur pariétale, rehaussement relatif, œdème (T2) et ulcérations, utilisé pour quantifier l'activité inflammatoire et suivre la cicatrisation muqueuse sous traitement.</li><li>La <b>colo-IRM</b> utilise les mêmes principes pour l'étude du cadre colique, souvent couplée à l'entéro-IRM dans les MICI étendues.</li></ul><p style=\"margin:16px 0 6px\"><b>6. En pratique : quelle séquence pour quelle question ?</b></p><ul><li>« Ce nodule hépatique, qu'est-ce que c'est ? » → T1 in/out phase + T2 + dynamique gadolinium (± hépatobiliaire si doute HNF/adénome).</li><li>« Dilatation des voies biliaires, cause ? » → cholangio-IRM (T2 single-shot).</li><li>« TIPMP, communique avec le Wirsung ? » → wirsungo-IRM, éventuellement sécrétine.</li><li>« Crohn du grêle, atteinte active ou séquellaire ? » → entéro-IRM avec diffusion + dynamique + ciné.</li></ul>","id": "irm-hge-sequences","titre": "IRM en HGE : coupes, séquences et protocoles (foie, pancréas, voies biliaires, intestin)"},{"categorie": "Général","contenu": "<p style=\"margin:0 0 6px\"><b>Maladie à IgG4 (IgG4-related disease)</b></p><p style=\"margin:0 0 10px\"><i>Synthèse à partir de la nomenclature internationale (Stone JH, et al., 2012), des critères de classification ACR/EULAR 2019 et du guide de traitement international (Khosroshahi A, et al., 2015).</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Définition et concept</p><p style=\"margin:0 0 8px\">La maladie à IgG4 est une <b>maladie fibro-inflammatoire systémique</b>, reconnue comme entité au début des années 2000, capable de toucher pratiquement tous les organes, le plus souvent de façon métachrone plutôt que simultanée.</p><p style=\"margin:0\">Elle est caractérisée par une infiltration lymphoplasmocytaire riche en plasmocytes IgG4+, une fibrose d'architecture particulière et une phlébite oblitérante, conduisant progressivement à une tuméfaction puis à une fibrose destructrice des organes atteints.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Organes pouvant être touchés</p><p style=\"margin:0 0 8px\">Par ordre de fréquence approximatif des atteintes associées à une localisation pancréatique (PAI de type 1), mais tout organe peut être touché isolément :</p><table><thead><tr><th>Organe</th><th>Manifestation</th></tr></thead><tbody><tr><td>Voies biliaires</td><td>Cholangite sclérosante à IgG4 (distale isolée ou diffuse intra/extra-hépatique)</td></tr><tr><td>Glandes salivaires et lacrymales</td><td>Syndrome de Mikulicz (sialadénite et dacryoadénite hypertrophiques)</td></tr><tr><td>Rétropéritoine / aorte</td><td>Fibrose rétropéritonéale, périaortite/aortite (l'aortite est une urgence thérapeutique)</td></tr><tr><td>Thyroïde</td><td>Thyroïdite de Riedel</td></tr><tr><td>Poumon / médiastin</td><td>Pneumopathie interstitielle, adénopathies médiastinales pouvant mimer une sarcoïdose</td></tr><tr><td>Rein</td><td>Néphrite tubulo-interstitielle</td></tr><tr><td>Système nerveux central</td><td>Hypophysite, pachyméningite</td></tr><tr><td>Orbite, foie, ampoule de Vater</td><td>Pseudotumeurs</td></tr><tr><td>Autres</td><td>Ganglions lymphatiques, prostate, sein (localisations plus rares)</td></tr></tbody></table><p style=\"margin:10px 0 0\">Environ 15 % des patients sont asymptomatiques, la maladie étant découverte sur une imagerie réalisée pour une autre raison.</p></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">3. Histopathologie</p><p style=\"margin:0 0 8px\">Trois critères histologiques majeurs, à rechercher ensemble :</p><ul class=\"bullet-list\"><li><b>Infiltrat lymphoplasmocytaire</b> dense, riche en plasmocytes IgG4+ (généralement &gt; 10 par grand champ, ou rapport IgG4+/IgG+ &gt; 40 %), sans infiltrat à polynucléaires neutrophiles</li><li><b>Fibrose « storiforme »</b> (arciforme), architecture caractéristique de la maladie</li><li><b>Phlébite oblitérante</b></li></ul><p style=\"margin:8px 0 0\">Une éosinophilie tissulaire est parfois associée. La biopsie, lorsqu'elle est réalisable (glande salivaire, ganglion, biopsie profonde guidée), reste l'élément le plus discriminant face aux diagnostics différentiels.</p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Biologie</p><ul class=\"bullet-list\"><li><b>IgG4 sérique</b> : élevée dans une proportion variable des cas selon l'organe atteint et l'étendue de la maladie, mais ni sensible ni spécifique à 100 % — un taux normal n'élimine pas le diagnostic, et une élévation modérée s'observe dans d'autres pathologies (dont certains cancers).</li><li><b>Plasmablastes circulants</b> (CD19low CD20– CD38hi CD27+) : biomarqueur émergent, dont la concentration suit mieux l'activité de la maladie que le taux d'IgG4 sérique et diminue sous traitement dépléteur B (rituximab).</li><li>Une hypocomplémentémie est parfois observée, sans lien direct avec les IgG4 elles-mêmes (qui n'activent pas le complément).</li></ul></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">5. Critères de classification (ACR/EULAR 2019)</p><p style=\"margin:0 0 8px\">Les critères ACR/EULAR 2019 sont des <b>critères de classification</b> (conçus pour homogénéiser les inclusions dans les études), non des critères diagnostiques stricts pour la pratique individuelle. Ils reposent sur une approche par score, en trois étapes :</p><ol><li><b>Critères d'entrée</b> : atteinte clinique ou radiologique typique d'au moins un des organes habituellement touchés par la maladie.</li><li><b>Critères d'exclusion</b> : une longue liste de diagnostics différentiels à écarter selon l'organe concerné (fièvre inexpliquée, absence de réponse à la corticothérapie, éléments cliniques ou biologiques orientant vers un lymphome, une granulomatose avec polyangiéite, une sarcoïdose, une maladie de Castleman, etc.).</li><li><b>Critères de classification pondérés</b>, cumulés en un score, portant sur l'histopathologie, l'immunomarquage IgG4/IgG, le taux d'IgG4 sérique et des critères radiologiques ou cliniques spécifiques par organe. Un score cumulé au-delà d'un seuil défini classe le patient comme atteint de maladie à IgG4.</li></ol><p style=\"margin:8px 0 0\">En pratique clinique, la décision repose sur un faisceau d'arguments cliniques, radiologiques, biologiques et si possible histologiques, à discuter en centre spécialisé dans les présentations pseudo-tumorales ou atypiques.</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">6. Traitement</p><p style=\"margin:6px 0 4px\"><b>Traitement d'induction</b></p><ul class=\"bullet-list\"><li><b>Corticothérapie</b> : traitement de première intention, quasi constamment efficace sur les symptômes et la régression des tuméfactions.</li><li><b>Rituximab&nbsp;(anti CD20)</b> : alternative de première intention envisageable, notamment lorsque la corticothérapie est à risque (diabète, ostéoporose, patient âgé) ou en cas de forme réfractaire ; efficacité comparable à la corticothérapie dans les études disponibles.</li></ul><p style=\"margin:8px 0 4px\"><b>Rechutes et traitement d'entretien</b></p><ul class=\"bullet-list\"><li>Les rechutes sont fréquentes à l'arrêt du traitement, particulièrement en cas d'atteinte diffuse, d'ictère au diagnostic, ou d'atteinte de plus de deux organes.</li><li>Un traitement immunosuppresseur d'épargne cortisonique (azathioprine, méthotrexate, mycophénolate mofétil) est souvent associé en cas de rechute, bien que les preuves de son efficacité pour prévenir les récidives ultérieures restent limitées.</li><li>Le rituximab, en perfusions répétées (semestrielles ou annuelles), est une option pour prévenir les rechutes tout en limitant l'exposition cumulée aux corticoïdes.</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">7. Diagnostics différentiels à écarter</p><p style=\"margin:0\">À évoquer selon l'organe atteint et le contexte : <b>lymphome</b> (notamment devant des adénopathies ou une atteinte glandulaire), <b>sarcoïdose</b> (atteinte médiastinale, pulmonaire), <b>granulomatose avec polyangiéite</b> et autres vascularites à ANCA, <b>maladie de Castleman multicentrique</b>, <b>cholangiocarcinome</b> et <b>cancer du pancréas</b> pour les atteintes biliopancréatiques, et plus largement toute pathologie tumorale mimée par une présentation pseudo-tumorale.</p></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Stone JH, Zen Y, Deshpande V. IgG4-related disease. N Engl J Med 2012;366:539-51 (nomenclature) ; Wallace ZS, Naden RP, Chari S, et al. The 2019 American College of Rheumatology/European League Against Rheumatism classification criteria for IgG4-related disease. Ann Rheum Dis 2020;79:77-87 ; Khosroshahi A, Wallace ZS, Crowe JL, et al. International Consensus Guidance Statement on the Management and Treatment of IgG4-Related Disease. Arthritis Rheumatol 2015;67:1688-99. À confronter systématiquement à un avis spécialisé, notamment pour les présentations pseudo-tumorales.</i></p>","id": "maladie-igg4","tags": ["IgG4","maladie systémique","ACR-EULAR","PAI"],"titre": "Maladie à IgG4 (IgG4-related disease)","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 6px\"><b>Marqueurs non invasifs de fibrose hépatique</b></p><p style=\"margin:0 0 10px\"><i>Synthèse à partir des recommandations EASL-ALEH sur les tests non invasifs, des lignes directrices EASL-EASD-EASO sur la stéatopathie métabolique, et du consensus Baveno VIII sur l'hypertension portale.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">Contexte</p><p style=\"margin:0\">La biopsie hépatique, longtemps examen de référence pour évaluer la fibrose, est invasive, coûteuse, sujette à des variations d'échantillonnage et mal acceptée par les patients. Les <b>tests non invasifs</b> (biologiques et morphologiques) permettent aujourd'hui, dans la grande majorité des cas, d'évaluer la sévérité de la fibrose et de dépister une <b>maladie chronique avancée du foie (cACLD)</b> sans recourir à la biopsie, réservée aux cas discordants ou atypiques.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">1. Marqueurs biologiques simples (calculés)</p><table><thead><tr><th>Test</th><th>Composition</th><th>Seuils usuels</th></tr></thead><tbody><tr><td><b>FIB-4</b></td><td>Âge, ASAT, ALAT, plaquettes</td><td><b>&lt; 1,30</b> : fibrose avancée peu probable (VPN élevée) ; <b>1,30–2,67 </b>: zone grise ; <b>&gt; 2,67</b> : fibrose avancée probable (VPP ~65 %)<br><img src=\"6489ac3c29a3a4022c23368c97f656a7.png\"><br></td></tr><tr><td><b>APRI</b> (AST to Platelet Ratio Index)</td><td>ASAT, plaquettes</td><td><b>&lt; 0,5 :</b> fibrose significative peu probable ; <b>&gt; 1,5</b> : cirrhose probable<br><img src=\"44023ff8f06ca6d2016c0d2270797416.png\"><br></td></tr></tbody></table><p style=\"margin:10px 0 0\">Le <b>FIB-4</b> est recommandé comme <b>test de première intention</b> par l'EASL, en particulier en soins primaires, du fait de sa simplicité (calculable à partir d'un bilan biologique standard) et de son excellente valeur prédictive négative pour exclure une fibrose avancée.</p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">2. Tests biologiques combinés (propriétaires)</p><p style=\"margin:0 0 8px\">Panels biologiques combinés, généralement utilisés en <b>seconde ligne</b> pour affiner le résultat du FIB-4 en zone grise :</p><ul class=\"bullet-list\"><li><b>FibroTest®</b> : bilirubine totale, GGT, haptoglobine, apolipoprotéine A1, alpha-2-macroglobuline (± ASAT/ALAT pour le FibroMax®, qui évalue aussi la stéatose et l'activité nécrotico-inflammatoire).</li><li><b>ELF test</b> (<i>Enhanced Liver Fibrosis</i>) : acide hyaluronique, PIIINP (peptide amino-terminal du procollagène de type III), TIMP-1 — recommandé par l'EASL comme alternative à l'élastographie en seconde ligne, notamment dans la stéatopathie métabolique.</li><li><b>Fibromètre®</b>, <b>Hepascore®</b> : autres panels combinant marqueurs biologiques directs et indirects de fibrose.</li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">3. Élastographie</p><table><thead><tr><th>Technique</th><th>Principe</th></tr></thead><tbody><tr><td><b>Élastographie impulsionnelle</b> (FibroScan®, VCTE&nbsp;<em style=\"color: rgb(13, 13, 13); font-family: -apple-system-body, ui-sans-serif, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, &quot;sans-serif&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;; background-color: rgb(252, 252, 252)\">Vibration-Controlled Transient Elastography</em>)<br></td><td>Mesure de la vitesse de propagation d'une onde de cisaillement induite mécaniquement ; technique la plus validée et la plus répandue</td></tr><tr><td><b>Élastographie par ondes de cisaillement</b> (ARFI ponctuelle, 2D-SWE)</td><td>Intégrée à une sonde d'échographie classique, permet de cibler une zone précise du foie sous contrôle visuel</td></tr><tr><td><b>Élastographie par IRM (MRE)</b></td><td>Technique la plus précise, moins sensible aux limites techniques (obésité, ascite), mais coûteuse et peu accessible en pratique courante</td></tr></tbody></table><p style=\"margin:10px 0 8px\"><b>Seuils d'élastographie hépatique (VCTE) retenus par Baveno VIII pour la cACLD</b> :</p><ul class=\"bullet-list\"><li>&lt; 10 kPa : écarte la maladie avancée (en l'absence d'autre signe clinique)</li><li>10–15 kPa : évocateur</li><li>&gt; 15 kPa : très évocateur</li></ul><p style=\"margin:8px 0 0\"><b>Pour l'hypertension portale cliniquement significative (HTP-CS)</b> : élastographie ≤ 15 kPa et plaquettes ≥ 150 G/L permettent de l'écarter ; une élastographie ≥ 25 kPa (hors stéatopathie métabolique avec obésité) l'affirme. L'<b>élastographie splénique</b> améliore le classement des cas intermédiaires. Toujours mesurer <b>à jeun</b>.</p><p style=\"margin:8px 0 0\"><img src=\"40891d0f2342cae26ac3279cc9a5631e.png\"><br></p><p style=\"margin:14px 0 8px\"><b>Seuils VCTE (FibroScan®) selon l'étiologie</b> — les seuils de stadification de la fibrose diffèrent significativement selon la cause de l'hépatopathie ; les valeurs génériques Baveno ci-dessus (dépistage de la cACLD) ne remplacent pas ces seuils étiologie-spécifiques pour la stadification fine F0 à F4 :</p><table><thead><tr><th>Étiologie</th><th>F0–F1 (absente/minime)</th><th>F2 (modérée)</th><th>F3 (sévère)</th><th>F4 (cirrhose)</th></tr></thead><tbody><tr><td><b>MASLD / MASH</b></td><td>&lt; 7 kPa</td><td>7–10 kPa</td><td>10–13 kPa</td><td>≥ 13 kPa</td></tr><tr><td><b>Hépatopathie alcoolique</b></td><td>&lt; 9 kPa</td><td>9–12,1 kPa</td><td>12,1–18,6 kPa</td><td>≥ 18,6 kPa</td></tr><tr><td><b>Hépatite C (VHC)</b></td><td>&lt; 7 kPa</td><td>7–10 kPa</td><td>10–13 kPa</td><td>≥ 13 kPa</td></tr><tr><td><b>Hépatite B (VHB)</b></td><td>&lt; 7 kPa</td><td>7–8 kPa</td><td>8–11 kPa</td><td>≥ 11 kPa</td></tr></tbody></table><p style=\"margin:8px 0 0\"><i>Dans la MASLD, une approche simplifiée de dépistage du risque de fibrose avancée est également utilisée en soins primaires : LSM &lt; 8 kPa = risque faible ; 8–12 kPa = risque intermédiaire/indéterminé ; &gt; 12 kPa = risque élevé (nécessite un avis spécialisé).</i></p><div style=\"background:#E4E9FA; border-left:4px solid #35449B; border-radius:8px; padding:14px 18px; margin:14px 0\"><p style=\"margin:0 0 8px; color:#35449B; font-weight:bold\">CAP™ (Controlled Attenuation Parameter) — quantification de la stéatose</p><p style=\"margin:0 0 6px\">Mesuré simultanément à la LSM sur le même appareil FibroScan®, le <b>CAP</b> quantifie l'atténuation ultrasonore liée à la stéatose hépatique (plage de mesure : <b>100–400 dB/m</b>).</p><ul class=\"bullet-list\"><li><b>CAP ≥ 288 dB/m</b> : présence d'une stéatose hépatique</li><li>Le CAP s'élève dès les stades précoces (stéatose simple, avant l'inflammation), alors que la LSM ne s'élève qu'à partir de la fibrose ; les deux paramètres sont donc complémentaires et se dissocient au cours de l'histoire naturelle de la MASLD (stéatose → ballonisation/inflammation [MASH] → fibrose minime → fibrose significative → fibrose sévère → cirrhose)</li></ul></div><p style=\"margin:8px 0 0; color:#6E6A5D\"><i>Les seuils VCTE/CAP peuvent varier selon la méthodologie, la cohorte étudiée et le matériel utilisé ; ils sont une aide à la décision et ne remplacent pas le jugement clinique global (données Echosens, seuils diagnostiques VCTE™ et CAP™).</i></p></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">4. Approche séquentielle recommandée (EASL)</p><p style=\"margin:0 0 8px\">L'EASL recommande une <b>approche séquentielle</b>, en particulier dans la stéatopathie métabolique (MASLD) :</p><ol><li><b>1re étape</b> (soins primaires) : calcul du <b>FIB-4</b> à partir d'un bilan biologique standard.</li><li><b>2e étape</b> (si FIB-4 en zone grise ou élevé) : orientation vers un spécialiste pour <b>élastographie hépatique</b> (FibroScan) et/ou <b>test ELF</b>, afin de confirmer ou d'écarter une fibrose avancée.</li><li><b>3e étape</b> (discordance ou doute persistant) : discussion d'une <b>biopsie hépatique</b>, désormais réservée à une minorité de situations.</li></ol></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">5. Limites et pièges</p><p style=\"margin:6px 0 4px\"><b>Limites des marqueurs biologiques</b></p><ul class=\"bullet-list\"><li>FIB-4 et APRI : moins fiables aux âges extrêmes (faux positifs fréquents après 65 ans), et en cas d'inflammation hépatique aiguë associée</li><li>FibroTest : perturbé par un syndrome de Gilbert, une hémolyse, ou une cholestase extra-hépatique</li></ul><p style=\"margin:8px 0 4px\"><b>Limites de l'élastographie</b></p><ul class=\"bullet-list\"><li><b>Obésité</b> et <b>espaces intercostaux étroits</b> : principales causes d'échec de mesure ou de résultats ininterprétables (sondes adaptées disponibles pour l'obésité)</li><li><b>Ascite</b> : rend la mesure par voie transthoracique impossible</li><li><b>Cytolyse aiguë importante, cholestase extra-hépatique, congestion hépatique</b> (insuffisance cardiaque droite) : peuvent surestimer la rigidité hépatique indépendamment de la fibrose</li><li>Résultat à interpréter en tenant compte de l'étiologie : les seuils diffèrent selon le contexte (viral, métabolique, alcoolique, maladie vasculaire porto-sinusoïdale où les seuils habituels ne s'appliquent pas)</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : EASL-ALEH Clinical Practice Guidelines: Non-invasive tests for evaluation of liver disease severity and prognosis, J Hepatol 2015 (actualisations ultérieures) ; EASL-EASD-EASO Clinical Practice Guidelines on the management of metabolic dysfunction-associated steatotic liver disease (MASLD), 2024 ; Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026. À adapter au contexte étiologique et au plateau technique disponible.</i></p>","id": "marqueurs-non-invasifs-fibrose","tags": ["fibrose","FIB-4","élastographie","FibroScan","EASL","Baveno","ELF"],"titre": "Marqueurs non invasifs de fibrose hépatique","urgent": false},{"categorie": "Pancréatologie","contenu": "<p style=\"margin:0 0 6px\"><b>Pancréatite auto-immune (PAI)</b></p><p style=\"margin:0 0 10px\"><i>Synthèse à partir du consensus international ICDC (International Association of Pancreatology, 2011), des critères HISORt de la Mayo Clinic, et du POST'U 2017 (L. Palazzo, FMC-HGE).</i></p><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">1. Deux entités distinctes</p><table><thead><tr><th></th><th>PAI de type 1</th><th>PAI de type 2</th></tr></thead><tbody><tr><td><b>Nature</b></td><td>Atteinte pancréatique de la maladie à IgG4 (<i>IgG4-related disease</i>), une maladie systémique fibro-inflammatoire</td><td>Maladie auto-immune plus classique, purement pancréatique</td></tr><tr><td><b>Fréquence</b></td><td>Environ 80 % des PAI en Occident (jusqu'à 96 % au Japon)</td><td>Minoritaire, description plus récente</td></tr><tr><td><b>Terrain</b></td><td>Homme, âge moyen 60-65 ans</td><td>Sex-ratio proche de 1, sujets plus jeunes (30-40 ans)</td></tr><tr><td><b>Association</b></td><td>Autres atteintes de la maladie à IgG4 (cholangite sclérosante, glandes salivaires/lacrymales, fibrose rétropéritonéale…)</td><td>MICI (surtout RCH) dans 20 à 30 % des cas, synchrone ou métachrone</td></tr><tr><td><b>Histologie signature</b></td><td>LPSP — infiltrat lymphoplasmocytaire riche en plasmocytes IgG4+, fibrose storiforme, phlébite oblitérante</td><td>IDCP (GEL) — lésion épithéliale granulocytaire des canaux, peu ou pas de plasmocytes IgG4+</td></tr></tbody></table></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Présentation clinique</p><p style=\"margin:6px 0 4px\"><b>PAI de type 1</b></p><ul class=\"bullet-list\"><li>Mode de révélation le plus fréquent : <b>ictère nu pseudo-néoplasique</b> (environ 65 % des cas), le plus souvent lié à une cholangite sclérosante à IgG4 associée.</li><li>Pancréatite aiguë rare comme mode de révélation (jamais plus qu'œdémateuse).</li><li>Diabète associé dans environ 65 % des cas ; insuffisance pancréatique exocrine possible.</li><li>Jusqu'à 15 % des patients sont asymptomatiques, découverts sur une imagerie fortuite.</li></ul><p style=\"margin:8px 0 4px\"><b>PAI de type 2</b></p><ul class=\"bullet-list\"><li>Révélée le plus souvent par une <b>pancréatite aiguë</b> (jamais sévère), parfois d'évolution subaiguë avec épisodes répétés.</li><li>Ictère et cholestase plus rares que dans le type 1.</li><li>À évoquer devant une pancréatite aiguë chez un patient MICI, notamment avant d'incriminer à tort un médicament (aminosalicylés, azathioprine).</li></ul></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">3. Diagnostic différentiel et place de l'IgG4</p><p style=\"margin:0 0 8px\">Le principal diagnostic différentiel, dans les deux types, est l'<b>adénocarcinome pancréatique</b> — enjeu majeur pour éviter une pancréatectomie inutile.</p><p style=\"margin:0 0 4px\"><b>IgG4 sérique</b> (utile surtout pour le type 1) :</p><ul class=\"bullet-list\"><li>Seuil &gt; 1,35 g/L : bonne sensibilité, spécificité modérée</li><li>Seuil &gt; 2,70 g/L (retenu par le consensus international) : très spécifique, mais sensibilité plus faible — environ la moitié des PAI de type 1 ont un taux d'IgG4 insuffisamment élevé pour trancher à lui seul</li></ul><p style=\"margin:8px 0 0\">Dans la PAI de type 2, il n'existe pas de marqueur biologique spécifique.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">4. Imagerie en coupes et écho-endoscopie</p><p style=\"margin:6px 0 4px\"><b>Signes parenchymateux</b></p><ul class=\"bullet-list\"><li>Aspect typique : hypertrophie diffuse en « pancréas saucisse », avec prise de contraste retardée et anneau périphérique hypodense/hypo-intense sous-capsulaire, quasi pathognomonique lorsqu'il est présent.</li><li>Forme focale pseudo-tumorale possible, principale source de confusion avec un adénocarcinome.</li></ul><div><img src=\"19708d92cd62d24a2ba931e71d8fea99.png\"><br></div><p style=\"margin:8px 0 4px\"><b>Signes canalaires</b></p><ul class=\"bullet-list\"><li>Rétrécissement ou disparition du canal pancréatique principal sur un long segment, sans dilatation d'amont significative, ou sténoses multiples.</li></ul><div><img src=\"f92c29a79adffe0edce77367d456ea0a.png\"><br></div><div><i>Sténose longue du canal de Wirsung en cholangio IRM sans dilatation d'amont</i></div><p style=\"margin:8px 0 4px\"><b>Écho-endoscopie</b></p><ul class=\"bullet-list\"><li>Signes évocateurs : « ductite » (canal pancréatique irrégulier, sténosé puis dilaté, paroi épaissie), épaississement de la paroi de la voie biliaire principale (« cholangite »), œdème péri-glandulaire sous-capsulaire.</li><li>Utile pour biopsier une masse suspecte et éliminer un adénocarcinome lorsque l'imagerie ne suffit pas à trancher.</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">5. Critères diagnostiques (consensus ICDC)</p><p style=\"margin:0 0 8px\">Le consensus international ICDC (<i>International Consensus Diagnostic Criteria</i>, IAP 2011) reste la référence pour structurer le diagnostic, à côté des critères historiques HISORt de la Mayo Clinic et des critères japonais.</p><p style=\"margin:0 0 8px\">Il combine, pour chaque type de PAI, plusieurs catégories de critères, cotés en niveau de preuve 1 (fort) ou 2 (plus faible), pour aboutir à un diagnostic « certain » ou « vraisemblable » :</p><ul class=\"bullet-list\"><li><b>Imagerie pancréatique</b> — aspect parenchymateux et canalaire</li><li><b>Sérologie</b> (IgG4) — uniquement pour le type 1</li><li><b>Atteinte d'autres organes</b> — histologique ou radiologique (cholangite à IgG4, glandes salivaires/lacrymales… pour le type 1 ; MICI associée pour le type 2)</li><li><b>Histologie pancréatique</b> — LPSP pour le type 1, IDCP pour le type 2</li><li><b>Réponse à la corticothérapie d'épreuve</b> — à réserver aux cas non tranchés après le bilan complet, et de préférence en centre spécialisé</li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">6. Traitement</p><p style=\"margin:6px 0 4px\"><b>Corticothérapie</b></p><ul class=\"bullet-list\"><li>Traitement de première intention en cas de forme symptomatique (ictère, douleurs invalidantes), quasi constamment efficace.</li><li>Schéma classique : dose d'attaque puis décroissance progressive sur plusieurs semaines, durée totale de l'ordre de 2 à 3 mois.</li><li>Surveillance clinique, biologique (tests hépatiques, glycémie, IgG4 si initialement élevées) et par IRM/bili-IRM.</li></ul><p style=\"margin:8px 0 4px\"><b>Rechutes</b></p><ul class=\"bullet-list\"><li>Fréquentes dans la PAI de type 1 après arrêt du traitement (jusqu'à environ la moitié des patients selon les séries), beaucoup plus rares dans le type 2.</li><li>En cas de rechute : immunosuppresseur associé à une nouvelle corticothérapie, ou <b>RITUXIMAB (anti CD20) </b>1000 mg à 15 jours d'intervalle&nbsp;, alternative efficace notamment chez les patients à risque des complications de la corticothérapie (diabète, ostéoporose).</li></ul><p style=\"margin:8px 0 0\">Un traitement d'épreuve par corticoïdes ne doit jamais être utilisé comme simple test diagnostique en cas de doute avec un adénocarcinome : la décision doit s'appuyer sur un <b>bilan complet</b>, au mieux en centre spécialisé.</p></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Shimosegawa T, Chari ST, Frulloni L, et al. International consensus diagnostic criteria for autoimmune pancreatitis. Pancreas 2011;40:352-8 (critères ICDC) ; Chari ST, et al., critères HISORt, Mayo Clinic ; Palazzo L., Pancréatite auto-immune (PAI), POST'U 2017, FMC-HGE (contenu reformulé, non reproduit). À confronter systématiquement à un avis spécialisé, le diagnostic différentiel avec l'adénocarcinome pancréatique étant l'enjeu principal.</i></p>","id": "pancreatite-auto-immune","tags": ["PAI","pancréatite auto-immune","IgG4","ICDC"],"titre": "Pancréatite auto-immune (PAI)","urgent": false},{"categorie": "Endoscopie","contenu": "<div style=\"background:#E4EDF7; border-left:4px solid #24507C; padding:12px 16px; border-radius:6px; margin-bottom:16px\"><strong>Définition :</strong> Syndrome de prédisposition génétique rare, de transmission <strong>autosomique dominante</strong>, lié à une mutation constitutionnelle du gène <strong>STK11/LKB1</strong> (chromosome 19p13.3), retrouvée chez 80-94% des patients répondant aux critères cliniques. Associe une <strong>lentiginose muco-cutanée</strong>, une <strong>polypose hamartomateuse digestive</strong> et un <strong>sur-risque tumoral multi-organes</strong> (digestif et extra-digestif). Prévalence estimée : 1/50 000 à 1/200 000 naissances.</div>\n\n1. Manifestations cliniques\n\n<div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; padding:12px 16px; border-radius:6px; margin-bottom:12px\"><strong>Lentiginose muco-cutanée</strong><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li>Macules brun-noirâtres, 1-5mm, non infiltrées</li><li>Topographie évocatrice : <strong>pourtour buccal et lèvres</strong> (quasi constant), muqueuse jugale, narines, région périorbitaire, doigts et orteils, région périanale</li><li>Apparition dans l'enfance (souvent avant 2 ans), <strong>s'estompent après la puberté</strong> sauf sur la muqueuse buccale où elles persistent (élément diagnostique clé chez l'adulte)</li></ul><div><img src=\"873488591548f46f9a80f186c4173017.png\"><br></div></div>\n\n<div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; padding:12px 16px; border-radius:6px; margin-bottom:12px\"><strong>Polypose hamartomateuse digestive (hamartome)</strong><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li>Localisation par fréquence décroissante : <strong>intestin grêle ++</strong> (jéjunum +++) &gt; côlon &gt; estomac &gt; rectum</li><li>Polypes souvent volumineux (jusqu'à plusieurs cm), pédiculés, architecture arborescente caractéristique en histologie (axe musculaire lisse ramifié)</li><li>Risque de transformation adénomateuse puis néoplasique au sein d'un hamartome (séquence hamartome-adénome-carcinome)</li></ul></div>\n\n<div style=\"background:#FBE7EC; border-left:4px solid #9B3355; padding:12px 16px; border-radius:6px; margin-bottom:12px\"><strong>Complications révélatrices (souvent avant 20 ans)</strong><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li><strong>Invagination intestinale</strong> sur polype du grêle (mode de révélation le plus fréquent, urgence chirurgicale)</li></ul><div><img src=\"d13dafc5485daf63b2b2ac508793de1d.png\"><br></div><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li>Occlusion intestinale</li><li>Hémorragie digestive chronique (extériorisée ou occulte) et anémie ferriprive</li><li>Prolapsus rectal d'un polype</li></ul></div>\n\n2. Critères diagnostiques (OMS)\n<div style=\"background:#ECEBE5; border-left:4px solid #5A5748; padding:12px 16px; border-radius:6px; margin-bottom:16px\">Diagnostic clinique retenu <b>si présence d'au moins 1&nbsp;des critères suivants</b> :<ul style=\"margin:8px 0 0 0; padding-left:20px\"><li><b>≥ 2 polypes hamartomateux de type Peutz-Jeghers</b> histologiquement confirmés</li><li><b>Tout nombre de polypes de type Peutz-Jeghers + antécédent familial au 1er degré</b></li><li><b>Lentiginose muco-cutanée caractéristique + antécédent familial au 1er degré</b></li><li><b>Tout nombre de polypes + lentiginose muco-cutanée caractéristique</b></li></ul>Confirmation par <strong>analyse génétique constitutionnelle STK11/LKB1</strong> (indispensable pour le conseil génétique et le dépistage familial en cascade).</div>\n\n3. Risques tumoraux cumulés à vie\n<div style=\"background:#F5E4DE; border-left:4px solid #A94430; padding:12px 16px; border-radius:6px; margin-bottom:16px\"><table><tbody><tr style=\"border-bottom:1px solid #A94430\"><th style=\"text-align:left; padding:4px 8px\">Organe</th><th style=\"text-align:left; padding:4px 8px\">Risque cumulé (~70 ans)</th></tr><tr><td style=\"padding:4px 8px\">Tous cancers confondus</td><td style=\"padding:4px 8px\">85-93%</td></tr><tr><td style=\"padding:4px 8px\">Colorectal</td><td style=\"padding:4px 8px\">39%</td></tr><tr><td style=\"padding:4px 8px\">Estomac</td><td style=\"padding:4px 8px\">29%</td></tr><tr><td style=\"padding:4px 8px\">Intestin grêle</td><td style=\"padding:4px 8px\">13%</td></tr><tr><td style=\"padding:4px 8px\">Pancréas</td><td style=\"padding:4px 8px\">11-36%</td></tr><tr><td style=\"padding:4px 8px\">Sein (femme)</td><td style=\"padding:4px 8px\">32-54%</td></tr><tr><td style=\"padding:4px 8px\">Ovaire (tumeurs des cordons sexuels)</td><td style=\"padding:4px 8px\">18-21%</td></tr><tr><td style=\"padding:4px 8px\">Col utérin (adénome malin)</td><td style=\"padding:4px 8px\">10%</td></tr><tr><td style=\"padding:4px 8px\">Testicule (tumeurs à cellules de Sertoli)</td><td style=\"padding:4px 8px\">9%</td></tr><tr><td style=\"padding:4px 8px\">Poumon</td><td style=\"padding:4px 8px\">7-17%</td></tr></tbody></table></div>\n\n4. Surveillance recommandée (ESGE/ESPGHAN, NCCN)\n\n<div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; padding:12px 16px; border-radius:6px; margin-bottom:12px\"><strong>Surveillance digestive</strong><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li><strong>Dès l'enfance (8 ans)</strong> si symptomatique, ou systématiquement à partir de <strong>8-10 ans</strong> : endoscopie haute (EOGD) + vidéocapsule ou entéro-IRM du grêle + coloscopie<ul><li>Si polypes trouvés → surveillance tous les <strong>2-3 ans</strong></li><li>Si négatif → à répéter à partir de <strong>18 ans</strong> puis tous les 2-3 ans</li></ul></li><li><strong>À partir de 18 ans (ou plus tôt si symptômes)</strong> : EOGD + coloscopie + exploration du grêle (vidéocapsule ou entéro-IRM) tous les <strong>2-3 ans</strong>, à vie</li><li>Polypectomie de tout polype du grêle ≥ <strong>10-15 mm</strong> (par entéroscopie double ballon si accessible) pour prévenir l'invagination, même en l'absence de symptôme</li></ul></div>\n\n<div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; padding:12px 16px; border-radius:6px; margin-bottom:12px\"><strong>Surveillance extra-digestive</strong><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li><strong>Sein</strong> : examen clinique annuel dès 25 ans ; IRM mammaire ± mammographie annuelle dès 25-30 ans</li><li><strong>Pancréas</strong> : IRM pancréatique ± écho-endoscopie tous les 1-2 ans dès 30-35 ans</li><li><strong>Gynécologique/col utérin</strong> : examen clinique + frottis annuel dès 18-20 ans</li><li><strong>Testicule</strong> (garçons) : examen clinique annuel dès la naissance jusqu'à la puberté (dépistage des tumeurs à cellules de Sertoli, gynécomastie et féminisation évocatrices)</li><li><strong>Ovaire</strong> : échographie pelvienne selon contexte clinique</li></ul></div>\n\n5. Prise en charge des complications\n<div style=\"background:#ECEBE5; border-left:4px solid #5A5748; padding:12px 16px; border-radius:6px; margin-bottom:16px\"><ul style=\"margin:0; padding-left:20px\"><li><strong>Invagination/occlusion aiguë</strong> : prise en charge chirurgicale, avec exploration peropératoire du grêle et entéroscopie/polypectomie per-opératoire (« clean sweep ») pour retirer les polypes accessibles et limiter les résections itératives</li><li><strong>Anémie ferriprive chronique</strong> : rechercher un saignement occulte sur polype du grêle, bilan martial et supplémentation</li><li><strong>Conseil génétique</strong> systématique : dépistage en cascade des apparentés au 1er degré, prise en charge pluridisciplinaire (gastro-entérologue, généticien, gynécologue, radiologue)</li></ul></div>\n\n<div style=\"background:#F5E4DE; border-left:4px solid #A94430; padding:12px 16px; border-radius:6px\"><strong>Pièges à éviter :</strong><ul style=\"margin:8px 0 0 0; padding-left:20px\"><li>Ne pas confondre la lentiginose de Peutz-Jeghers avec des éphélides banales : la topographie muqueuse buccale persistante à l'âge adulte est le signe le plus spécifique</li><li>Ne pas négliger une anémie ferriprive ou des douleurs abdominales récidivantes chez un patient jeune porteur de lentigines : penser à l'invagination sur polype du grêle</li><li>La surveillance doit être <strong>multidisciplinaire et à vie</strong> : le risque tumoral concerne autant les organes digestifs que le sein, le pancréas et la sphère gynéco/testiculaire</li><li>Toute résection doit être la plus économe possible (risque de grêle court sur résections itératives)</li></ul></div>\n\n<div style=\"margin-top:16px; color:#5A5748\"><strong>Sources :</strong> Beggs AD et al. Peutz-Jeghers syndrome: a systematic review and recommendations for management. Gut 2010 ; van Lier MG et al. High cancer risk in Peutz-Jeghers syndrome: a systematic review and surveillance recommendations. Am J Gastroenterol 2010 ; Latchford A, ESGE/ESPGHAN Guideline on Genetic diagnosis and hereditary GI cancer syndromes ; NCCN Guidelines – Genetic/Familial High-Risk Assessment: Colorectal ; critères diagnostiques OMS.</div>","id": "peutz-jeghers","tags": ["Peutz-Jeghers","STK11","LKB1","polypose hamartomateuse","lentiginose","invagination","surveillance","prédisposition génétique"],"titre": "Syndrome de Peutz-Jeghers","urgent": false},{"categorie": "Endoscopie","contenu": "<p style=\"margin:0 0 6px\"><b>Polypes colorectaux : définitions, épidémiologie et classifications endoscopiques</b></p><p style=\"margin:0 0 10px\"><i>Synthèse à partir des classifications de Paris, Kudo, Sano et CONECCT (SFED), et des recommandations de l'ESGE sur la caractérisation optique des polypes colorectaux.</i></p><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">1. Définitions et contexte épidémiologique</p><p style=\"margin:6px 0 4px\"><b>Définition</b></p><p style=\"margin:0 0 8px\">Un polype colorectal est une excroissance de la muqueuse faisant saillie dans la lumière colique, de nature histologique variable : adénomateuse, festonnée, inflammatoire ou hamartomateuse.</p><p style=\"margin:6px 0 4px\"><b>Principaux types histologiques</b></p><ul class=\"bullet-list\"><li><b>Adénomes</b> (tubuleux, tubulo-villeux, villeux) : lésions précancéreuses classiques, séquence adénome-cancer.</li><li><b>Lésions festonnées</b> : polype hyperplasique (bas risque), lésion festonnée sessile (LFS, avec ou sans dysplasie) et adénome festonné traditionnel — voie de cancérogenèse festonnée, distincte de la séquence adénome-cancer classique.</li><li><b>Polypes hamartomateux et inflammatoires</b> : plus rares, souvent dans un contexte de syndrome de polypose ou de MICI.</li></ul><p style=\"margin:8px 0 4px\"><b>Épidémiologie</b></p><ul class=\"bullet-list\"><li>Prévalence des adénomes croissante avec l'âge, retrouvée chez environ 30 à 40 % des sujets de plus de 50 ans lors d'une coloscopie de dépistage.</li><li>Le cancer colorectal se développe le plus souvent à partir d'un adénome (séquence adénome-cancer) ou d'une lésion festonnée (voie festonnée), sur plusieurs années.</li><li>Le risque de transformation maligne dépend de la taille, du contingent villeux et du grade de dysplasie de l'adénome.</li></ul></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Classification de Paris (aspect macroscopique)</p><p style=\"margin:0 0 10px\">Décrit l'aspect <b>macroscopique</b> en lumière blanche des lésions superficielles (type 0), sur le modèle de la classification japonaise des cancers superficiels.</p><table><thead><tr><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><b>0-Ip</b></td><td>Pédiculé</td></tr><tr><td><b>0-Is</b></td><td>Sessile</td></tr><tr><td><b>0-IIa</b></td><td>Légèrement surélevé (élévation &lt; hauteur de la pince à biopsie fermée)</td></tr><tr><td><b>0-IIb</b></td><td>Plan, strictement plat</td></tr><tr><td><b>0-IIc</b></td><td>Légèrement déprimé</td></tr><tr><td><b>0-III</b></td><td>Excavé / ulcéré</td></tr></tbody></table><p style=\"margin:10px 0 0\">Des formes combinées existent (ex. 0-IIa+IIc), associant une composante surélevée et une composante déprimée — cette dernière étant un signe d'alarme de dégénérescence, quelle que soit la taille de la lésion.</p><p style=\"margin:10px 0 0\"><img src=\"4408d99b0bc8e8dc8925aa1bceb42e98.png\"><br></p></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">3. Définition des LST (tumeurs à extension latérale)</p><p style=\"margin:0 0 8px\">Une <b>LST</b> (<i style=\"font-weight: bold\">Laterally Spreading Tumor</i>, tumeur à extension latérale) est une lésion <b>d'au moins</b> <b>10 mm</b> dont la croissance se fait préférentiellement de façon latérale le long de la paroi colique plutôt que verticale.</p><table><thead><tr><th>Sous-type</th><th>Caractéristiques</th><th>Risque</th></tr></thead><tbody><tr><td><b>Granulaire homogène</b></td><td>Surface granulaire régulière, sans nodule dominant</td><td>Faible</td></tr><tr><td><b>Granulaire mixte (nodulaire)</b></td><td>Granulations de tailles inégales, présence d'un macronodule (&gt; 1 cm)</td><td>Intermédiaire, majoré en cas de macronodule ou de dépression associée</td></tr><tr><td><b>Non granulaire, plane-surélevée</b></td><td>Surface lisse, sans granulation</td><td>Intermédiaire</td></tr><tr><td><b>Non granulaire, pseudo-déprimée</b></td><td>Surface lisse avec une zone légèrement déprimée</td><td>Élevé — risque de cancer sous-muqueux le plus important parmi les LST</td></tr></tbody></table><img src=\"074099c23552b662aa3f4a33a4828be0.png\"><br></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">4. Classification de Kudo (pit pattern)</p><p style=\"margin:0 0 10px\">Décrit l'aspect des cryptes muqueuses <b>(<i>pit pattern</i>)</b> en <b>chromoendoscopie</b> (indigo carmin ± cristal violet) ou en chromoendoscopie virtuelle avec grossissement.</p><table><thead><tr><th>Type</th><th>Aspect</th><th>Signification</th></tr></thead><tbody><tr><td><b>I</b></td><td>Cryptes rondes, régulières</td><td>Muqueuse normale</td></tr><tr><td><b>II</b></td><td>Cryptes étoilées ou papillaires</td><td>Lésion hyperplasique / festonnée</td></tr><tr><td><b>III-S</b></td><td>Cryptes tubulaires ou rondes, petites</td><td>Adénome, souvent de forme déprimée</td></tr><tr><td><b>III-L</b></td><td>Cryptes tubulaires ou rondes, larges</td><td>Adénome, souvent de forme protrusive</td></tr><tr><td><b>IV</b></td><td>Cryptes ramifiées ou de type gyrus/cérébroïde</td><td>Adénome villeux</td></tr><tr><td><b>V-I</b></td><td>Architecture irrégulière</td><td>Carcinome, invasion superficielle possible</td></tr><tr><td><b>V-N</b></td><td>Architecture amorphe, non structurée</td><td>Carcinome invasif profond</td></tr></tbody></table><img src=\"bad0468f23e13ad4dbb4f680a9f06ac5.png\"><br></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">5. Classification de Sano (pattern vasculaire, NBI)</p><p style=\"margin:0 0 10px\">Décrit <b>le réseau vasculaire capillaire de surface en imagerie NBI</b> (<i>Narrow Band Imaging</i>) ou équivalent.</p><table><thead><tr><th>Type</th><th>Aspect vasculaire</th><th>Signification</th></tr></thead><tbody><tr><td><b>I</b></td><td>Vaisseaux invisibles</td><td>Muqueuse normale / lésion hyperplasique</td></tr><tr><td><b>II</b></td><td>Vaisseaux réguliers entourant les cryptes (maillage régulier)</td><td>Adénome</td></tr><tr><td><b>III-A</b></td><td>Vaisseaux irréguliers, denses, de calibre hétérogène</td><td>Carcinome à invasion sous-muqueuse superficielle</td></tr><tr><td><b>III-B</b></td><td>Vaisseaux clairsemés, zones avasculaires</td><td>Carcinome à invasion sous-muqueuse profonde</td></tr></tbody></table><img src=\"9b88022fc887977cc5c1f26a981aebfb.png\"><br></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">6. Classification CONECCT (SFED) — synthèse pour le choix thérapeutique</p><p style=\"margin:0 0 10px\">Développée par le comité recherche et développement de la <b>SFED</b>, la classification <b>CONECCT</b> (<i>COlorectal NEoplasia Endoscopic Classification to Choose the Treatment</i>) synthétise en un seul tableau les critères des classifications de Paris, LST, Kudo, Sano, NICE, JNET et WASP, pour proposer directement une stratégie thérapeutique. Elle nécessite au moins deux conditions d'imagerie : une vue d'ensemble en lumière blanche (aspect macroscopique) et une image rapprochée en chromoendoscopie virtuelle, si possible avec grossissement (pattern muqueux et vasculaire).</p><table><thead><tr><th>Catégorie</th><th>Signification</th><th>Aspect macroscopique typique</th></tr></thead><tbody><tr><td><b>IH</b></td><td>Polype hyperplasique</td><td>Souvent &lt; 10 mm, légèrement surélevé (Paris IIa), couleur identique au fond</td></tr><tr><td><b>IS</b></td><td>Lésion festonnée sessile</td><td>Paris IIa ou IIb, limites imprécises, en nuage ou en plateau, mucus jaune</td></tr><tr><td><b>IIA</b></td><td>Adénome simple, bas risque de cancer sous-muqueux (&lt; 1 %)</td><td>Paris Ip, Is ou IIa, rarement déprimé ; LST granulaire homogène avec pit pattern régulier (Kudo III/IV) et pattern vasculaire régulier (Sano II)</td></tr><tr><td><b>IIC</b></td><td>Adénome à risque ou cancer superficiel (intramuqueux ou sous-muqueux &lt; 1000 µm)</td><td>Souvent IIc, IIa+IIc, LST non granulaire, ou macronodule (&gt; 1 cm) sur LST granulaire</td></tr><tr><td><b>III</b></td><td>Adénocarcinome invasif profond (sous-muqueux &gt; 1000 µm)</td><td>Souvent type III, ou IIc avec composante nodulaire dans la dépression, saignements spontanés</td></tr></tbody></table><p style=\"margin:10px 0 0\">Pour les LST granulaires, la présence d'un macronodule ou d'une dépression est le principal facteur prédictif de cancer sous-muqueux. Pour les LST non granulaires, ce sont les anomalies du pit pattern et du pattern vasculaire qui priment.</p><p style=\"margin:10px 0 0\"><img src=\"b4e07f23da57e5fbf84df6e540964634.png\"><br></p><p style=\"margin:10px 0 0\"><img src=\"9a0759af4aa0aec8036a67d9a4c2d9e8.png\"><br></p><p style=\"margin:10px 0 0\">TNE&nbsp;</p><p style=\"margin:10px 0 0\"><img src=\"7d0028eab3d012d4795e23a2da4446a7.png\"><br></p><p style=\"margin:10px 0 0\">Hyperplasique&nbsp;</p><p style=\"margin:10px 0 0\"><img src=\"3675c3213777d388117950a465d5ab0b.png\"><br></p><p style=\"margin:10px 0 0\">Lésion festonnée sessile&nbsp;</p><p style=\"margin:10px 0 0\"><img src=\"fae586b85e56bee27690462caeb5500f.png\"><br></p><p style=\"margin:10px 0 0\">Adénome simple CONECCT IIa</p><p style=\"margin:10px 0 0\"><img src=\"3396bedc1ea6a0b162db87b1110957b3.png\"><br></p><p style=\"margin:10px 0 0\">Adénome à risque CONECCT IIc</p><p style=\"margin:10px 0 0\"><img src=\"cbecefd530a0846c83eb23878ab7710d.png\"><br></p><p style=\"margin:10px 0 0\">Cancer invasif borderline CONECCT IIc+</p><p style=\"margin:10px 0 0\"><img src=\"5b672f5e9a1b06afac7cdcd39d1fb988.png\"><br></p><p style=\"margin:10px 0 0\">Adénocarcinome profond CONECCT III</p><p style=\"margin:10px 0 0\"><img src=\"6b50c9fd052a0b175a0bd1caa56a2688.png\"><br></p><p style=\"margin:10px 0 0\">Granulome inflammatoire&nbsp;</p></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Paris Workshop Participants (classification de Paris) ; Kudo S, et al. (pit pattern) ; Sano Y, et al. (pattern vasculaire) ; Bonniaud P, Fabritius M, et al., classification CONECCT, comité recherche et développement de la SFED (Endoscopy International Open, 2019 et 2022) ; recommandations ESGE sur la caractérisation optique des polypes colorectaux. À adapter au matériel d'imagerie disponible et aux protocoles locaux.</i></p>","id": "polypes-colorectaux-classifications","tags": ["Polypes","Paris","Kudo","Sano","CONECCT","LST","SFED","ESGE"],"tit
