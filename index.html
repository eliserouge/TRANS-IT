g></p><p>Au choix de l’investigateur :</p><ul><li><p><strong>CAPECITABINE</strong> 1250 mg/m² × 2/j, 14 jours sur 21, pendant 8 cycles<br><strong>OU</strong></p></li><li><p><strong>GEMCITABINE</strong> 1000 mg/m², 3 semaines sur 4, pendant 6 cycles.</p></li></ul><p>Dans les deux bras, la durée totale prévue est de <strong>6 mois</strong>.</p>8. <u>Randomisation</u><p>Randomisation <strong>1:1</strong> avec stratification selon :</p><ul><li><p>Centre</p></li><li><p>Stade : <strong>I/II vs III</strong></p></li><li><p>Grade de différenciation</p></li><li><p>Sous-type histologique : <strong>intestinal vs pancréatobiliaire/mixte/indéterminé</strong></p></li><li><p>CA 19-9 : <strong>&lt;90 vs ≥90 UI/mL</strong>.</p></li></ul><u>9. Premiers résultats / état actuel</u><p><strong>Aucun résultat d’efficacité n’est actuellement disponible.</strong></p><p>L’étude est toujours <strong>en cours de recrutement en 2026</strong>. La publication de 2026 dans <em>Digestive and Liver Disease</em> présente le design de l’étude et confirme qu’AMPIRINOX est actuellement en cours d’inclusion.</p><u>10. Conclusion</u><p><strong>AMPIRINOX est le premier essai randomisé de phase III spécifiquement consacré à la question de la chimiothérapie adjuvante dans l’adénocarcinome ampullaire.</strong></p><p>L’étude compare directement une <strong>polychimiothérapie intensive par mFOLFIRINOX</strong> à une <strong>monochimiothérapie par CAPECITABINE ou GEMCITABINE</strong> après chirurgie.</p><p>➡️ <strong>Point clé :</strong> l’objectif est de déterminer si le mFOLFIRINOX permet d'améliorer la <strong>survie sans récidive à 2 ans</strong> chez les patients opérés d’un adénocarcinome ampullaire, avec une hypothèse de <strong>60 % → 71 % de DFS à 2 ans</strong>.</p></div>","id": "92e9d6d0-fd52-4c9b-97ea-40ce6bb4976c","tags": ["AMPIRINOX","adénocarcinome de l'ampoulle","oncologie"],"titre": "AMPIRINOX","urgent": false},{"categorie": "Oncologie","contenu": "<b><u>SAFE-ESO</u>&nbsp;</b><div><br></div><div><u>1.Introduction&nbsp;</u><p>Le carcinome épidermoïde de l’œsophage (CE œsophagien) avancé concerne fréquemment des patients âgés, chez lesquels une chimiothérapie à base de platine peut être difficilement réalisable en raison des comorbidités, de la fragilité ou de l'état général.</p><p><b>L'immunothérapie anti-PD-1</b> constitue une option thérapeutique dans le cancer de l'œsophage avancé, mais les données chez les patients âgés et non éligibles à une chimiothérapie restent limitées.</p><p><strong>SAFE-ESO</strong> évalue donc l'intérêt d'une <strong>immunothérapie seule par TISLELIZUMAB</strong> en première ligne chez cette population spécifique. L'étude intègre une évaluation oncogériatrique et une analyse de biomarqueurs immunitaires.</p><u>2. Présentation de l'étude</u><ul><li><p><strong>Nom :</strong> SAFE-ESO</p></li><li><p><strong>PRODIGE 102 / FFCD 2201</strong></p></li><li><p><strong>Phase II</strong></p></li><li><p>Étude <strong>multicentrique, ouverte, à bras unique</strong></p></li><li><p><strong>Promoteur : CHU Clermont-Ferrand</strong></p></li><li><p>Gestion opérationnelle : <strong>FFCD</strong></p></li><li><p>Population prévue : <strong>95 patients</strong></p></li><li><p><b>Carcinome épidermoïde de l'œsophage avancé</b></p></li></ul><u>3. Objectif principal</u><p>Évaluer le <strong>pourcentage de patients vivants à 6 mois</strong> après traitement par TISLELIZUMAB seul chez des patients âgés, non éligibles à une chimiothérapie à base de platine.</p><u>4. Critère de jugement principal</u><p><strong>Survie globale à 6 mois (OS-6 mois)</strong>, exprimée comme le pourcentage de patients vivants à 6 mois.</p><p>Hypothèses statistiques :</p><ul><li><p>Hypothèse nulle : <strong>50 %</strong> de patients vivants à 6 mois</p></li><li><p>Hypothèse alternative : <strong>63 %</strong></p></li><li><p><span style=\"color: var(--ink); font-family: inherit\">90 patients évaluables nécessaires</span><br></p></li><li><p><strong>95 patients</strong> prévus en tenant compte de 5 % de patients non évaluables.</p></li></ul><u>5. Critères de jugement secondaires</u><ul><li><p><strong>Tolérance</strong>, selon NCI-CTCAE v5.0</p></li><li><p><strong>OS à 6 mois</strong> selon le statut PD-L1</p></li><li><p><strong>Taux de réponse objective (ORR)</strong> selon RECIST 1.1</p></li><li><p><strong>PFS à 3 et 6 mois</strong></p></li><li><p>PFS selon l'expression de PD-L1</p></li><li><p><strong>Qualité de vie</strong> : EORTC QLQ-C30, OES-18 et QLQ-ELD14</p></li><li><p>OS et PFS selon les paramètres gériatriques : <strong>G-CODE, ADL, IADL</strong></p></li><li><p>Étude de biomarqueurs immunitaires.</p></li></ul><u>6. Principaux critères d'inclusion</u><ul><li><p><strong>≥ 70 ans</strong></p></li><li><p><b>Carcinome épidermoïde de l'œsophage histologiquement confirmé</b></p></li><li><p><b>Cancer</b> <strong>métastatique ou localement avancé</strong></p></li><li><p>Absence de traitement antérieur en première intention</p></li><li><p><strong>Non-éligibilité à une chimiothérapie à base de platine</strong>, évaluée par l'oncologue et le gériatre</p></li><li><p>OMS <strong>0–2</strong></p></li><li><p>Au moins une lésion évaluable et/ou mesurable selon RECIST 1.1</p></li><li><p>Espérance de vie &gt; 3 mois</p></li><li><p>Fonction médullaire et viscérale compatible avec le traitement</p></li><li><p>Consentement éclairé.</p></li></ul><u>7. Traitement étudié<br></u><p><span style=\"color: var(--ink); font-family: inherit\"><b>TISLELIZUMAB</b></span><strong>&nbsp;200 mg IV toutes les 3 semaines</strong></p><ul><li><p>Monothérapie</p></li><li><p>Jusqu'à <strong>34 cycles maximum</strong></p></li><li><p>Poursuite jusqu'à progression ou toxicité inacceptable</p></li><li><p>Traitement administré <strong>indépendamment du statut PD-L1</strong>.</p></li></ul><u>8. Premiers résultats</u><p><strong>Il n'existe pas encore de résultats d'efficacité publiés.</strong></p><p>L'étude est actuellement en recrutement. Le protocole prévoit :</p><ul><li><p><strong>95 patients</strong> au total</p></li><li><p>Une analyse intermédiaire après <strong>42 patients évaluables</strong> ayant bénéficié d'au moins une dose et disposant de 6 mois de suivi</p></li><li><p>Début théorique des inclusions : <strong>2025</strong></p></li><li><p>Fin théorique des inclusions : <strong>2027</strong></p></li><li><p>Analyse finale prévue en <strong>2030</strong>.</p></li></ul><p>Ainsi, il n'est pas encore possible de conclure sur l'efficacité du&nbsp;<span>TISLELIZUMAB</span>&nbsp;dans cette population.</p><u>9. Conclusion</u><p><strong>SAFE-ESO est une étude de phase II à bras unique qui cherche à évaluer une stratégie d'immunothérapie seule chez une population particulièrement fragile : les patients ≥70 ans atteints d'un carcinome épidermoïde de l'œsophage avancé et non éligibles à une chimiothérapie à base de platine.</strong></p><p>➡️ <strong>Point clé à retenir :</strong> SAFE-ESO cherche à déterminer si le&nbsp;<span><b>TISLELIZUMAB</b></span><strong>&nbsp;seul</strong> permet d'obtenir un taux de survie à 6 mois suffisamment élevé chez ces patients âgés et non éligibles à la chimiothérapie.</p></div>","id": "c13c5434-413b-4864-a466-bac705bc4f82","tags": ["SAFE-ESO","TISLELIZUMAB","oncologie","carcinome épidermoïde","oesophage"],"titre": "SAFE-ESO","urgent": false},{"categorie": "MICI","contenu": "<div><i>GUSELKUMAB versus RISANKIZUMAB dans la maladie de Crohn</i></div><div><br></div><div><u>1. Introduction</u><p>La maladie de Crohn est une maladie inflammatoire chronique intestinale dans laquelle l'axe <strong>IL-23/Th17</strong> joue un rôle majeur dans le maintien de l'inflammation.</p><p>Le <strong>GUSELKUMAB</strong> et le <strong>RISANKIZUMAB</strong> sont deux anticorps monoclonaux ciblant sélectivement la <strong>sous-unité p19 de l'IL-23</strong>.</p><p>Les deux traitements sont désormais utilisés dans la maladie de Crohn, mais les essais ayant conduit à leur autorisation les ont principalement <b>comparés au placebo</b> ou à d'autres mécanismes thérapeutiques.</p><p>➡️ Il manquait donc jusqu'à présent une comparaison directe entre les deux anti-IL-23.</p><u>2. Présentation de l'étude</u><ul><li><p><strong>Nom : CHARGE</strong></p></li><li><p><strong>Full title :</strong> <em>Crohn's Head-to-Head Assessing Risankizumab Versus Guselkumab for One Year</em></p></li><li><p><strong>Phase IIIb</strong></p></li><li><p>Multicentrique,&nbsp;<span style=\"color: var(--ink); font-family: inherit\">Randomisée,&nbsp;</span><span style=\"color: var(--ink); font-family: inherit\">Ouverte,&nbsp;</span><span style=\"color: var(--ink); font-family: inherit\">Contrôlée par comparateur actif</span></p></li><li><p>Environ <strong>530 patients</strong></p></li><li><p>Maladie de Crohn <strong>modérée à sévère</strong></p></li><li><p>Promoteur : <strong>Janssen-Cilag International</strong></p></li><li><p>Début : <strong>mai 2026</strong></p></li><li><p>Statut : <strong>en cours de recrutement</strong></p></li></ul><p>L'étude est prévue dans plusieurs pays européens, dont la France.</p><u>3. Objectif principal</u><p>Comparer directement l'efficacité du :</p><p><strong>GUSELKUMAB&nbsp;</strong><span style=\"color: var(--ink); font-family: inherit\">versus&nbsp;</span><strong style=\"color: var(--ink); font-family: inherit\">RISANKIZUMAB&nbsp;</strong><span style=\"color: var(--ink); font-family: inherit\">chez des patients présentant une maladie de Crohn modérée à sévère.</span></p><p>&gt; L'objectif est donc de déterminer si les deux anti-IL-23 ont une efficacité comparable ou si l'un des deux permet d'obtenir un meilleur contrôle de la maladie à 1 an.</p><u>4. Principaux critères de jugement</u></div><div>- Critère principal<p><strong>Rémission clinique à la semaine 52</strong></p>- Critères secondaires<p>L'étude évalue notamment :</p><ul><li><p>réponse clinique</p></li><li><p>rémission clinique à différents temps</p></li><li><p><strong>réponse/rémission endoscopique</strong></p></li><li><p>évolution des biomarqueurs inflammatoires</p></li><li><p>qualité de vie</p></li><li><p>cicatrisation muqueuse</p></li><li><p>tolérance</p></li><li><p>événements indésirables.</p></li></ul><p>L'intérêt majeur est d'obtenir une comparaison <strong>directe et randomisée</strong>, contrairement aux comparaisons indirectes entre les essais respectifs de chaque médicament.</p><u>5. Population étudiée</u><p>Patients adultes avec :</p><ul><li><p>maladie de Crohn <strong>modérée à sévère</strong></p></li><li><p>maladie active</p></li><li><p>patients ayant nécessité un traitement avancé</p></li><li><p>population avec ou sans exposition préalable à certaines biothérapies selon les critères du protocole</p></li><li><p>évaluation clinique et endoscopique permettant de mesurer l'activité de la maladie.</p></li></ul><p>L'étude inclut des patients adultes de différentes classes d'âge, y compris ≥ 65 ans.</p><u>6. Traitements étudiés</u></div><div><b>BRAS 1 GUSELKUMAB</b><p>Anti-IL-23 p19&nbsp;<span style=\"color: var(--ink); font-family: inherit\">→ induction puis traitement d'entretien selon le schéma validé dans la maladie de Crohn.</span></p><b>BRAS 2 RISANKIZUMAB</b><p>Anti-IL-23 p19&nbsp;<span style=\"color: var(--ink); font-family: inherit\">→ induction puis traitement d'entretien selon le schéma validé dans la maladie de Crohn.</span></p><u>Point important</u><p>Les deux traitements ciblent <strong>la même cytokine : IL-23</strong>, et plus précisément sa sous-unité <strong>p19</strong>.</p><p>La comparaison porte donc sur deux molécules ayant un <strong>mécanisme d'action très proche</strong>, mais avec des caractéristiques pharmacologiques et des schémas d'administration différents.</p><u>7. Pourquoi cette étude est intéressante ?</u><p>Jusqu'à présent, les données disponibles ne permettaient pas de répondre directement à la question :&nbsp;<strong style=\"color: var(--ink); font-family: inherit\">GUSELKUMAB ou RISANKIZUMAB : lequel est le plus efficace dans la maladie de Crohn ?</strong></p><p>Les essais pivotaux des deux molécules ont utilisé des populations, des critères et des comparateurs différents.&nbsp;<span style=\"color: var(--ink); font-family: inherit\">Une comparaison indirecte est donc difficile à interpréter.</span></p><u>8. Résultats disponibles à ce jour</u></div><div>⚠️ PAS ENCORE DE RÉSULTATS DE CHARGE<p>En septembre 2026, CHARGE est toujours <strong>en cours de recrutement</strong>.</p><u>9. Que disent les données disponibles en attendant ?</u><p>Il existe désormais des données de <strong>vraie vie</strong> comparant les deux molécules, mais elles ne remplacent pas un essai randomisé.</p><p>Une étude prospective multicentrique publiée en 2026 a comparé des patients traités par GUSELKUMAB ou RISANKIZUMAB après appariement par score de propension.</p><p>À S12 :</p><p><strong>Rémission clinique :</strong></p><ul><li><p>GUSELKUMAB : <strong>51 %</strong></p></li><li><p>RISANKIZUMAB : <strong>50 %</strong></p></li></ul><p><strong>Réponse clinique :</strong></p><ul><li><p>GUSELKUMAB : <strong>86 %</strong></p></li><li><p>RISANKIZUMAB : <strong>87 %</strong></p></li></ul><p><b>Aucune différence significative</b> n'a été retrouvée dans cette analyse. Cependant, l'effectif était limité et il s'agit d'une étude observationnelle, avec notamment un risque de biais résiduel.</p><p>➡️ Ces données sont donc <strong>exploratoires</strong> et ne permettent pas de conclure à l'équivalence des deux traitements.</p><u>10. Conclusion</u><p><strong>CHARGE est la première étude randomisée head-to-head majeure comparant directement deux anti-IL-23 sélectifs dans la maladie de Crohn : GUSELKUMAB et RISANKIZUMAB.</strong></p></div>","id": "d04f1d5c-5599-4d88-8886-c6c90996cc80","tags": ["CHARGE","risankizumab","guselkumab","crohn"],"titre": "CHARGE","urgent": false},{"categorie": "Oncologie","contenu": "<b><u>SAFIR-ABC10&nbsp;</u></b><div><span style=\"color: var(--ink); font-family: inherit\"><br></span></div><div><span style=\"color: var(--ink); font-family: inherit\"><u>1.Introduction&nbsp;</u></span></div><div><span style=\"color: var(--ink); font-family: inherit\">Les cancers des voies biliaires (cholangiocarcinomes intra-hépatiques, périhilaires et distaux, et cancers de la vésicule biliaire) sont des cancers rares et de mauvais pronostic. En situation avancée, le traitement de 1re ligne repose actuellement sur une chimiothérapie à base de </span><strong style=\"color: var(--ink); font-family: inherit\">CISPLATINE + GEMCITABINE</strong><span style=\"color: var(--ink); font-family: inherit\">, associée à une immunothérapie selon les recommandations et les disponibilités (DURVALUMAB).</span><br></div><div><p>Une proportion importante de ces tumeurs présente toutefois des <strong>altérations moléculaires potentiellement ciblables</strong> (notamment <b>FGFR2, IDH1, HER2 ou BRAF</b>). L'enjeu de SAFIR-ABC10 est de déterminer si l'introduction précoce d'une thérapie ciblée adaptée au profil moléculaire de la tumeur permet d'améliorer le contrôle de la maladie par rapport à la poursuite du traitement standard.</p><u>2. Présentation de l'étude</u><ul><li><p><strong>Phase III</strong>, internationale, multicentrique, randomisée, contrôlée, ouverte.</p></li><li><p><strong>Promoteur : UNICANCER</strong></p></li><li><p><strong>NCT : NCT05615818</strong></p></li><li><p>Étude « umbrella » avec une phase initiale de profilage moléculaire puis une randomisation.</p></li><li><p>Environ <strong>800 patients</strong> doivent être screenés, pour environ <strong>159 patients randomisés</strong>.</p></li><li><p>Randomisation <strong>2:1</strong> entre traitement ciblé et poursuite du traitement standard.</p></li></ul><p><strong><u>Schéma</u> :</strong></p><ol><li><p>Diagnostic de cancer biliaire avancé → profilage moléculaire tumoral.</p></li><li><p>Traitement de 1re ligne standard pendant <strong>4 cycles (12 semaines)</strong>.</p></li><li><p>Si maladie contrôlée et présence d'une anomalie moléculaire ciblable → randomisation :</p><ul><li><p><strong>Bras expérimental :</strong> thérapie moléculaire ciblée adaptée à l'anomalie.</p></li><li><p><strong>Bras contrôle :</strong> poursuite du traitement standard de 1re ligne.</p></li></ul></li></ol><u>3. Objectif principal</u><p>&gt; Évaluer si une <strong>thérapie moléculaire ciblée d'entretien</strong>, adaptée au profil moléculaire tumoral après 4 cycles de traitement standard, améliore la <strong>survie sans progression (PFS)</strong> par rapport à la poursuite du traitement standard.</p><u>4. Critère de jugement principal</u><p><strong>Survie sans progression (PFS)</strong>, évaluée selon les critères <strong>RECIST 1.1</strong>.</p><p>L'hypothèse statistique est de détecter une amélioration de la PFS médiane de <strong>6 à 10 mois</strong>, correspondant à un <strong>HR attendu de 0,60</strong>, avec 80 % de puissance.</p><u>5. Principaux critères d'inclusion</u><p><strong>Phase de screening :</strong></p><ul><li><p>≥ 18 ans.</p></li><li><p><b>Cholangiocarcinome</b> <strong>intra-hépatique, périhilaire ou distal</strong>, ou <b>cancer de la vésicule biliaire.</b></p></li><li><p>Maladie localement avancée non résécable ou métastatique, de novo ou récidivante.</p></li><li><p>Confirmation histologique.</p></li><li><p>ECOG <strong>0–1</strong>.</p></li><li><p>Espérance de vie <b>&gt; 3 mois.</b></p></li><li><p>Candidat à une 1re ligne standard.</p></li><li><p>Tissu tumoral disponible pour analyse moléculaire ou possibilité de biopsie.</p></li><li><p>Consentement éclairé.</p></li></ul><p><strong>Pour la randomisation :</strong></p><ul><li><p>Maladie contrôlée après 4 cycles de traitement standard : réponse complète, réponse partielle ou stabilité.</p></li><li><p>Présence d'une <strong>altération moléculaire ciblable</strong> retenue par le comité moléculaire.</p></li><li><p>Absence de toxicité majeure du traitement de 1re ligne.</p></li><li><p>Fonction médullaire, hépatique, rénale et cardiaque adéquate.</p></li></ul><u>6. Principales anomalies / thérapies ciblées étudiées</u><p>Le portefeuille de l'étude comprend notamment :</p>-<strong>FGFR2&nbsp;</strong>Futibatinib</div><div><strong>- IDH1&nbsp;</strong>Ivosidenib</div><div><strong>- HER2 amplification&nbsp;</strong>Zanidatamab</div><div><strong>- HER2 mutation&nbsp;</strong>Neratinib + Trastuzumab</div><div><strong>- BRAF V600&nbsp;</strong>Encorafenib + Binimetinib<p>Le portefeuille peut évoluer selon les données disponibles et les amendements du protocole.</p><u>7. Premiers résultats / état actuel</u><p><strong>À ce jour, il n'existe pas encore de résultats comparatifs d'efficacité matures.</strong></p><p>L'étude est <strong>toujours en cours d'inclusion en 2026</strong>, avec une fin des inclusions prévue en juin 2027 selon le registre français. L'article publié en 2025 décrit essentiellement le rationnel et le design de l'étude.</p><p>Les données actuellement disponibles permettent donc surtout de retenir :</p><ul><li><p>faisabilité du programme de profilage moléculaire ;</p></li><li><p>sélection des patients présentant une anomalie ciblable ;</p></li><li><p>évaluation prospective de l'approche de médecine de précision ;</p></li><li><p>mais <strong>pas encore de démonstration d'un bénéfice en PFS ou en OS</strong>.</p></li></ul>8. <u>Conclusion</u><p><strong>SAFIR-ABC10 cherche à démontrer qu'une stratégie de médecine de précision peut être intégrée précocement dans la prise en charge des cancers biliaires avancés.</strong></p><p>Le concept est de <strong>ne pas attendre la progression après la 1re ligne</strong> : chez les patients dont la maladie est contrôlée après 4 cycles et dont la tumeur présente une anomalie actionnable, une thérapie ciblée adaptée est introduite en entretien et comparée à la poursuite du traitement standard.</p><p>➡️ <strong>Point clé à retenir :</strong> SAFIR-ABC10 est une étude de phase III évaluant si le <strong>profilage moléculaire + thérapie ciblée en maintenance</strong> permet d'améliorer la <strong>PFS</strong> par rapport à la poursuite du traitement standard chez les patients atteints de cancer biliaire avancé.</p></div>","id": "eb6855ce-9efa-42a5-9537-4394566e01d5","tags": ["SAFIR ABC10","cholangiocarcinome","biliaire","oncologie"],"titre": "SAFIR ABC10","urgent": false},{"categorie": "Oncologie","contenu": "<b><u>TRANSMET</u></b><div><br></div><div><u>1. Introduction</u><p>Les métastases hépatiques du cancer colorectal (CCR) concernent environ 20 à 25&nbsp;% des patients au diagnostic, et jusqu'à 50&nbsp;% en développeront au cours de l'évolution. Lorsque ces métastases sont <b>exclusivement hépatiques mais non résécables</b> (même après chimiothérapie de conversion), le pronostic reste sombre sous chimiothérapie seule, avec une survie à 5 ans de l'ordre de 5 à 10&nbsp;%. La <b>transplantation hépatique</b>, déjà validée pour le cholangiocarcinome hilaire et certains carcinomes hépatocellulaires, restait jusqu'ici contre-indiquée pour les métastases hépatiques du CCR, considérées comme le témoin d'une maladie systémique. L'essai <b>TransMet</b> est le premier essai randomisé de phase&nbsp;3 à évaluer cette stratégie.</p></div><div><br></div><div><u>2. Méthodologie</u><p>Essai randomisé contrôlé, multicentrique, mené dans <b>20 centres européens</b> (dont l'hôpital Paul-Brousse et Gustave&nbsp;Roussy), coordonné par le Pr&nbsp;René&nbsp;Adam, promu par l'AP-HP et financé par le Ministère de la Santé (PHRC-Cancer 2013).</p><p><b>Critères d'inclusion principaux&nbsp;:</b></p><ul><li>Âge 18-65 ans</li><li>Métastases hépatiques du CCR exclusivement hépatiques, jugées non résécables</li><li>Maladie contrôlée (réponse ou stabilité) après au moins 3 mois de chimiothérapie</li><li>Maximum 3 lignes de traitement antérieures</li></ul><p><b>Randomisation 1:1</b> entre&nbsp;:</p><ul><li>Transplantation hépatique + chimiothérapie</li><li>Chimiothérapie seule (bras standard)</li></ul><div><img src=\"cd147e5602dcbeebef3465b38e7f4f7d.png\"><br></div><p><b>94 patients</b> randomisés, dont <b>74</b> ayant effectivement reçu le traitement assigné (analyse en intention de traiter modifiée). Suivi médian de 50 mois.</p><p><b>Critère de jugement principal&nbsp;:</b> survie globale à 5 ans.</p></div><div><br></div><div><u>3. Résultats</u><p>Publiés dans <i>The Lancet</i> le 21 septembre 2024.</p><ul><li><b>Survie globale à 5 ans&nbsp;:</b> 73&nbsp;% (bras transplantation) vs 9&nbsp;% (bras chimiothérapie seule)</li><li><b>Rémission complète&nbsp;:</b> 42&nbsp;% vs 3&nbsp;%</li><li>Taux de complications sévères <b>comparable</b> entre les deux groupes</li></ul></div><div><img src=\"b1a84ad1324f9d3f41cb8c94a88a1d0b.png\"><br></div><div><u>4. Conclusion</u><p>TransMet démontre que la <b>transplantation hépatique associée à la chimiothérapie</b> constitue une <b>stratégie potentiellement curative</b> chez des patients soigneusement sélectionnés porteurs de métastases hépatiques non résécables du cancer colorectal, remettant en question le dogme d'une contre-indication systématique de la greffe dans ce contexte. Ces résultats pourraient faire évoluer les recommandations oncologiques, sous réserve d'une sélection rigoureuse des patients (centres experts, critères stricts) compte tenu de la rareté des greffons.</p></div><div><br></div><div><u>📚 Référence</u><p>Adam R, et al. Liver transplantation plus chemotherapy versus chemotherapy alone in patients with permanently unresectable colorectal liver metastases (TransMet): a multicentre, open-label, prospective, randomised, controlled, phase 3 trial. <i>Lancet</i>. 2024.</p></div>","id": "transmet","tags": ["TRANSMET","transplantation hépatique","métastases hépatiques colorectales","cancer colorectal"],"titre": "TRANSMET","urgent": false}];

  function n(v) { var x = parseFloat(v); return isNaN(x) ? 0 : x; }

  function computeGBS(v) {

    if (uree >= 25) p += 6; else if (uree >= 10) p += 4; else if (uree >= 8) p += 3; else if (uree >= 6.5) p += 2;

  }

  function computeRockall(v) {

  function computeMaddrey(v) {
    var tpPatientSec = n(v.tpPatientSec);
    var tpTemoinSec = n(v.tpTemoinSec);

  function computeMELD(v) {
    var bili = n(v.bili) / 17.1;
    var creatRaw = n(v.creat) / 88.4;
    var inr = n(v.inr);
    if (bili < 1) bili = 1;
    if (inr < 1) inr = 1;
    var creat = v.dialyse ? 4.0 : creatRaw;
    if (creat < 1) creat = 1;
    if (creat > 4) creat = 4;
    var raw = 3.78 * Math.log(bili) + 11.2 * Math.log(inr) + 9.57 * Math.log(creat) + 6.43;
    var score = Math.round(raw);
    if (score < 6) score = 6;
    if (score > 40) score = 40;
    var band = score >= 40 ? "mortalité à 3 mois d'environ 71 % dans les cohortes publiées" :

    return { value: score, unit: "(6 à 40)", badge: score >= 20 ? "Sévérité élevée" : "Sévérité modérée à faible",
      interpretation: "MELD calculé selon la formule classique (bilirubine, INR, créatinine). À titre indicatif : " + band + ". Les seuils d'inscription en transplantation varient selon les programmes." };

  function computeFIB4(v) {
    var age = n(v.age), ast = n(v.ast), alt = n(v.alt), plt = n(v.plaquettes);
    var score = (plt > 0 && alt > 0) ? (age * ast) / (plt * Math.sqrt(alt)) : NaN;

  // Legacy plain-text markup (from the previous editor) -> HTML, for old entries only.
  function legacyToHtml(text) {
    var out = esc(text);
    out = out.replace(/\[color=(#[0-9a-fA-F]{6})\]([\s\S]*?)\[\/color\]/g, function (m, c, inner) { return '<span style="color:' + c + '">' + inner + '</span>'; });
    out = out.replace(/\[font=(serif|sans|mono|manuscrite)\]([\s\S]*?)\[\/font\]/g, function (m, f, inner) { return '<span style="font-family:' + FONT_CSS[f] + '">' + inner + '</span>'; });
    out = out.replace(/\*\*([\s\S]*?)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/__([\s\S]*?)__/g, "<u>$1</u>");

  function looksLikeHtml(text) {

  // Whitelist sanitizer: strips scripts/handlers/unknown tags, keeps basic formatting + images.
  var ALLOWED_TAGS = { P: 1, BR: 1, DIV: 1, STRONG: 1, B: 1, EM: 1, I: 1, U: 1, UL: 1, OL: 1, LI: 1, SPAN: 1, FONT: 1, IMG: 1, TABLE: 1, THEAD: 1, TBODY: 1, TR: 1, TH: 1, TD: 1 };
  function sanitizeHtml(html) {
    var doc;
    try { doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html"); } catch (e) { return esc(html); }
    var root = doc.body.firstChild;
    if (!root) return "";
    (function clean(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (child) {
        if (child.nodeType === 3) return;
        if (child.nodeType !== 1) { node.removeChild(child); return; }
        var tag = child.tagName;
        if (!ALLOWED_TAGS[tag]) {
          while (child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          return;
        }
        Array.prototype.slice.call(child.attributes).forEach(function (attr) {
          var name = attr.name.toLowerCase();
          if (tag === "IMG") {
            if (name === "src") {
              if (!/^data:image\//.test(attr.value) && !/^https:\/\//.test(attr.value) && !/^\/_blob\//.test(attr.value) && !/^assets\//.test(attr.value)) child.removeAttribute(attr.name);
            } else if (name === "alt" || name === "width" || name === "height") { /* keep */ }
            else child.removeAttribute(attr.name);
          } else if (name === "class" && tag === "UL") { /* keep bullet/dash-list class */ }
          else if (name === "style") {
            var safe = attr.value.split(";").map(function (s) { return s.trim(); })
              .filter(function (rule) {
                return /^(color|background-color|background|font-family|font-weight|font-style|text-decoration|text-align|border|border-left|border-right|border-top|border-bottom|border-radius|padding|padding-left|padding-right|padding-top|padding-bottom|margin|margin-left|margin-right|margin-top|margin-bottom)\s*:/.test(rule)

  }

  // ---------------- local storage fallback ----------------
  function loadLocal(moduleKey) {

    try { localStorage.setItem(LOCAL_PREFIX + moduleKey, JSON.stringify(items)); } catch (e) {}
  }

  // ---------------- data layer ----------------
  function upsertItem(moduleKey, item) {
    item.updatedAt = new Date().toISOString();
    if (usingDb && cols[moduleKey]) {
      cols[moduleKey].doc(item.id).set(item).catch(function (err) {
        console.error("Écriture impossible :", err);
        alert("La sauvegarde a échoué (" + (err && err.code || "erreur") + ").");
      });
    } else {
      var arr = state.data[moduleKey];
      var idx = arr.findIndex(function (f) { return f.id === item.id; });
      if (idx >= 0) arr[idx] = item; else arr.push(item);
      saveLocal(moduleKey, arr);
      render();
    }
  }
  function removeItem(moduleKey, id) {
    if (usingDb && cols[moduleKey]) {
      cols[moduleKey].doc(id).delete().catch(function (err) {

      });
    } else {
      state.data[moduleKey] = state.data[moduleKey].filter(function (f) { return f.id !== id; });
      saveLocal(moduleKey, state.data[moduleKey]);
      render();
    }
  }

  function initLocalFallback(moduleKey) {
    var cached = loadLocal(moduleKey);
    if (cached && cached.length) {
      state.data[moduleKey] = cached;
    } else {
      state.data[moduleKey] = MODULES[moduleKey].seed.map(function (f) {
        return Object.assign({}, f, { updatedAt: new Date().toISOString() });
      });
      saveLocal(moduleKey, state.data[moduleKey]);
    }
    state.loaded[moduleKey] = true;
    render();
  }

  function seedDbIfNeeded(moduleKey) {
    var marker = window.__db.doc("meta/seeded_" + moduleKey);

      var seed = MODULES[moduleKey].seed;
      var writes = seed.map(function (f) {
        var withDate = Object.assign({}, f, { updatedAt: new Date().toISOString() });
        return cols[moduleKey].doc(f.id).set(withDate);
      });
      Promise.all(writes).then(function () { marker.set({ seededAt: new Date().toISOString() }); })
        .catch(function (err) { console.error("Amorçage impossible :", err); });
    }).catch(function (err) { console.error("Vérification de l'amorçage impossible :", err); });
  }

            '<div class="content-editable" id="content-editor" contenteditable="true" data-placeholder="Rédigez librement le contenu de la fiche…">' + (f && f.contenu ? formatRich(f.contenu) : "") + "</div>" +
            '<input type="file" id="image-upload-input" accept="image/*" style="display:none"></div>' +
          '<div class="field"><label>Mots-clés</label><input type="text" name="tags" placeholder="séparés par des virgules" value="' + esc(f ? (f.tags || []).join(", ") : "") + '"></div>' +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Enregistrer</button>' +
          '<button type="button" class="btn btn-ghost" data-action="' + (isEdit ? "back-to-detail" : "back-to-list") + '" data-id="' + esc(f ? f.id : "") + '">Annuler</button></div>' +
        "</form>" +
      "</div>"
    );
  }

  function renderModuleTab(moduleKey) {
    var v = state.view[moduleKey];
    if (!state.loaded[moduleKey]) return '<p class="muted">Chargement…</p>';
    if (v.mode === "form") return renderBanner() + renderForm(moduleKey, v.editingId ? findItem(moduleKey, v.editingId) : null);
    if (v.mode === "detail") {
      var f = findItem(moduleKey, v.selectedId);
      if (!f) { v.mode = "liste"; return renderModuleTab(moduleKey); }
      return renderBanner() + renderDetail(moduleKey, f);
    }
    var list = visibleItems(moduleKey);
    var heading = v.categorie === "Toutes" ? "Toutes les entrées" : v.categorie;
    var html = renderBanner();
    html += '<div class="view-head"><h2 class="serif">' + esc(heading) + "</h2><span class=\"muted\">" + list.length + " entrée(s)</span></div>";
    if (!list.length) {
      html += '<div class="empty"><h3 class="serif">Aucune entrée ne correspond</h3><p>Essayez une autre recherche ou catégorie, ou créez une nouvelle entrée.</p></div>';
    } else {
      html += '<div class="grid">' + list.map(function (f) { return itemCard(moduleKey, f); }).join("") + "</div>";
    }
    return html;
  }

  function scoreCard(s) {
    return '<div class="card" data-action="open-score" data-id="' + esc(s.id) + '"><h3>' + esc(s.nom) + "</h3><p>" + esc(s.description) + "</p></div>";
  }

  function renderScoreForm(s) {
    return s.inputs.map(function (inp) {
      if (inp.type === "checkbox") {
        return '<div class="field"><div class="checkbox-row"><input type="checkbox" id="si-' + inp.key + '" name="' + inp.key + '"><label for="si-' + inp.key + '" style="margin:0;">' + esc(inp.label) + "</label></div></div>";
      }
      if (inp.type === "select") {
        var opts = inp.options.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>"; }).join("");
        return '<div class="field"><label>' + esc(inp.label) + '</label><select name="' + inp.key + '">' + opts + "</select></div>";
      }
      return '<div class="field"><label>' + esc(inp.label) + '</label><input type="number" step="' + (inp.step || "any") + '" name="' + inp.key + '"' + (inp.value != null ? ' value="' + esc(inp.value) + '"' : "") + "></div>";
    }).join("");
  }

  function renderScoreDetail(s) {
    return (
      '<a class="link-btn" data-action="back-to-scores">← Retour aux scores</a>' +
      '<div class="detail-card" style="margin-top:14px;">' +
        "<h2 class=\"serif\">" + esc(s.nom) + "</h2>" +
        '<p class="detail-resume">' + esc(s.description) + "</p>" +
        (s.tableHtml ? s.tableHtml : "") +
        (s.reference ? '<p class="score-reference">' + esc(s.reference) + "</p>" : "") +
        (s.note ? '<div class="note"><span>ⓘ</span><span>' + esc(s.note) + "</span></div>" : "") +
        '<form id="score-form" class="calc-form">' + renderScoreForm(s) +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Calculer</button></div>' +
        "</form>" +
        '<div id="score-result"></div>' +
      "</div>"
    );
  }

  function renderScoresTab() {
    if (state.scoreOpenId) {
      var s = SCORES.find(function (x) { return x.id === state.scoreOpenId; });
      if (s) return renderScoreDetail(s);
    }
    var html = '<div class="note"><span>ⓘ</span><span>Ces calculateurs sont des outils d\'aide ; le résultat doit toujours être interprété selon le contexte clinique global et vérifié avant toute décision.</span></div>';
    html += '<div class="view-head"><h2 class="serif">Scores</h2></div>';
    if (!SCORES.length) {
      html += '<div class="empty"><h3 class="serif">Aucun score pour l\'instant</h3><p>Cet onglet est vide en attendant que de nouveaux calculateurs y soient ajoutés.</p></div>';
      return html;
    }
    SCORE_GROUPS.forEach(function (g) {
      var items = SCORES.filter(function (s) { return s.groupe === g; });
      if (!items.length) return;
      html += '<div class="score-group-title">' + esc(g) + '</div><div class="grid">' + items.map(scoreCard).join("") + "</div>";
    });
    return html;
  }

  function renderMain() {
    var main = document.getElementById("main");
    main.innerHTML = state.tab === "scores" ? renderScoresTab() : renderModuleTab(state.tab);
  }

  // ---------------- form events ----------------
  function bindFormEvents() {
    var searchInput = document.getElementById("search-input");
    if (searchInput) {
      searchInput.addEventListener("input", function (e) {
        state.view[state.tab].recherche = e.target.value;
        document.getElementById("main").innerHTML = renderModuleTab(state.tab);
        var el = document.getElementById("search-input");
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    var scoreForm = document.getElementById("score-form");
    if (scoreForm) {
      scoreForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var s = SCORES.find(function (x) { return x.id === state.scoreOpenId; });
        if (!s) return;
        var fd = new FormData(scoreForm);
        var values = {};
        s.inputs.forEach(function (inp) {
          if (inp.type === "checkbox") values[inp.key] = fd.get(inp.key) === "on";
          else values[inp.key] = fd.get(inp.key);
        });
        var result = s.compute(values);
        document.getElementById("score-result").innerHTML =
          '<div class="result-panel"><span class="value">' + esc(result.value) + '</span> <span class="muted">' + esc(result.unit) + '</span><span class="badge">' + esc(result.badge) + "</span><p>" + esc(result.interpretation) + "</p></div>";
      });
    }
  }

  // ---------------- click delegation ----------------
  document.body.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    switch (action) {
      case "toggle-sidebar": state.sidebarOpen = !state.sidebarOpen; render(); break;
      case "close-sidebar": state.sidebarOpen = false; render(); break;
      case "set-tab":
        state.tab = el.getAttribute("data-tab");
        state.sidebarOpen = false;
        state.scoreOpenId = null;
        render();
        break;
      case "set-cat":
        var v1 = state.view[state.tab];
        v1.categorie = el.getAttribute("data-cat");
        v1.mode = "liste";
        state.sidebarOpen = false;
        render();
        break;
      case "open-item":
        var v2 = state.view[state.tab];
        v2.selectedId = id; v2.mode = "detail"; state.sidebarOpen = false; render();
        break;
      case "back-to-list":
        var v6 = state.view[state.tab];
        v6.mode = "liste"; v6.selectedId = null; v6.editingId = null; render();
        break;
      case "back-to-detail":
        var v7 = state.view[state.tab];
        v7.mode = id ? "detail" : "liste"; v7.selectedId = id || null; v7.editingId = null; render();
        break;
      case "open-score": state.scoreOpenId = id; render(); break;
      case "back-to-scores": state.scoreOpenId = null; render(); break;
      case "export": doExport(); break;
    }
  });

  function doExport() {
    var payload = { fiches: state.data.fiches, medicaments: state.data.medicaments, recommandations: state.data.recommandations };
    var data = JSON.stringify(payload, null, 2);
    if (downloadsCap) {
      downloadsCap.save({ filename: "gastrofiches-export.json", data: data }).catch(function (err) {
        if (err && err.code === "declined") return;
        alert("Export impossible ici (" + (err && err.code || "erreur") + ").");
      });
    } else {
      window.prompt("Copiez ce contenu pour sauvegarder vos données :", data);
    }
  }

  init();
})();
</script>
</body>
</html>
