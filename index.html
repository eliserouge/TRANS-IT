quettes</strong> ni d'apport de <strong>fibrinogène</strong> : ces paramètres ne prédisent ni l'échec d'hémostase ni la récidive ; à discuter uniquement en cas d'échec de contrôle du saignement</li>\n<li>Pas de <strong>facteur VIIa recombinant</strong>, pas d'<strong>acide tranexamique</strong></li>\n<li>Pas de clips, clips « over-the-scope », poudres hémostatiques ou colle de fibrine en première intention</li>\n<li><strong>Anticoagulants</strong> : à suspendre jusqu'au contrôle du saignement ; date de reprise individualisée selon la force de l'indication</li>\n</ul></div>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.4 Explorations</p>\n<ul>\n<li><strong>Endoscopie haute dans les 12 heures</strong> suivant l'admission, après stabilisation ; dès que possible si le patient reste instable, selon la disponibilité locale</li>\n<li><strong>Imagerie abdominale en coupes avec injection (scanner ou IRM) pour tous</strong> : recherche d'une thrombose porte ou splanchnique, d'un carcinome hépatocellulaire, et cartographie des collatérales porto-systémiques pour guider le traitement</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.5 Traitement endoscopique selon la source</p>\n<table>\n<tr><th>Source</th><th>Traitement</th></tr>\n<tr><td><strong>Varices œsophagiennes et varices gastro-œsophagiennes de type 1 (GOV1)</strong></td><td><strong>Ligature élastique</strong> immédiate</td></tr>\n<tr><td><strong>Varices gastriques GOV2 ou IGV1 (cardio-fundiques)</strong></td><td>Prise en charge <strong>bimodale</strong>, les deux phases pouvant être menées en parallèle ; si elles sont séquentielles, réduire au maximum le délai entre elles</td></tr>\n<tr><td>Varices ectopiques</td><td>Traitement endovasculaire (TIPS ou obturation transveineuse) ou endoscopique</td></tr>\n</table>\n<p><strong>Varices gastriques — phase aiguë :</strong> hémostase par injection endoscopique de cyanoacrylate <em>ou</em> traitement guidé par écho-endoscopie, d'efficacité comparable pour le contrôle initial. Le <strong>coil + cyanoacrylate sous écho-endoscopie</strong> est à privilégier en centre expérimenté : meilleur taux d'obturation, moins de récidives tardives et de réinterventions.</p>\n<p><strong>Varices gastriques — phase définitive :</strong> <strong>TIPS ± embolisation des varices</strong>, le plus tôt possible, traitement de référence. Si le TIPS est contre-indiqué : obturation transveineuse, traitements endoscopiques (y compris sous écho-endoscopie) ou chirurgie, après discussion multidisciplinaire, selon l'anatomie et le site de saignement.</p>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.6 TIPS préemptif</p>\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Indication</p><p>Prothèse couverte de polytétrafluoroéthylène posée <strong>dans les 72 heures, idéalement dans les 24 heures</strong>, chez un patient saignant de varices œsophagiennes ou GOV1 répondant à <strong>au moins un</strong> des critères :</p>\n<ul>\n<li><strong>Child-Pugh C, 10 à 13 points</strong></li>\n<li><strong>Child-Pugh B > 7 points avec saignement actif</strong> à l'endoscopie initiale</li>\n<li><strong>Gradient de pression sus-hépatique ≥ 20 mmHg</strong> au moment de l'hémorragie</li>\n</ul>\n<p>Critères associés de l'algorithme : âge < 75 ans, créatinine < 3 mg/dL (< 265 µmol/L), absence d'insuffisance cardiaque.</p></div>\n<ul>\n<li><strong>Fenêtre dépassée</strong> : un bénéfice persiste possiblement jusqu'à <strong>2 semaines</strong> chez le Child-Pugh C 10–13, et jusqu'à <strong>1 semaine</strong> chez le Child-Pugh B > 7 avec saignement actif</li>\n<li><strong>Ne sont pas des contre-indications absolues</strong> : insuffisance hépatique aiguë sur chronique, encéphalopathie, hyperbilirubinémie, score MELD élevé, hépatite alcoolique sévère</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.7 Échec d'hémostase</p>\n<p>Définition : saignement non contrôlé ou récidive dans les 5 jours.</p>\n<ul>\n<li><strong>Prothèse œsophagienne couverte auto-expansible</strong>, préférée au tamponnement par ballonnet, comme <strong>pont</strong> vers le TIPS ou la transplantation</li>\n<li><strong>TIPS de sauvetage</strong> en cas d'échec du traitement pharmacologique et endoscopique combinés ; à discuter au cas par cas <strong>quels que soient l'âge, le Child-Pugh et le MELD</strong>, avec évaluation simultanée de la candidature à la transplantation</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.8 Après l'hémorragie</p>\n<ul>\n<li><strong>Nutrition orale dès que possible</strong> : la dénutrition aggrave le pronostic</li>\n<li><strong>Supplémentation en fer</strong> avant la sortie si anémie par spoliation (hémoglobine < 10 g/dL)</li>\n<li><strong>Prévention secondaire : bêtabloquant (carvédilol préféré) + ligature</strong>, séances de ligature répétées <strong>toutes les 2 à 4 semaines jusqu'à éradication</strong></li>\n<li>Récidive malgré ce traitement → <strong>TIPS</strong></li>\n<li><strong>Pronostic</strong> : la mortalité à 6 semaines est le critère de jugement de référence ; ses principaux déterminants sont le Child-Pugh C, le MELD (et ses variantes MELD-Na, MELD 3.0) et l'échec de contrôle du saignement</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.9 Situations associées</p>\n<ul>\n<li><strong>Thrombose porte</strong> : prise en charge de l'hémorragie identique à celle des patients sans thrombose ; un TIPS ± recanalisation portale se discute si ascite, progression de la thrombose ou candidature à la transplantation</li>\n<li><strong>Carcinome hépatocellulaire</strong> : sa présence seule n'exclut aucune option ; décision multidisciplinaire intégrant la fonction hépatique et le pronostic tumoral</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">B. SAIGNEMENTS NON VARIQUEUX LIÉS À L'HYPERTENSION PORTALE</p>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">B.1 Ectasies vasculaires antrales (GAVE)</p>\n<ul>\n<li>À <strong>distinguer formellement</strong> de la gastropathie d'hypertension portale : les traitements diffèrent</li>\n<li>Ne répond <strong>pas</strong> à la baisse de la pression portale</li>\n<li>Si transfusions itératives : <strong>ligature élastique préférée à la coagulation au plasma argon</strong> — meilleure éradication, moins de séances, moins de récidives hémorragiques, d'hospitalisations et de transfusions</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">B.2 Gastropathie d'hypertension portale</p>\n<ul>\n<li>Traitement principal : <strong>baisse de la pression portale par bêtabloquant</strong></li>\n<li>Saignement sévère ou réfractaire : <strong>TIPS</strong>, traitement de recours le plus efficace</li>\n<li>Les traitements endoscopiques n'agissent pas sur l'hypertension portale : bénéfice limité, réservés aux lésions focales ou aux situations de sauvetage</li>\n<li>Le saignement occulte de gastro-entéropathie d'hypertension portale <strong>n'est pas</strong> un événement de décompensation</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">B.3 Ulcère post-ligature</p>\n<ul>\n<li>Complication <strong>rare mais grave</strong> ; prise en charge individualisée pouvant associer vasoactifs, hémostase endoscopique, prothèse ou tamponnement temporaire, et <strong>TIPS de sauvetage avec embolisation</strong> ; risque accru si <strong>MELD > 18</strong> ou ligature réalisée en urgence</li>\n<li><strong>Pas d'inhibiteur de la pompe à protons systématique</strong> en prévention : preuves insuffisantes</li>\n</ul><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche4","tags": ["Baveno VIII","hypertension portale","urgence"],"titre": "Hémorragie par rupture de varices — puis saignements non variqueux","urgent": true},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Anastomose porto-cave intrahépatique par voie transjugulaire — quand la proposer, comment préparer le patient, comment gérer les complications.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Indications retenues par Baveno VIII</p>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Hémorragie</p>\n<ul>\n<li><strong>TIPS préemptif</strong>, dans les 72 heures (idéalement < 24 h) : Child-Pugh C 10–13, ou Child-Pugh B > 7 avec saignement actif à l'endoscopie, ou gradient ≥ 20 mmHg</li>\n<li><strong>TIPS de sauvetage</strong> : échec d'hémostase malgré traitement pharmacologique et endoscopique</li>\n<li><strong>Échec de prévention secondaire</strong> : récidive malgré bêtabloquant + ligature</li>\n<li><strong>Varices gastriques GOV2/IGV1</strong> : TIPS ± embolisation, traitement définitif préféré</li>\n<li>Gastropathie d'hypertension portale sévère ou réfractaire ; varices ectopiques</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Ascite et hydrothorax</p>\n<ul>\n<li><strong>Ascite récidivante ou réfractaire</strong> : tout patient doit être considéré pour un TIPS, et la discussion doit être menée <strong>conjointement avec celle de la transplantation</strong></li>\n<li><strong>Hydrothorax hépatique réfractaire</strong> au traitement médical standard</li>\n<li><strong>Patient de 70 ans ou plus</strong> : possible au cas par cas, après évaluation du rapport bénéfice/risque</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Autres</p>\n<ul>\n<li><strong>Thrombose porte du cirrhotique</strong> (voir fiche dédiée) : absence d'amélioration sous anticoagulation avec complications d'hypertension portale, ou candidature à la transplantation ; en première intention si anticoagulation contre-indiquée</li>\n<li><strong>Encéphalopathie récidivante</strong> : ce n'est pas une indication ; c'est l'<em>embolisation</em> des gros shunts spontanés qui est discutée</li>\n<li><strong>Avant chirurgie majeure</strong> : un TIPS pré-opératoire peut être envisagé pour réduire le risque de décompensation post-opératoire</li>\n</ul>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Non indiqué</p><ul>\n<li><strong>Prévention de la décompensation</strong> chez un patient compensé avec hypertension portale cliniquement significative</li>\n<li><strong>TIPS préemptif dans les maladies vasculaires du foie</strong> : aucune donnée</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Ce qui n'est PAS une contre-indication</p>\n<ul>\n<li><strong>Insuffisance hépatique aiguë sur chronique, encéphalopathie, hyperbilirubinémie, MELD élevé, hépatite alcoolique sévère</strong> — dans le cadre du TIPS préemptif</li>\n<li><strong>Antécédent d'encéphalopathie patente</strong> : pas de contre-indication absolue au TIPS électif, décision individualisée selon le contexte clinique</li>\n<li><strong>Sarcopénie ou fragilité isolées</strong> : elles ne constituent ni une indication ni une contre-indication ; elles s'intègrent au bilan global. Elles peuvent d'ailleurs s'améliorer après TIPS</li>\n<li><strong>Carcinome hépatocellulaire</strong> : pas de contre-indication absolue en cas d'ascite récidivante/réfractaire ou d'hydrothorax, <em>sauf</em> si la tumeur siège sur le trajet du TIPS ; le meilleur contrôle de la décompensation peut faciliter l'accès aux traitements oncologiques</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Bilan avant TIPS électif</p>\n<ul>\n<li><strong>Fonction rénale systématique</strong>, avec stadification de la maladie rénale chronique (débit de filtration glomérulaire) à visée de stratification du risque</li>\n<li><strong>Recherche soigneuse d'un antécédent d'encéphalopathie patente</strong> et des traitements spécifiques en cours</li>\n<li>Imagerie en coupes avec injection : anatomie vasculaire, thrombose, carcinome hépatocellulaire</li>\n<li>Échocardiographie (usage courant) : recherche d'une insuffisance cardiaque, qui contre-indique notamment le TIPS préemptif</li>\n<li>Évaluation nutritionnelle, de la sarcopénie et de la fragilité</li>\n<li><strong>Discussion parallèle de la transplantation hépatique</strong></li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Modalités techniques</p>\n<ul>\n<li><strong>Prothèse couverte de polytétrafluoroéthylène</strong></li>\n<li><strong>Calibre</strong> : dilater au <strong>plus petit diamètre permettant une réponse suffisante</strong>, pour limiter le sur-shuntage (encéphalopathie, insuffisance cardiaque) tout en préservant l'efficacité</li>\n<li><strong>Dilatation par paliers</strong> si l'ascite ne s'améliore pas</li>\n<li><strong>Rifaximine</strong> en prophylaxie de l'encéphalopathie chez les candidats à un TIPS électif — posologie usuelle : 550 mg × 2/j</li>\n<li>Mesure du gradient porto-cave : les valeurs relevées immédiatement après la pose sont peu fiables (anesthésie, vasoactifs, instabilité) ; préférer une mesure chez un patient stable et non sédaté</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Complications et conduite à tenir</p>\n<table>\n<tr><th>Complication</th><th>Conduite</th></tr>\n<tr><td><strong>Encéphalopathie récidivante ou persistante après TIPS</strong></td><td>Rechercher et corriger les facteurs déclenchants, optimiser le traitement médical ; puis envisager l'<strong>embolisation d'un shunt spontané</strong> et/ou la <strong>réduction voire l'occlusion du TIPS</strong></td></tr>\n<tr><td><strong>Encéphalopathie réfractaire</strong> aux traitements médicaux et interventionnels</td><td><strong>Priorisation pour la transplantation hépatique</strong></td></tr>\n<tr><td><strong>Sur-shuntage</strong> : encéphalopathie, insuffisance cardiaque</td><td>Prévention par le choix du plus petit calibre efficace</td></tr>\n<tr><td><strong>Ascite non améliorée</strong></td><td>Dilatation par paliers de la prothèse</td></tr>\n<tr><td>Thrombose porte associée</td><td><strong>Pas d'anticoagulation systématique</strong> après TIPS</td></tr>\n</table>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Pièges</p><ul>\n<li>La disparition de l'ascite ou l'absence de récidive hémorragique <strong>après TIPS</strong> ne suffisent pas, à elles seules, à définir une recompensation ; tous les critères doivent être réunis</li>\n<li>Le TIPS ne dispense <strong>jamais</strong> de la discussion de transplantation : les deux options s'examinent ensemble</li>\n</ul></div><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche5","tags": ["Baveno VIII","hypertension portale","TIPS"],"titre": "TIPS : indications, contre-indications, modalités, complications","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Poser le diagnostic, chercher le facteur d&eacute;clenchant, traiter l&rsquo;ascite, et surtout mettre en place tout ce qui pr&eacute;vient la d&eacute;compensation suivante.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Poser le diagnostic de d&eacute;compensation</p>\n<ul>\n<li>L&rsquo;<strong>ascite cliniquement &eacute;vidente</strong> (ou l&rsquo;hydrothorax h&eacute;patique) li&eacute;e &agrave; l&rsquo;hypertension portale d&eacute;finit la d&eacute;compensation, au m&ecirc;me titre que l&rsquo;h&eacute;morragie variqueuse et l&rsquo;enc&eacute;phalopathie patente (West Haven &ge; II)</li>\n<li><strong>Ne comptent pas</strong> comme d&eacute;compensation&nbsp;: ascite minime ou visible seulement en imagerie, enc&eacute;phalopathie minime, saignement occulte de gastro-ent&eacute;ropathie &mdash; mais une ascite minime peut d&eacute;j&agrave; s&rsquo;associer &agrave; une survie r&eacute;duite</li>\n<li>Le passage de l&rsquo;&eacute;tat compens&eacute; &agrave; l&rsquo;&eacute;tat d&eacute;compens&eacute; <strong>augmente nettement la mortalit&eacute;</strong></li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Bilan initial</p>\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Bilan infectieux minimal</p><p>Chez <strong>tout patient hospitalis&eacute; pour d&eacute;compensation</strong>, une infection bact&eacute;rienne doit &ecirc;tre &eacute;limin&eacute;e. Le bilan minimal comprend&nbsp;: <strong>ponction d&rsquo;ascite exploratrice, radiographie de thorax, h&eacute;mocultures, cultures d&rsquo;ascite et d&rsquo;urines, examen cutan&eacute;</strong> (&eacute;nonc&eacute; Baveno VII toujours valide).</p></div>\n<ul>\n<li><strong>Ponction exploratrice syst&eacute;matique</strong> (EASL 2018)&nbsp;: num&eacute;ration (polynucl&eacute;aires neutrophiles &ge; 250/mm&sup3; = infection du liquide d&rsquo;ascite), protides, ensemencement dans des flacons d&rsquo;h&eacute;moculture au lit du malade</li>\n<li><strong>Rechercher un facteur pr&eacute;cipitant</strong>&nbsp;: h&eacute;patite alcoolique, h&eacute;patite virale aigu&euml; (VHE, VHA, VHB) ou r&eacute;activation du VHB, h&eacute;patite auto-immune, m&eacute;dicament h&eacute;patotoxique, infection bact&eacute;rienne, chirurgie r&eacute;cente</li>\n<li><strong>Imagerie en coupes avec injection</strong>&nbsp;: carcinome h&eacute;patocellulaire et thrombose porte, tous deux facteurs majeurs de d&eacute;compensation</li>\n<li>Biologie&nbsp;: fonction r&eacute;nale, ionogramme, bilan h&eacute;patique complet, calcul du Child-Pugh et du MELD</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Traiter l'ascite</p>\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Posologies &mdash; EASL 2018</p><ul>\n<li>Restriction sod&eacute;e mod&eacute;r&eacute;e (environ 5 g de sel par jour)&nbsp;; pas de restriction hydrique sauf natr&eacute;mie &lt; 125 mmol/L</li>\n<li><strong>Spironolactone</strong> 100 mg/j, augmentation par paliers de 100 mg tous les 72 h jusqu&rsquo;&agrave; 400 mg/j</li>\n<li>&plusmn; <strong>furos&eacute;mide</strong> 40 mg/j, augmentation par paliers de 40 mg jusqu&rsquo;&agrave; 160 mg/j</li>\n<li>Ascite tendue&nbsp;: <strong>ponction &eacute;vacuatrice</strong> avec <strong>albumine 8 g par litre d&rsquo;ascite retir&eacute;e</strong> au-del&agrave; de 5 litres</li>\n<li>Surveillance&nbsp;: poids (perte cible 0,5 kg/j sans &oelig;d&egrave;mes, 1 kg/j avec &oelig;d&egrave;mes), pression art&eacute;rielle, cr&eacute;atinine, natr&eacute;mie, kali&eacute;mie</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Ce qui change d&egrave;s la premi&egrave;re d&eacute;compensation</p>\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Priorit&eacute;s</p><ol>\n<li><strong>Traitement &eacute;tiologique</strong>&nbsp;: c&rsquo;est la mesure la plus efficace pour pr&eacute;venir une d&eacute;compensation ult&eacute;rieure &mdash; abstinence alcoolique, traitement antiviral, contr&ocirc;le m&eacute;tabolique</li>\n<li><strong>&Eacute;valuer la candidature &agrave; la transplantation h&eacute;patique</strong>, d&egrave;s ce stade</li>\n</ol></div>\n<ul>\n<li><strong>Carv&eacute;dilol ou b&ecirc;tabloquant non s&eacute;lectif si varices</strong>&nbsp;: pr&eacute;vention de la premi&egrave;re h&eacute;morragie et r&eacute;duction des complications li&eacute;es &agrave; l&rsquo;ascite, carv&eacute;dilol pr&eacute;f&eacute;r&eacute;. Si in&eacute;ligible&nbsp;: traitement endoscopique seul.<br>R&eacute;duire ou arr&ecirc;ter si pression art&eacute;rielle systolique &lt; 90 mmHg ou moyenne &lt; 65 mmHg persistantes, ou syndrome h&eacute;pator&eacute;nal&nbsp;; <strong>reprendre apr&egrave;s r&eacute;solution</strong>.</li>\n<li><strong>Pas d&rsquo;antibioprophylaxie primaire au long cours</strong> pour pr&eacute;venir une d&eacute;compensation ult&eacute;rieure</li>\n<li><strong>Statines</strong>&nbsp;: ne pas les introduire dans le seul but de pr&eacute;venir la d&eacute;compensation, mais les <strong>poursuivre</strong> si indication valid&eacute;e, en tenant compte du sur-risque de toxicit&eacute; chez le Child-Pugh C</li>\n<li><strong>&Eacute;valuation nutritionnelle structur&eacute;e pour tous</strong>&nbsp;: plan nutritionnel individualis&eacute; et conseils d&rsquo;activit&eacute; physique r&eacute;guli&egrave;re&nbsp;; d&eacute;pistage de la fragilit&eacute;, de la d&eacute;nutrition, de la sarcop&eacute;nie et de la myost&eacute;atose avec des outils standardis&eacute;s, et interventions cibl&eacute;es si pr&eacute;sentes</li>\n<li><strong>Soins dentaires et parodontaux r&eacute;guliers</strong>&nbsp;: la maladie parodontale est associ&eacute;e &agrave; un sur-risque de d&eacute;compensation&nbsp;; vaccinations &agrave; jour</li>\n<li><strong>Diab&egrave;te et surpoids</strong>&nbsp;: comorbidit&eacute;s fr&eacute;quentes qui aggravent le pronostic et doivent &ecirc;tre prises en charge</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Savoir reconna&icirc;tre l'aggravation</p>\n<p>Apr&egrave;s une ascite inaugurale, on parle de <strong>d&eacute;compensation ult&eacute;rieure</strong> devant&nbsp;:</p>\n<ul>\n<li><strong>&ge; 3 ponctions &eacute;vacuatrices en 1 an</strong>, ou</li>\n<li>la survenue d&rsquo;une <strong>infection du liquide d&rsquo;ascite</strong>, ou d&rsquo;un <strong>syndrome h&eacute;pator&eacute;nal avec insuffisance r&eacute;nale aigu&euml;</strong>, ou</li>\n<li>un <strong>deuxi&egrave;me &eacute;v&eacute;nement de d&eacute;compensation</strong>&nbsp;: h&eacute;morragie li&eacute;e &agrave; l&rsquo;hypertension portale, enc&eacute;phalopathie patente, ou ict&egrave;re</li>\n</ul>\n<p>Ce stade correspond &agrave; une mortalit&eacute; plus &eacute;lev&eacute;e et impose l&rsquo;&eacute;valuation pour transplantation et la poursuite du contr&ocirc;le &eacute;tiologique.</p>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">6. L'objectif &agrave; moyen terme : la recompensation</p>\n<p>Elle exige la r&eacute;union de <strong>tous</strong> les crit&egrave;res suivants&nbsp;:</p>\n<ol>\n<li>suppression, contr&ocirc;le ou &eacute;radication de l&rsquo;&eacute;tiologie (abstinence durable, ADN du VHB supprim&eacute;, r&eacute;ponse virologique soutenue pour le VHC)</li>\n<li>disparition de l&rsquo;ascite en imagerie <strong>sans diur&eacute;tique</strong>, et absence d&rsquo;enc&eacute;phalopathie <strong>sans lactulose, rifaximine ni LOLA</strong></li>\n<li>absence de r&eacute;cidive h&eacute;morragique apr&egrave;s une h&eacute;morragie variqueuse, que le b&ecirc;tabloquant soit poursuivi ou non</li>\n<li>crit&egrave;res 1 &agrave; 3 remplis pendant <strong>plus de 6 mois cons&eacute;cutifs</strong></li>\n<li>am&eacute;lioration de la fonction h&eacute;patique au niveau <strong>Child-Pugh A5&ndash;A6</strong></li>\n</ol>\n<p>Le sevrage des diur&eacute;tiques se discute une fois l&rsquo;&eacute;tiologie contr&ocirc;l&eacute;e, l&rsquo;ascite r&eacute;solue et la fonction de synth&egrave;se revenue aux crit&egrave;res biologiques de Child-Pugh A. Un patient recompens&eacute; reste suivi par un h&eacute;patologue <strong>tous les 6 mois</strong> et poursuit le d&eacute;pistage du carcinome h&eacute;patocellulaire.</p><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche6","tags": ["Baveno VIII","hypertension portale"],"titre": "Première décompensation œdémato-ascitique","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Reconna&icirc;tre le stade, discuter TIPS et transplantation ensemble, et conna&icirc;tre les alternatives quand le TIPS n&rsquo;est pas possible.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Reconna&icirc;tre</p>\n<ul>\n<li><strong>Ascite r&eacute;fractaire</strong> (EASL 2018)&nbsp;: ascite non contr&ocirc;l&eacute;e par un r&eacute;gime pauvre en sel et des doses maximales de diur&eacute;tiques (spironolactone 400 mg/j + furos&eacute;mide 160 mg/j), ou r&eacute;cidivant rapidement apr&egrave;s ponction, ou impossibilit&eacute; d&rsquo;utiliser les diur&eacute;tiques &agrave; dose efficace du fait de leurs complications</li>\n<li><strong>Ascite r&eacute;cidivante</strong> (EASL 2018)&nbsp;: au moins 3 r&eacute;cidives en 1 an malgr&eacute; un traitement bien conduit</li>\n<li>Pour Baveno VIII, le recours &agrave; <strong>&ge; 3 ponctions &eacute;vacuatrices en 1 an</strong> signe une <strong>d&eacute;compensation ult&eacute;rieure</strong>, stade de pronostic nettement plus s&eacute;v&egrave;re</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. R&eacute;flexes imm&eacute;diats</p>\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">&Agrave; faire d'embl&eacute;e</p><ul>\n<li><strong>&Eacute;valuer la candidature &agrave; la transplantation h&eacute;patique</strong></li>\n<li><strong>Discuter le TIPS et la transplantation dans la m&ecirc;me d&eacute;marche</strong>, pas l&rsquo;un apr&egrave;s l&rsquo;&eacute;chec de l&rsquo;autre</li>\n<li><strong>Poursuivre ou obtenir le contr&ocirc;le de l&rsquo;&eacute;tiologie</strong>&nbsp;: il am&eacute;liore la survie m&ecirc;me &agrave; ce stade</li>\n</ul></div>\n<ul>\n<li><strong>R&eacute;&eacute;valuer les b&ecirc;tabloquants</strong>&nbsp;: r&eacute;duire ou arr&ecirc;ter si pression art&eacute;rielle systolique &lt; 90 mmHg ou moyenne &lt; 65 mmHg persistantes, ou syndrome h&eacute;pator&eacute;nal&nbsp;; reprise possible apr&egrave;s am&eacute;lioration</li>\n<li><strong>Arr&ecirc;ter les inhibiteurs de la pompe &agrave; protons</strong> en l&rsquo;absence d&rsquo;indication claire</li>\n<li>Rechercher syst&eacute;matiquement une <strong>infection du liquide d&rsquo;ascite</strong> &agrave; chaque ponction, une thrombose porte et un carcinome h&eacute;patocellulaire</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. TIPS : le traitement de r&eacute;f&eacute;rence</p>\n<ul>\n<li><strong>Tout patient</strong> avec ascite r&eacute;cidivante ou r&eacute;fractaire doit &ecirc;tre consid&eacute;r&eacute; pour un TIPS</li>\n<li><strong>Hydrothorax h&eacute;patique r&eacute;fractaire</strong> au traitement m&eacute;dical&nbsp;: m&ecirc;me logique</li>\n<li><strong>&Acirc;ge &ge; 70 ans</strong>&nbsp;: possible au cas par cas, selon le rapport b&eacute;n&eacute;fice/risque</li>\n<li><strong>Bilan indispensable&nbsp;: fonction r&eacute;nale &eacute;valu&eacute;e syst&eacute;matiquement, avec stadification de la maladie r&eacute;nale chronique</strong> (d&eacute;bit de filtration glom&eacute;rulaire)&nbsp;; recherche d&rsquo;ant&eacute;c&eacute;dents d&rsquo;enc&eacute;phalopathie</li>\n<li><strong>Modalit&eacute;s</strong>&nbsp;: dilater au plus petit diam&egrave;tre permettant une r&eacute;ponse satisfaisante, pour limiter le sur-shuntage (enc&eacute;phalopathie, insuffisance cardiaque)&nbsp;; <strong>dilatation par paliers</strong> si l&rsquo;ascite ne s&rsquo;am&eacute;liore pas&nbsp;; <strong>rifaximine</strong> en prophylaxie de l&rsquo;enc&eacute;phalopathie</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Si le TIPS n'est pas possible</p>\n<ul>\n<li><strong>Albumine au long cours</strong>&nbsp;: peut am&eacute;liorer le contr&ocirc;le de l&rsquo;ascite et r&eacute;duire l&rsquo;incidence des complications li&eacute;es &agrave; l&rsquo;ascite</li>\n<li><strong>Drainage &agrave; domicile</strong>&nbsp;: cath&eacute;ter p&eacute;riton&eacute;al tunnellis&eacute; ou pompe &agrave; ascite &agrave; bas d&eacute;bit, alternative aux ponctions &eacute;vacuatrices it&eacute;ratives chez les patients contre-indiqu&eacute;s au TIPS ou non r&eacute;pondeurs, et non candidats &agrave; la transplantation</li>\n<li>&Agrave; d&eacute;faut&nbsp;: ponctions &eacute;vacuatrices it&eacute;ratives avec compensation par albumine</li>\n</ul>\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Posologies &mdash; EASL 2018 / essai ANSWER</p><ul>\n<li><strong>Ponction &eacute;vacuatrice</strong>&nbsp;: albumine <strong>8 g par litre d&rsquo;ascite retir&eacute;e</strong> d&egrave;s lors que le volume d&eacute;passe 5 litres</li>\n<li><strong>Albumine au long cours</strong> (sch&eacute;ma ANSWER)&nbsp;: 40 g deux fois par semaine pendant 2 semaines, puis 40 g par semaine</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Surveillance</p>\n<ul>\n<li>Poids, pression art&eacute;rielle, cr&eacute;atinine et ionogramme rapproch&eacute;s</li>\n<li>Recherche d&rsquo;infection du liquide d&rsquo;ascite &agrave; chaque ponction</li>\n<li>R&eacute;&eacute;valuation r&eacute;guli&egrave;re de la candidature &agrave; la transplantation et du projet th&eacute;rapeutique</li>\n</ul>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Pi&egrave;ges</p><ul>\n<li>La disparition de l&rsquo;ascite <strong>sous diur&eacute;tiques</strong> ne d&eacute;finit pas une recompensation&nbsp;; apr&egrave;s TIPS non plus, isol&eacute;ment</li>\n<li>Ne pas attendre l&rsquo;&eacute;chec du TIPS pour aborder la transplantation&nbsp;: les deux se discutent ensemble</li>\n<li>La sarcop&eacute;nie et la fragilit&eacute; ne contre-indiquent pas le TIPS, mais elles p&egrave;sent sur le pronostic et doivent &ecirc;tre &eacute;valu&eacute;es et prises en charge</li>\n</ul></div><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche7","tags": ["Baveno VIII","hypertension portale"],"titre": "Ascite récidivante et réfractaire","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Épisode aigu, facteurs d&eacute;clenchants, traitement, formes r&eacute;cidivantes et rapports avec le TIPS.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. D&eacute;finir</p>\n<ul>\n<li>Seule l&rsquo;<strong>enc&eacute;phalopathie patente (West Haven &ge; II)</strong> constitue un &eacute;v&eacute;nement de d&eacute;compensation</li>\n<li>L&rsquo;enc&eacute;phalopathie minime ou couverte <strong>n&rsquo;est pas</strong> une d&eacute;compensation</li>\n<li>Une enc&eacute;phalopathie <strong>r&eacute;cidivante</strong> malgr&eacute; un traitement bien conduit, ou survenant en association &agrave; un autre &eacute;v&eacute;nement, d&eacute;finit une <strong>d&eacute;compensation ult&eacute;rieure</strong></li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Devant un &eacute;pisode aigu</p>\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Premi&egrave;re &eacute;tape : le facteur d&eacute;clenchant</p><p>Rechercher et traiter&nbsp;: <strong>infection</strong> (ponction d&rsquo;ascite, h&eacute;mocultures, ECBU, radiographie de thorax), <strong>h&eacute;morragie digestive</strong>, <strong>insuffisance r&eacute;nale</strong>, troubles ioniques (hyponatr&eacute;mie, hypokali&eacute;mie), constipation, <strong>m&eacute;dicaments s&eacute;datifs</strong>, &eacute;carts de r&eacute;gime, et <strong>shunt porto-syst&eacute;mique spontan&eacute; ou TIPS</strong>.</p></div>\n<ul>\n<li><strong>En contexte h&eacute;morragique</strong>&nbsp;: lactulose par voie orale ou en lavements, pour pr&eacute;venir ou traiter l&rsquo;enc&eacute;phalopathie en acc&eacute;l&eacute;rant l&rsquo;&eacute;limination digestive du sang</li>\n<li>&Eacute;liminer une cause non h&eacute;patique (usage courant)&nbsp;: imagerie c&eacute;r&eacute;brale si pr&eacute;sentation atypique, signe de localisation, traumatisme, ou absence de facteur d&eacute;clenchant identifi&eacute;</li>\n<li>Rechercher un <strong>gros shunt porto-syst&eacute;mique</strong> sur l&rsquo;imagerie en coupes, en particulier si la fonction h&eacute;patique est conserv&eacute;e</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Traitement m&eacute;dical</p>\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Posologies &mdash; EASL 2018 / usage courant</p><ul>\n<li><strong>Lactulose</strong>&nbsp;: 25 mL &times; 2/j par voie orale, ajust&eacute; pour obtenir <strong>2 &agrave; 3 selles molles par jour</strong>&nbsp;; lavements si troubles de conscience ou voie orale impossible</li>\n<li><strong>Rifaximine</strong>&nbsp;: 550 mg &times; 2/j (ou 400 mg &times; 3/j), en association au lactulose, pour la pr&eacute;vention des r&eacute;cidives</li>\n<li>Apports protidiques maintenus (1,2&ndash;1,5 g/kg/j)&nbsp;: <strong>ne pas restreindre les prot&eacute;ines</strong></li>\n</ul></div>\n<ul>\n<li><strong>LOLA (L-ornithine-L-aspartate)</strong>&nbsp;: peut &ecirc;tre envisag&eacute; en cas d&rsquo;enc&eacute;phalopathie r&eacute;cidivante ou persistante</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Enc&eacute;phalopathie r&eacute;cidivante ou persistante malgr&eacute; un traitement optimal</p>\n<ul>\n<li><strong>Rechercher et emboliser les gros shunts porto-syst&eacute;miques</strong>, en particulier lorsque la fonction h&eacute;patique est pr&eacute;serv&eacute;e</li>\n<li><strong>&Eacute;valuer la candidature &agrave; la transplantation h&eacute;patique</strong></li>\n<li>Poursuivre le contr&ocirc;le de l&rsquo;&eacute;tiologie, qui am&eacute;liore la survie</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Enc&eacute;phalopathie et TIPS</p>\n<table>\n<tr><th>Moment</th><th>Conduite</th></tr>\n<tr><td><strong>Avant un TIPS &eacute;lectif</strong></td><td>Rechercher soigneusement un ant&eacute;c&eacute;dent d&rsquo;enc&eacute;phalopathie patente et les traitements sp&eacute;cifiques en cours</td></tr>\n<tr><td><strong>Ant&eacute;c&eacute;dent d&rsquo;enc&eacute;phalopathie</strong></td><td>Ce n&rsquo;est <strong>pas</strong> une contre-indication absolue</td></tr>\n<tr><td><strong>Pr&eacute;vention</strong></td><td><strong>Rifaximine</strong> chez les candidats à un TIPS électif</td></tr>\n<tr><td><strong>Apr&egrave;s TIPS</strong></td><td>Embolisation d&rsquo;un shunt spontan&eacute; et/ou r&eacute;duction voire occlusion du TIPS</td></tr>\n<tr><td><strong>R&eacute;fractaire</strong></td><td><strong>Priorisation pour la transplantation h&eacute;patique</strong></td></tr>\n</table>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">6. Arr&ecirc;ter le traitement ?</p>\n<p>L&rsquo;absence d&rsquo;enc&eacute;phalopathie sous lactulose, rifaximine ou LOLA ne vaut pas recompensation. L&rsquo;arr&ecirc;t se discute une fois l&rsquo;&eacute;tiologie contr&ocirc;l&eacute;e, l&rsquo;enc&eacute;phalopathie r&eacute;solue et la fonction h&eacute;patique revenue au niveau Child-Pugh A.</p><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026. Les posologies proviennent des recommandations EASL 2018 ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche8","tags": ["Baveno VIII","hypertension portale"],"titre": "Encéphalopathie hépatique","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px; font-style:italic; color:#6E6A5D\">Diagnostic d’élimination, traitement par terlipressine et albumine, surveillance et orientation.</p><p style=\"margin:20px 0 10px; color:#1F5C3F; font-weight:bold; border-bottom:1px solid #DAD5C8; padding-bottom:4px\">1. Y penser</p>\n<p>Contexte typique&nbsp;: cirrhose décompensée, souvent avec ascite réfractaire, après une infection, une ponction évacuatrice sans compensation par albumine, une hémorragie digestive, ou une diurèse excessive.</p>\n\n<p style=\"margin:20px 0 10px; color:#1F5C3F; font-weight:bold; border-bottom:1px solid #DAD5C8; padding-bottom:4px\">2. Poser le diagnostic</p>\n<div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:12px 16px; margin:14px 0\"><p style=\"margin:0 0 8px; color:#24507C; font-weight:bold\">Critères — EASL 2018 / Club International de l'Ascite</p><ul>\n<li>Cirrhose avec ascite</li>\n<li><strong>Insuffisance rénale aiguë</strong>&nbsp;: créatinine ≥ 0,3 mg/dL (≥ 26,5 µmol/L) en 48 h, ou ≥ 50 % en 7 jours</li>\n<li><strong>Absence d’amélioration</strong> après 48 h d’arrêt des diurétiques et d’albumine 1 g/kg/j (max 100 g/j)</li>\n<li>Absence de choc, de néphrotoxique récent, de néphropathie organique</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px; color:#1F5C3F; font-weight:bold; border-bottom:1px solid #DAD5C8; padding-bottom:4px\">3. Traitement</p>\n<div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:12px 16px; margin:14px 0\"><p style=\"margin:0 0 8px; color:#1F5C3F; font-weight:bold\">Traitement de référence</p><p><strong>Terlipressine + albumine</strong>, terlipressine de préférence en perfusion continue.</p></div>\n<div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:12px 16px; margin:14px 0\"><p style=\"margin:0 0 8px; color:#24507C; font-weight:bold\">Posologies — EASL 2018</p><ul>\n<li><strong>Terlipressine</strong>&nbsp;: perfusion continue 2–3 mg/24 h, jusqu’à 12 mg/24 h (alternative bolus : 1 mg/4–6 h)</li>\n<li><strong>Albumine</strong>&nbsp;: 1 g/kg à J1 (max 100 g), puis 20 à 40 g/j</li>\n<li><strong>Noradrénaline</strong> si terlipressine indisponible : 0,5 à 3 mg/h en continu, en soins intensifs</li>\n<li>Durée&nbsp;: jusqu’à réponse complète, maximum 14 jours</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px; color:#1F5C3F; font-weight:bold; border-bottom:1px solid #DAD5C8; padding-bottom:4px\">4. Surveillance</p>\n<ul>\n<li>Créatinine et diurèse quotidiennes ; pression artérielle moyenne</li>\n<li><strong>Effets indésirables de la terlipressine</strong>&nbsp;: ischémie, surcharge volémique, hyponatrémie, bradycardie</li>\n<li>Arrêt en l’absence de réponse après 14 jours</li>\n</ul>\n\n<p style=\"margin:20px 0 10px; color:#1F5C3F; font-weight:bold; border-bottom:1px solid #DAD5C8; padding-bottom:4px\">5. Après l'épisode</p>\n<ul>\n<li><strong>Discuter la transplantation hépatique sans délai</strong></li>\n<li><strong>Réintroduire le bétabloquant</strong> une fois résolu</li>\n<li>Prévenir les récidives&nbsp;: antibioprophylaxie secondaire, discussion du TIPS, compensation systématique des ponctions par albumine</li>\n</ul><p style=\"margin:20px 0 0; color:#6E6A5D\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026. Les posologies proviennent des recommandations EASL 2018 ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche9","tags": ["Baveno VIII","SHR","IRA"],"titre": "Syndrome hépatorénal avec insuffisance rénale aiguë","urgent": false},{"categorie": "Général","contenu": "<p style=\"margin:0 0 6px\"><b>Etiologies, diagnostic différentiel, bilan étiologique, traitement</b></p><p style=\"margin:0 0 10px\"><i>Synthèse pratique, particulièrement pertinente en gastro-entérologie où le tube digestif est la source la plus fréquente de carence martiale inexpliquée chez l'adulte.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Définitions et physiopathologie</p><p style=\"margin:0 0 8px\">La carence martiale correspond à un <b>épuisement des réserves de fer de l'organisme</b>, pouvant exister <b>avec ou sans anémie</b> associée (carence martiale « latente » lorsque l'hémoglobine reste normale).</p><p style=\"margin:0\">Le fer est indispensable à l'érythropoïèse ; sa carence retentit d'abord sur les réserves (ferritine), puis sur le fer circulant (coefficient de saturation de la transferrine), avant de se traduire par une anémie microcytaire arégénérative.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Étiologies</p><table><thead><tr><th>Mécanisme</th><th>Causes principales</th></tr></thead><tbody><tr><td><b>Pertes sanguines chroniques</b><br>(cause la plus fréquente chez l'adulte)</td><td>Digestives : ulcère gastroduodénal, cancer colorectal ou gastrique, angiodysplasies, MICI, œsophagite, prise d'AINS ou d'anticoagulants, parasitoses (ankylostomiase) ; gynécologiques : ménorragies, fibromes ; urinaires : hématurie chronique ; dons du sang répétés</td></tr><tr><td><b>Malabsorption digestive</b></td><td>Maladie cœliaque, gastrectomie ou chirurgie bariatrique (bypass), infection à <i>Helicobacter pylori</i> (gastrite atrophique), achlorhydrie ou traitement au long cours par IPP, maladie de Crohn duodéno-jéjunale</td></tr><tr><td><b>Carence d'apport</b></td><td>Régime pauvre en fer (végétalisme strict non supplémenté), dénutrition, petite enfance et adolescence (besoins accrus mal couverts)</td></tr><tr><td><b>Besoins accrus</b></td><td>Grossesse (surtout 2e et 3e trimestres), croissance, sport de haut niveau (élévation de l'hepcidine réduisant l'absorption intestinale)</td></tr></tbody></table></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">3. Diagnostic positif et différentiel</p><ul class=\"bullet-list\"><li><b>Ferritine basse</b> : signe le plus spécifique de carence martiale.</li><li><b>Coefficient de saturation de la transferrine (CST) bas</b> : utile en complément, notamment si la ferritine est ininterprétable.</li><li><b>Piège</b> : la ferritine est une protéine de l'inflammation, pouvant rester faussement normale ou élevée en cas de syndrome inflammatoire associé (MICI en poussée, par exemple) malgré une authentique carence martiale — le <b>récepteur soluble de la transferrine</b> (peu modifié par l'inflammation) peut alors aider à trancher.</li></ul><p style=\"margin:8px 0 0\"><b>Diagnostics différentiels de la microcytose</b> : thalassémie mineure (ferritine normale ou élevée, électrophorèse de l'hémoglobine), anémie inflammatoire évoluée, anémie sidéroblastique (rare).</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">4. Bilan étiologique</p><p style=\"margin:0 0 8px\"><b>Interrogatoire</b> : règles (abondance, durée), régime alimentaire, saignements digestifs visibles, prise d'AINS, d'anticoagulants ou d'IPP au long cours, antécédents de chirurgie digestive.</p><ul class=\"bullet-list\"><li><b>Chez l'homme et la femme ménopausée</b> : l'exploration digestive est <b>systématique</b> (endoscopie haute et coloscopie), même en l'absence de symptôme digestif, en raison du risque de néoplasie digestive occulte.</li><li><b>Chez la femme non ménopausée</b> : rechercher en premier lieu <b>une cause gynécologique</b> ; explorer le tube digestif en l'absence de cause gynécologique évidente, devant un signe d'alarme digestif, ou si la carence est sévère, récidivante ou résistante à la supplémentation.</li><li><b>Sérologie de la maladie cœliaque</b> (anticorps anti-transglutaminase IgA + dosage des IgA totales) : à réaliser systématiquement devant une carence martiale inexpliquée.</li><li><b>Recherche d'<i>Helicobacter pylori</i></b> lors de l'endoscopie haute (biopsies).</li><li><b>Si le bilan digestif haut et bas est négatif</b> et la carence persiste ou récidive : exploration de l'intestin grêle par <b>vidéocapsule endoscopique</b>, à la recherche d'angiodysplasies, d'une tumeur grêlique ou d'une maladie de Crohn du grêle.</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">5. Traitement</p><p style=\"margin:6px 0 4px\"><b>Supplémentation orale (fer ferreux)</b></p><ul class=\"bullet-list\"><li>Traitement de première intention en l'absence de contre-indication ou d'inefficacité.</li><li>Posologie usuelle : <b>100 à 200 mg </b>de fer élément par jour.</li><li>La tolérance digestive <font color=\"#1cba26\"><b>(nausées, constipation, selles noires)</b></font> limite souvent l'observance ; un schéma à <b>jours alternés</b> peut améliorer l'absorption relative (par régulation de l'hepcidine) tout en étant mieux toléré.</li><li><b>Durée</b> : à poursuivre <b>3 à 6 mois</b> après normalisation de l'hémoglobine, pour reconstituer les réserves (ferritine).</li></ul><p style=\"margin:8px 0 4px\"><b>Fer intraveineux (carboxymaltose ferrique, fer sucrose…)</b></p><p style=\"margin:0 0 4px\"><u>Indications :</u></p><ul class=\"bullet-list\"><li>Intolérance ou inefficacité du fer oral</li><li>Malabsorption digestive documentée</li><li><b>MICI en poussée</b> : le fer oral est souvent mal toléré et peut aggraver l'inflammation intestinale — le fer IV est alors préféré</li><li>Nécessité d'une correction rapide (anémie sévère, préopératoire, grossesse avancée)</li><li>Pertes sanguines chroniques dépassant la capacité d'absorption orale</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">6. Surveillance</p><ul class=\"bullet-list\"><li><b>NFS de contrôle</b> à 4-6 semaines : une augmentation de l'hémoglobine d'au moins 1 à 2 g/dl est attendue.</li><li><b>Ferritine</b> à distance pour confirmer la reconstitution des réserves avant d'envisager l'arrêt du traitement.</li><li>En l'absence de réponse : rechercher une malabsorption méconnue, une mauvaise observance, ou des pertes persistantes non contrôlées.</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : HAS, recommandations sur la carence en fer ; ECCO, prise en charge de la carence martiale et de l'anémie dans les MICI ; recommandations générales d'hématologie sur le bilan étiologique de la carence martiale. À adapter au contexte clinique individuel.</i></p>","id": "carence-martiale","tags": ["carence martiale","fer","anémie ferriprive","ferritine","bilan étiologique"],"titre": "Carence martiale","urgent": false},{"categorie": "MICI","contenu": "<p style=\"margin:0 0 6px\"><b>Colite aigue grave&nbsp;</b></p><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 8px; color:#A94430; font-weight:bold\">Urgence diagnostique et thérapeutique</p><p style=\"margin:0\">La colite aiguë grave est une <b>urgence médico-chirurgicale</b> engageant le pronostic vital (risque de colectasie, perforation, choc septique). Elle impose une <b>hospitalisation systématique</b>, une prise en charge <b>multidisciplinaire précoce</b> (gastroentérologue + chirurgien digestif dès l'admission) et une réévaluation quotidienne stricte.</p></div><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Définir la gravité : critères de Truelove &amp; Witts</p><p style=\"margin:0 0 8px\">Score historique (1955) toujours utilisé en pratique et par l'ECCO pour définir la <b>colite aiguë grave</b>, reposant sur la fréquence des selles et un critère systémique.</p><table><thead><tr><th></th><th>Légère</th><th>Modérée</th><th><b>Grave</b></th></tr></thead><tbody><tr><td><b>Selles glairo-sanglantes/jour</b></td><td>&lt; 4</td><td>4–6</td><td><b>≥ 6</b></td></tr><tr><td><b>Pouls</b></td><td>Normal</td><td>≤ 90/min</td><td><b>&gt; 90/min</b></td></tr><tr><td><b>Température</b></td><td>Normale</td><td>≤ 37,8°C</td><td><b>&gt; 37,8°C</b></td></tr><tr><td><b>Hémoglobine</b></td><td>Normale</td><td>≥ 10,5 g/dL</td><td><b>&lt; 10,5 g/dL</b></td></tr><tr><td><b>VS (ou CRP)</b></td><td>&lt; 20 mm/h</td><td>≤ 30 mm/h</td><td><b>&gt; 30 mm/h</b></td></tr></tbody></table><p style=\"margin:10px 0 0\"><b>Colite grave = ≥ 6 selles glairo-sanglantes/jour ET au moins un critère systémique</b> (pouls &gt; 90/min, température &gt; 37,8°C, hémoglobine &lt; 10,5 g/dL, ou VS &gt; 30 mm/h — la CRP &gt; 30 mg/L est utilisée en pratique courante comme équivalent moderne de la VS).</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">2. Surveillance quotidienne : score de Lichtiger (Modified Truelove-Witts Severity Index)</p><p style=\"margin:0 0 8px\">Score plus fin que Truelove-Witts, utilisé au <b>quotidien pendant l'hospitalisation</b> pour suivre l'évolution sous traitement (non pour le diagnostic initial). Il combine 8 items cotés de 0 à 3 (0 à 21 points) :</p><ul class=\"bullet-list\"><li>Fréquence des selles diurnes</li><li>Fréquence des selles nocturnes</li><li>Visibilité du sang dans les selles (proportion des selles sanglantes)</li><li>Incontinence fécale</li><li>Douleurs abdominales</li><li>Bien-être général du patient</li><li>Sensibilité abdominale à la palpation</li><li>Nécessité d'un traitement antidiarrhéique</li></ul><p style=\"margin:8px 0 0\"><b>Score &lt; 10</b> : rémission clinique. Un score qui ne diminue pas ou qui remonte sous corticoïdes IV bien conduits oriente vers une <b>corticorésistance</b> et la nécessité d'un traitement de 2e ligne.</p></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">3. Critères de Lindgren (Oxford) au 3e jour : prédire l'échec de la corticothérapie</p><p style=\"margin:0 0 8px\">À réévaluer systématiquement à <b>J3</b> de corticothérapie IV bien conduite (travaux d'Oxford — Travis et al. — repris et validés par le GETAID) :</p><div style=\"background:#FFFFFF; border:1px solid #9B3355; border-radius:6px; padding:10px 14px 12px; margin:10px 0\"><p style=\"margin:0 0 8px; color:#9B3355; font-weight:bold\">À J3, si :</p><ul class=\"bullet-list\"><li><b>&gt; 8 selles/jour</b>, <u>OU</u></li><li><b>3 à 8 selles/jour ET CRP &gt; 45 mg/L</b></li></ul><p style=\"margin:8px 0 0\">→ <b>probabilité de colectomie ≈ 85 %</b> en l'absence d'intensification thérapeutique : c'est le signal pour <b>décider sans délai</b> un traitement de rescue (2e ligne) plutôt que de prolonger la corticothérapie seule.</p></div><p style=\"margin:8px 0 0\">À l'inverse, une réponse satisfaisante à J3 (amélioration nette de la fréquence des selles et de la CRP) autorise la poursuite des corticoïdes IV, avec relais oral habituellement après 3 à 5 jours de bonne réponse.</p></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">4. Bilan initial systématique</p><ul class=\"bullet-list\"><li><b>Biologie</b> : NFS, CRP, ionogramme, créatinine, albuminémie, bilan hépatique, hémostase, groupe sanguin-RAI</li><li><b>Éliminer une cause infectieuse surajoutée</b> (obligatoire avant tout traitement immunosuppresseur) : coproculture, recherche de toxine <i>C. difficile</i>, examen parasitologique des selles</li><li><b>Recherche d'une colite à CMV</b> : biopsies coliques avec immunohistochimie (± PCR CMV sanguine), en particulier en cas de corticorésistance</li><li><b>Rectosigmoïdoscopie souple sans préparation</b> (à privilégier à la coloscopie totale, dont le risque de perforation est majoré en phase aiguë) : évalue la sévérité endoscopique, permet les biopsies (CMV, élimine un diagnostic différentiel)<img src=\"3b52ef7f7b969811bc03c8f5c79bfdf8.png\">&nbsp;<i>ulcérations en puit&nbsp;</i></li><li><b>Scanner abdomino-pelvien</b> si doute sur une complication (perforation, colectasie, abcès)</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">5. Traitement de première ligne : corticothérapie IV</p><div style=\"background:#FFFFFF; border:1px solid #9C5A16; border-radius:6px; padding:10px 14px 12px; margin:10px 0\"><p style=\"margin:0 0 8px; color:#9C5A16; font-weight:bold\">Posologies — ECCO</p><ul class=\"bullet-list\"><li><b>Méthylprednisolone</b> <u>60 mg/jour IV</u> (en 1 injection ou fractionné), <u>ou</u></li><li><b>Hydrocortisone</b> 100 mg × 4/jour IV (400 mg/jour)</li><li>Pas de bénéfice démontré à dépasser ces doses (« high dose » inutile, majore seulement les effets indésirables)</li></ul></div><p style=\"margin:0 0 8px\">Mesures associées systématiques dès l'admission :</p><ul class=\"bullet-list\"><li><b>Thromboprophylaxie par HBPM</b> systématique, y compris en présence de rectorragies (le risque thromboembolique de la colite aiguë grave dépasse le risque hémorragique)</li><li><b>Arrêt des anticholinergiques, antidiarrhéiques (lopéramide), opioïdes et AINS</b> : risque de précipiter une colectasie</li><li>Correction des troubles hydroélectrolytiques, transfusion si besoin (seuil habituel Hb &lt; 8–9 g/dL selon le contexte)</li><li>Support nutritionnel ; pas de bénéfice démontré à la mise au jeûne systématique</li><li><b>Pas d'antibiothérapie systématique</b> en l'absence de signe de sepsis ou de complication (colectasie, perforation)</li></ul><div><img src=\"9bd7ad5ef3c25d031db779d8ddf231dc.png\"><br></div></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">6. Corticorésistance à J3 : traitement de 2e ligne (rescue therapy)</p><p style=\"margin:0 0 8px\">En cas de critères de Lindgren/Oxford positifs à J3 (ou de score de Lichtiger ne s'améliorant pas) : décision <b>sans délai</b>, en concertation avec le chirurgien, entre deux options d'efficacité comparable (recommandation ECCO, données GETAID) :</p><table><thead><tr><th>Molécule</th><th>Schéma</th><th>Remarques</th></tr></thead><tbody><tr><td><b>INFLIXIMAB</b></td><td>5 mg/kg en dose unique (schéma accéléré possible avec 2e dose à J3–J7 si réponse insuffisante)</td><td>Préféré si le patient est naïf d'anti-TNF ; permet une poursuite en traitement d'entretien</td></tr><tr><td><b>CICLOSPORINE</b></td><td>2 mg/kg/jour IV en continu (adaptation sur la ciclosporinémie)</td><td>Nécessite une surveillance rapprochée (fonction rénale, magnésémie, pression artérielle, cholestérolémie avant introduction — risque convulsif si hypocholestérolémie)</td></tr></tbody></table><p style=\"margin:10px 0 0\"><b>La combothérapie (association d'emblée des deux)</b> n'est pas recommandée en routine, du fait du surrisque infectieux, sauf situations exceptionnelles discutées en centre expert.</p><p style=\"margin:8px 0 0\">Une <b>nouvelle réévaluation à J4–J7</b> sous traitement de 2e ligne est impérative : en l'absence de réponse, la <b>colectomie</b> ne doit plus être différée.</p></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">7. Indications chirurgicales</p><p style=\"margin:0 0 8px\"><b>Indications urgentes, sans délai</b> (quel que soit le stade du traitement médical) :</p><ul class=\"bullet-list\"><li>Perforation colique</li><li>Colectasie ne répondant pas à 24–48 h de traitement médical intensif, ou s'aggravant</li><li>Hémorragie digestive massive</li><li>Choc septique / défaillance multiviscérale</li></ul><div><img src=\"5a7ba0605064f61593acfdec443e2f26.png\"><br></div><div><img src=\"dd24da622b27571fe75bd449d5279a58.png\">&nbsp;<i>Colectasie&nbsp;</i><br></div><p style=\"margin:10px 0 8px\"><b>Indication différée mais non retardée</b> :</p><ul class=\"bullet-list\"><li>Échec de la corticothérapie IV à J3 <b>et</b> échec du traitement de rescue à J4–J7</li><li>Aggravation clinique ou biologique sous traitement médical optimal, quel que soit le jour</li></ul><p style=\"margin:10px 0 0\">La <b>colectomie subtotale avec iléostomie terminale</b> (sans anastomose ni rétablissement de continuité dans le même temps) est l'intervention de référence en urgence ; la reconstruction (anastomose iléo-anale) est réalisée à distance, à froid.</p></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">8. Pièges à connaître</p><ul class=\"bullet-list\"><li><b>Ne jamais retarder l'avis chirurgical</b> : le chirurgien doit être informé dès l'admission, même si l'évolution semble favorable sous corticoïdes — la décision de colectomie se prépare en amont, elle ne se décide pas dans l'urgence absolue.</li><li><b>Colectasie</b> : peut survenir avec un tableau clinique paradoxalement peu bruyant sous corticoïdes (masquage des signes inflammatoires) — surveillance clinique et radiologique rapprochée indispensable.</li><li><b>Colite à CMV</b> : à rechercher systématiquement devant une corticorésistance, car elle peut nécessiter un traitement antiviral spécifique (Ganciclovir) avant ou en association au traitement immunosuppresseur.</li><li><b>Ne pas prolonger la corticothérapie IV au-delà de 7 à 10 jours</b> sans réponse franche : au-delà, le bénéfice s'épuise et le risque (infectieux, thromboembolique, retard à la chirurgie) augmente.</li><li>La <b>coloscopie totale est contre-indiquée</b> en phase aiguë grave (risque de perforation) ; se limiter à une rectosigmoïdoscopie souple sans préparation.</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Truelove SC, Witts LJ. Cortisone in ulcerative colitis. BMJ 1955 ; Lichtiger S, et al. Cyclosporine in severe ulcerative colitis refractory to steroid therapy. N Engl J Med 1994 (score de Lichtiger) ; Travis SP, et al. Predicting outcome in severe ulcerative colitis. Gut 1996 (critères d'Oxford/Lindgren) ; Raine T, et al. ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment. J Crohns Colitis 2022 ; travaux du GETAID sur la corticorésistance et le traitement de rescue. À adapter au contexte clinique et discuter systématiquement en réunion médico-chirurgicale.</i></p>","id": "colite-aigue-grave","tags": ["colite aiguë grave","RCH","Truelove-Witts","Lichtiger","Oxford","ECCO","GETAID","urgence"],"titre": "Colite aiguë grave","urgent": true},{"categorie": "Endoscopie","contenu": "<p style=\"margin:0 0 6px\"><b>Les colorations en endoscopie digestive</b></p><p style=\"margin:0 0 10px\"><i>Panorama des techniques de chromoendoscopie par colorant et de chromoendoscopie virtuelle, à partir des recommandations de la SFED et de l'ESGE sur la caractérisation optique des lésions digestives.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">Généralités</p><p style=\"margin:0\">La chromoendoscopie vise à améliorer la détection et la caractérisation des lésions muqueuses en accentuant le contraste de surface (relief, pit pattern) ou en révélant des différences fonctionnelles entre tissu normal et tissu pathologique. On distingue les <b>colorants appliqués sur la muqueuse</b> (chromoendoscopie « conventionnelle ») des <b>colorations optiques électroniques</b> (chromoendoscopie « virtuelle »), obtenues par traitement numérique ou filtrage de la lumière, sans application d'aucun produit.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">1. Colorants de contraste</p><p style=\"margin:0 0 8px\"><b>Indigo carmin</b></p><ul class=\"bullet-list\"><li><b>Mécanisme</b> : colorant de contraste <u>non absorbé</u>, qui se dépose dans les creux et dépressions de la muqueuse, soulignant ainsi le relief et l'architecture des cryptes.</li><li><b>Indications</b> : caractérisation des polypes coliques (analyse du <u>pit pattern selon Kudo</u>), dépistage et cartographie de la dysplasie au cours des MICI, meilleure délimitation des lésions avant résection endoscopique (polypectomie, mucosectomie, dissection sous-muqueuse).</li><li><b>Avantages</b> : simple d'emploi, peu d'effets indésirables.<img src=\"5c280c73be523c24f4d1b96cd3d2deee.png\"></li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Colorants d'absorption (colorants vitaux)</p><p style=\"margin:0 0 8px\"><b>Bleu de méthylène</b></p><ul class=\"bullet-list\"><li><b>Mécanisme</b> : colorant vital absorbé activement par les cellules intestinales normales (absorptives), mais pas ou peu par les zones de métaplasie gastrique, de dysplasie ou de néoplasie, qui apparaissent alors non colorées ou moins colorées.</li><li><b>Indications</b> : détection de la <b>métaplasie intestinale </b>dans l'œsophage de Barrett, cartographie de la dysplasie colique au cours des MICI (utilisé en alternative à l'indigo carmin).</li><li><b>Précaution</b> : de très rares cas de dysplasie induite par phototoxicité ont été rapportés avec un usage répété ; méthémoglobinémie exceptionnelle décrite à très forte dose.</li></ul><p style=\"margin:10px 0 8px\"><b>Lugol (solution iodo-iodurée)</b></p><ul class=\"bullet-list\"><li><b>Mécanisme</b> : l'iode se fixe sur le glycogène présent dans les cellules malpighiennes normales de la muqueuse œsophagienne, qui se colorent en brun acajou. Les zones dépourvues de glycogène (dysplasie, carcinome épidermoïde superficiel, œsophagite) restent non colorées, formant des <b>plages iodo-négatives</b> (« zones muettes »).</li><li><b>Indications</b> : dépistage et cartographie du <b>carcinome épidermoïde de l'œsophage</b>, en particulier chez les patients à haut risque (antécédent de cancer ORL, intoxication alcoolo-tabagique).</li><li><b>Contre-indications et précautions</b> : allergie à l'iode ou aux produits de contraste iodés, pathologie thyroïdienne non contrôlée (hyperthyroïdie, notamment en cas d'application étendue et répétée) ; peut provoquer une douleur rétrosternale transitoire.</li></ul><div><img src=\"829ba71c3ad27db8452da7003f87f1c3.png\"><br></div></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">3. Acide acétique</p><p style=\"margin:0 0 8px\"><b>Mécanisme</b> : provoque une coagulation réversible des protéines intracellulaires et une déshydratation superficielle de la muqueuse, accentuant transitoirement le relief des cryptes et améliorant le contraste, notamment en association avec un grossissement optique.</p><p style=\"margin:0\"><b>Indications</b> : amélioration de la visibilité de la jonction œsogastrique et de la muqueuse en cas d'endobrachyœsophage, caractérisation de lésions planes gastriques ou duodénales, exploration proctologique (test à l'acide acétique pour la détection des lésions liées à l'HPV).</p><p style=\"margin:0\"><img src=\"5552724519f53d095a955bd9a949343b.png\"><br></p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Chromoendoscopie virtuelle (colorations optiques électroniques)</p><p style=\"margin:0 0 8px\">Colorations optiques électroniques obtenues par filtrage de la lumière ou traitement numérique du signal, sans application de colorant. Elles accentuent le contraste vasculaire et l'architecture muqueuse, et sont particulièrement utiles associées à un grossissement optique pour l'analyse du pattern vasculaire (classifications de Sano, NICE, JNET) et du pit pattern.</p><table><thead><tr><th>Technique</th><th>Fabricant</th><th>Principe</th></tr></thead><tbody><tr><td><b>NBI</b> (Narrow Band Imaging)</td><td>Olympus</td><td>Filtrage optique de la lumière blanche sur des longueurs d'onde étroites (bleu/vert), fortement absorbées par l'hémoglobine, rehaussant le réseau vasculaire superficiel</td></tr><tr><td><b>BLI</b> (Blue Light Imaging) / <b>LCI</b> (Linked Color Imaging)</td><td>Fujifilm</td><td>Combinaison de lumière laser bleue et blanche ; le BLI accentue les structures vasculaires et muqueuses superficielles, le LCI accentue les différences de teinte de la muqueuse (utile en dépistage)</td></tr><tr><td><b>i-SCAN</b></td><td>Pentax</td><td>Traitement numérique post-acquisition de l'image en lumière blanche (rehaussement des contours, du contraste de surface et de la tonalité)</td></tr><tr><td><b>FICE</b> (Flexible spectral Imaging Color Enhancement)</td><td>Fujifilm</td><td>Reconstruction numérique de l'image à partir de longueurs d'onde spécifiques sélectionnées par l'opérateur</td></tr></tbody></table><p style=\"margin:10px 0 0\">Avantage commun : disponibles instantanément par simple pression d'un bouton, sans préparation ni produit à appliquer, ce qui en facilite l'usage systématique au cours de l'examen.</p></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">5. Synthèse par indication</p><table><thead><tr><th>Situation clinique</th><th>Colorant(s) de choix</th></tr></thead><tbody><tr><td>Caractérisation d'un polype colique,<b> pit pattern</b></td><td>Indigo carmin, ou chromoendoscopie virtuelle (NBI/BLI/i-SCAN) avec grossissement</td></tr><tr><td>Dépistage de la dysplasie dans les MICI</td><td><b>Indigo carmin ou bleu de méthylène</b> (chromoendoscopie), ou lumière blanche haute définition avec temps de retrait prolongé</td></tr><tr><td>Dépistage de la métaplasie intestinale (endobrachyœsophage)</td><td><b>Acide acétique, bleu de méthylène </b>(moins utilisé actuellement), ou chromoendoscopie virtuelle avec grossissement</td></tr><tr><td>Dépistage du carcinome épidermoïde œsophagien</td><td><b>Lugol</b>, ou chromoendoscopie virtuelle (NBI notamment)</td></tr><tr><td>Lésions ano-périnéales liées à l'HPV</td><td><b>Acide acétique</b></td></tr></tbody></table></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : SFED, recommandations sur la chromoendoscopie digestive ; ESGE, Advanced imaging for detection and differentiation of colorectal neoplasia (Technology Review) ; ESGE, Endoscopic diagnosis of Barrett's esophagus. À adapter au matériel d'imagerie disponible et aux protocoles locaux.</i></p>","id": "colorations-endoscopie","tags": ["chromoendoscopie","indigo carmin","lugol","bleu de méthylène","NBI","BLI","i-SCAN"],"titre": "COLORATIONS EN ENDOSCOPIE DIGESTIVE","urgent": false},{"categorie": "Oncologie","contenu": "<p style=\"margin:0 0 6px\"><b>Recommandations actuelles</b></p><p style=\"margin:0 0 10px\"><i>Synthèse à partir des recommandations HAS/INCa (programme national de dépistage organisé), de l'ESGE et des sociétés savantes internationales (USPSTF, ACS).</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">Contexte</p><p style=\"margin:0\"><b>Le cancer colorectal (CCR) </b>se développe le plus souvent à partir d'un adénome ou d'une lésion festonnée, sur plusieurs années, via la <b>séquence adénome-cancer</b>. Cette longue phase préclinique justifie le dépistage : détecter et réséquer les lésions précurseurs avant leur transformation maligne, ou diagnostiquer un cancer à un stade précoce et curable. Le dépistage a démontré une réduction significative de la mortalité par cancer colorectal dans les populations dépistées.</p><p style=\"margin:0\"><img src=\"18380130da0ac879da44e80235a87b14.png\"><br></p><p style=\"margin:0\"><i>Incidence du CCR par tranche d'âge&nbsp;</i></p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">1. Stratégies de dépistage disponibles</p><table><thead><tr><th>Méthode</th><th>Principe</th><th>Rythme si utilisée en dépistage</th></tr></thead><tbody><tr><td><b>Test immunologique fécal (FIT)</b></td><td>Détection d'hémoglobine humaine dans les selles par méthode immunologique</td><td><b>Tous les 2 ans</b></td></tr><tr><td><b>Coloscopie</b></td><td>Exploration directe de la totalité du côlon, avec possibilité de résection immédiate des lésions</td><td><b>Tous les 10 ans</b> en dépistage individuel à risque élevé, si normale</td></tr><tr><td><b>Coloscopie virtuelle (coloscanner)</b></td><td>Scanner abdomino-pelvien avec reconstruction colique après préparation</td><td>Alternative en cas de coloscopie incomplète ou contre-indiquée</td></tr><tr><td><b>Recto-sigmoïdoscopie</b></td><td>Exploration limitée au rectum et au côlon sigmoïde</td><td>Peu utilisée en France, plus répandue dans certains pays anglo-saxons</td></tr></tbody></table></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Dépistage en population à risque moyen</p><p style=\"margin:0 0 8px\">En France, le <b>programme national de dépistage organisé</b> s'adresse à toute personne de <b>50 à 74 ans</b>, sans symptôme et sans facteur de risque particulier :</p><ul class=\"bullet-list\"><li><b>Test immunologique fécal (FIT) tous les 2 ans</b>, envoyé par courrier ou remis par le médecin traitant.</li><li><b>Coloscopie réalisée uniquement si le test est positif</b> — environ 4 % des tests reviennent positifs, et une néoplasie avancée (adénome avancé ou cancer) est retrouvée chez près d'un tiers des personnes ayant un test positif explorées par coloscopie.</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">3. Le test immunologique fécal (FIT)</p><ul class=\"bullet-list\"><li><b>Principe</b> : détection d'hémoglobine humaine par anticorps spécifiques, contrairement à l'ancien test au gaïac (Hemoccult®) qui détectait toute activité peroxydasique, y compris d'origine alimentaire — le FIT est plus sensible et plus spécifique, et ne nécessite pas de restriction alimentaire préalable.</li><li><b>Réalisation</b> : prélèvement unique de selles par le patient à domicile, à l'aide d'un kit fourni.</li><li><b>Performance</b> : sensibilité pour le cancer colorectal de l'ordre de 70 à 80 % pour un seuil de positivité usuel, avec une bonne spécificité ; sensibilité moindre pour les adénomes non dégénérés que pour le cancer invasif.</li><li><b>Limite</b> : un test négatif ne dispense pas de consulter en cas de symptôme d'alarme (rectorragies, altération de l'état général, changement du transit) ; il doit être répété tous les 2 ans pour maintenir son efficacité.</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">4. Dépistage en population à risque élevé et très élevé</p><table><thead><tr><th>Niveau de risque</th><th>Situations concernées</th><th>Modalité de dépistage</th></tr></thead><tbody><tr><td><b>Risque élevé</b></td><td>Antécédent personnel de CCR ou d'adénome ; antécédent familial au 1er degré de CCR ou d'adénome avancé avant 65 ans, ou 2 apparentés au 1er degré quel que soit l'âge ; MICI colique</td><td><b>Coloscopie</b> (dépistage individuel), débutée vers 45 ans ou 5 ans avant l'âge du diagnostic du cas index si plus précoce, répétée tous les 5 ans si normale</td></tr><tr><td><b>Risque très élevé</b></td><td>Syndrome de Lynch (mutation confirmée), polypose adénomateuse familiale</td><td>Coloscopie dès 20-25 ans (Lynch) ou 10-15 ans (PAF), rythme rapproché (tous les 1 à 2 ans), en lien avec une consultation d'oncogénétique</td></tr></tbody></table><p style=\"margin:10px 0 0\">Le FIT n'est <b>pas adapté</b> au dépistage des populations à risque élevé ou très élevé, qui relèvent d'un dépistage individuel par coloscopie selon un calendrier spécifique.</p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">5. Exigences de qualité de la coloscopie</p><p style=\"margin:0 0 8px\">La performance du dépistage par coloscopie dépend directement de sa qualité, évaluée notamment par :</p><ul class=\"bullet-list\"><li>Le <b>taux de détection des adénomes</b> (proportion de coloscopies chez lesquelles au moins un adénome est identifié), indicateur de qualité majeur, associé de façon inverse au risque de cancer d'intervalle.</li><li>Un <b>temps de retrait</b> suffisant (généralement au moins 6 minutes en l'absence de lésion) lors de l'examen en lumière blanche.</li><li>La <b>qualité de la préparation colique</b>, condition indispensable à une exploration fiable.</li><li>L'atteinte du <b>cæcum</b>, avec documentation photographique.</li></ul></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">6. Perspectives</p><p style=\"margin:0\">Plusieurs technologies émergentes sont en cours d'évaluation ou de déploiement progressif : <b>tests sanguins de dépistage</b> reposant sur la détection d'ADN tumoral circulant méthylé (déjà approuvés dans certains pays comme alternative pour les patients refusant le FIT ou la coloscopie, avec une sensibilité pour le cancer comparable au FIT mais une sensibilité moindre pour les lésions précancéreuses), et <b>capsule endoscopique colique</b>, envisageable chez les patients ne pouvant bénéficier d'une coloscopie complète.</p></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : HAS/INCa, programme national de dépistage organisé du cancer colorectal ; ESGE/ESGAR/ESDO, colorectal cancer screening and surveillance guidelines ; American Cancer Society et USPSTF, colorectal cancer screening guidelines. À adapter au contexte individuel et aux modalités du programme local.</i></p>","id": "depistage-cancer-colorectal","tags": ["dépistage","cancer colorectal","FIT","coloscopie","HAS","INCa"],"titre": "Dépistage du cancer colorectal","urgent": false},{"categorie": "Général","contenu": "<p style=\"margin:0 0 6px\"><b>Démarche diagnostique et principales causes</b></p><p style=\"margin:0 0 10px\"><i>Synthèse à partir des recommandations de bonne pratique (SNFGE/CREGG, ACG, WGO) sur la prise en charge de la diarrhée chronique de l'adulte.</i></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Définition</p><p style=\"margin:0\">Diarrhée définie comme <b>chron
