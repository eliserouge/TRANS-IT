<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trans-it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --paper: #F5F6F1;
    --surface: #FFFFFF;
    --ink: #1C2621;
    --muted: #6E6A5D;
    --line: #DAD5C8;
    --accent: #2F6F5E;
    --accent-deep: #1F4B3F;
    --accent-soft: #E4EEEA;
    --urgent: #A94430;
    --urgent-soft: #F5E4DE;
    --focus: #2F6F5E;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121A17; --surface: #1B2621; --ink: #E9EFEA; --muted: #9CA89E;
      --line: #30403A; --accent: #6BC0A6; --accent-deep: #8ED3BB; --accent-soft: #203832;
      --urgent: #E39176; --urgent-soft: #3A241D;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121A17; --surface: #1B2621; --ink: #E9EFEA; --muted: #9CA89E;
    --line: #30403A; --accent: #6BC0A6; --accent-deep: #8ED3BB; --accent-soft: #203832;
    --urgent: #E39176; --urgent-soft: #3A241D;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .serif { font-family: "Spectral", Georgia, serif; }
  button { font-family: inherit; }
  .shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100%; }

  .sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; height: 100dvh; position: sticky; top: 0; overflow-y: auto; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .mark { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; transform: translateY(-1px); }
  .brand h1 { font-size: 1.2rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; }

  .tab-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .tab-nav button { display: flex; align-items: center; gap: 9px; border: none; background: transparent; color: var(--ink); text-align: left; padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 0.92rem; font-weight: 500; }
  .tab-nav button .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
  .tab-nav button:hover { background: var(--accent-soft); }
  .tab-nav button.active { background: var(--accent); color: #fff; }
  .tab-nav button.active .dot { background: #fff; }

  .divider { height: 1px; background: var(--line); margin: 2px 0; }

  .search-box { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .search-box input { border: none; background: transparent; outline: none; color: var(--ink); width: 100%; font-size: 0.9rem; }
  .search-box svg { flex-shrink: 0; opacity: 0.6; }
  .cat-nav { display: flex; flex-direction: column; gap: 2px; }
  .cat-nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: none; background: transparent; color: var(--ink); text-align: left; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 0.85rem; }
  .cat-nav button:hover { background: var(--accent-soft); }
  .cat-nav button.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
  .cat-nav .count { color: var(--muted); font-size: 0.75rem; }
  .cat-nav button.active .count { color: var(--accent-deep); }
  .cat-label { font-size: 0.72rem; text-transform: none; color: var(--muted); padding: 0 10px; margin-top: 2px; }

  .sidebar-spacer { flex: 1; }
  .btn { border: 1px solid transparent; border-radius: 8px; padding: 9px 14px; font-size: 0.88rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn-danger { background: transparent; color: var(--urgent); border-color: var(--urgent); }
  .btn-danger:hover { background: var(--urgent-soft); }
  .btn-block { width: 100%; }
  .sidebar-actions { display: flex; gap: 8px; }
  .sidebar-actions .btn { flex: 1; padding: 8px; font-size: 0.78rem; }
  .sidebar-foot { color: var(--muted); font-size: 0.72rem; line-height: 1.4; border-top: 1px solid var(--line); padding-top: 12px; }

  .mobile-bar { display: none; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .mobile-bar h1 { font-size: 1.05rem; margin: 0; flex: 1; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  .backdrop { display: none; }

  .main { padding: 28px 32px 60px; max-width: 980px; }
  .banner { display: flex; gap: 10px; align-items: flex-start; background: var(--urgent-soft); border: 1px solid var(--urgent); color: var(--ink); border-radius: 9px; padding: 11px 14px; font-size: 0.83rem; margin-bottom: 22px; }
  .banner strong { color: var(--urgent); }
  .note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); border-radius: 9px; padding: 11px 14px; font-size: 0.82rem; margin-bottom: 18px; }

  .view-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .view-head h2 { font-size: 1.35rem; margin: 0; }
  .muted { color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s ease; }
  .card:hover { border-color: var(--accent); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .chip { display: inline-block; font-size: 0.7rem; font-weight: 500; padding: 3px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent-deep); white-space: nowrap; }
  .chip.urgent { background: var(--urgent-soft); color: var(--urgent); }
  .card p { margin: 0; color: var(--muted); font-size: 0.86rem; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .card .tags span { font-size: 0.72rem; color: var(--muted); background: var(--paper); border: 1px solid var(--line); padding: 2px 7px; border-radius: 12px; }
  .card .updated { font-size: 0.72rem; color: var(--muted); margin-top: auto; }

  .empty { padding: 50px 10px; text-align: center; color: var(--muted); }
  .empty h3 { color: var(--ink); margin-bottom: 6px; }

  .detail-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px; }
  .detail-tags { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .detail-card h2 { font-size: 1.7rem; margin: 4px 0 8px; }
  .detail-content { font-size: 0.98rem; line-height: 1.75; color: var(--ink); }
  .section-block { margin-bottom: 20px; }
  .section-block h3 { font-size: 0.95rem; color: var(--accent-deep); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .section-block ul { margin: 0; padding-left: 20px; }
  .section-block li { margin-bottom: 6px; }
  .section-block li:last-child { margin-bottom: 0; }
  .section-block p.plain { margin: 0; }
  .detail-tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
  .detail-tags-list span { font-size: 0.75rem; color: var(--muted); background: var(--paper); border: 1px solid var(--line); padding: 3px 9px; border-radius: 12px; }
  .detail-actions { display: flex; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
  .detail-updated { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }

  .form-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 6px; }
  .field .hint { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 9px 11px; font-size: 0.9rem; font-family: inherit; resize: vertical;
  }
  .field textarea { min-height: 84px; line-height: 1.5; }
  .rte-toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .rte-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; min-width: 32px; height: 30px; padding: 0 8px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
  .rte-btn:hover { background: var(--accent-soft); }
  .rte-btn.b { font-weight: 700; }
  .rte-btn.i { font-style: italic; }
  .rte-btn.u { text-decoration: underline; }
  .rte-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
  .rte-color { width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--surface); cursor: pointer; }
  .rte-font { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; height: 30px; font-size: 0.78rem; padding: 0 4px; }
  .content-editable {
    width: 100%; min-height: 320px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 14px 16px; font-size: 0.95rem; line-height: 1.7; font-family: inherit;
  }
  .content-editable:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .content-editable:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .content-editable ul { padding-left: 22px; margin: 8px 0; }
  .content-editable ul.dash-list { list-style-type: "– "; }
  .content-editable ul.bullet-list { list-style-type: disc; }
  .content-editable p { margin: 0 0 10px; }
  .content-editable img { max-width: 100%; border-radius: 6px; margin: 8px 0; }
  .content-editable table, .detail-content table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.9rem; }
  .content-editable th, .content-editable td, .detail-content th, .detail-content td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
  .content-editable th, .detail-content th { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
  .detail-content ul { padding-left: 22px; margin: 8px 0; }
  .detail-content ul.dash-list { list-style-type: "– "; }
  .detail-content ul.bullet-list { list-style-type: disc; }
  .detail-content img { max-width: 100%; border-radius: 6px; margin: 10px 0; }
  .detail-content p { margin: 0 0 12px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 16px; height: 16px; }
  .form-actions { display: flex; gap: 10px; margin-top: 22px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  a.link-btn { color: var(--accent-deep); text-decoration: none; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
  a.link-btn:hover { text-decoration: underline; }

  /* Scores */
  .score-group-title { font-size: 0.78rem; color: var(--muted); margin: 22px 0 10px; }
  .score-group-title:first-child { margin-top: 0; }
  .calc-form { display: flex; flex-direction: column; gap: 16px; }
  .result-panel { margin-top: 22px; padding: 18px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent); }
  .result-panel .value { font-family: "Spectral", serif; font-size: 2rem; font-weight: 600; color: var(--accent-deep); }
  .result-panel .badge { display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 20px; background: var(--surface); font-size: 0.8rem; font-weight: 600; }
  .result-panel p { margin: 10px 0 0; font-size: 0.88rem; }

  .score-table { width: 100%; border-collapse: collapse; margin: 4px 0 6px; font-size: 0.82rem; }
  .score-table th, .score-table td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
  .score-table th { background: var(--paper); font-weight: 600; }
  .score-table td.pts { text-align: right; white-space: nowrap; width: 1%; }
  .score-footnote { font-size: 0.76rem; color: var(--muted); margin: 4px 0 14px; }
  .score-reference { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .mobile-bar { display: flex; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); transition: transform 0.2s ease; z-index: 20; box-shadow: 2px 0 14px rgba(0,0,0,0.15); }
    .sidebar.open { transform: translateX(0); }
    .backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 15; }
    .main { padding: 20px 16px 50px; }
    .row-2 { grid-template-columns: 1fr; }
    .detail-card, .form-card { padding: 20px; }
  }
</style>
</head>
<body>

<div class="backdrop" id="backdrop" data-action="close-sidebar"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div>
    <div class="mobile-bar">
      <button class="icon-btn" data-action="toggle-sidebar" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="serif" id="mobile-title">Trans-it</h1>
    </div>
    <main class="main" id="main"></main>
  </div>
</div>

<script>

  var CATEGORY_COLORS = {

    "Fonctionnel": { bg: "#E4E9FA", fg: "#35449B" },

    return c ? ("background:" + c.bg + ";color:" + c.fg + ";") : "";
  }
  var MED_CATEGORIES = [];

  // ---------------- seed content ----------------
  var FICHES_SEED = [{"categorie": "MICI","contenu": "<p style=\"margin:0 0 6px\"><b>Schémas d'induction et d'entretien des biothérapies et immunosuppresseurs dans les MICI</b></p><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">ANTI TNF ALPHA</p><div style=\"background:#FFFFFF; border:1px solid #24507C; border-radius:6px; padding:10px 14px 12px; margin:10px 0\"><p style=\"margin:0 0 8px; color:#24507C; font-weight:bold\">INFLIXIMAB (Remicade, Inflectra, Remsima, Flixabi)</p><table><thead><tr><th>Schéma</th><th>S0</th><th>S2</th><th>S6</th><th>Entretien</th></tr></thead><tbody><tr><td>1) IV — induction et entretien</td><td>5 mg/kg</td><td>5 mg/kg</td><td>5 mg/kg</td><td>Toutes les 8 ou 4 semaines à 5-10 mg/kg</td></tr><tr><td>2) Passage en SC dès l'induction</td><td>5 mg/kg IV</td><td>5 mg/kg IV</td><td>5 mg/kg SC</td><td>Remsima 120 mg/14 jours</td></tr><tr><td>3) Passage en SC plus tard</td><td>—</td><td>—</td><td>—</td><td>À 4-8 semaines de la dernière injection : Remsima 120 mg/14 jours</td></tr></tbody></table></div><p style=\"margin:10px 0 4px\"><b>ADALIMUMAB</b> (Humira, Amgevita, Imraldi, Idacio, Hyrimoz, hulio, Yuflyma, Amsparity)</p><p style=\"margin:6px 0 2px\">Uniquement sous cutané</p><ul class=\"bullet-list\"><li>S0 160 mg</li><li>S2 80 mg</li><li>Entretien 40 mg/14 jours (optimisation possible toutes les semaines ou 80 mg)</li></ul><p style=\"margin:10px 0 4px\"><b>GOLIMUMAB</b> (Simponi)</p><p style=\"margin:6px 0 2px\">RCH uniquement</p><ul class=\"bullet-list\"><li>S0 SC 200 mg</li><li>S2 SC 100 mg</li><li>Puis 1 injection toutes les 4 semaines (50 mg si &lt; 80 kg et 100 mg si &gt; 80 kg)</li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">ANTI INTÉGRINE</p><p style=\"margin:10px 0 4px\"><b>VEDOLIZUMAB</b> (Entyvio)</p><p style=\"margin:6px 0 2px\">1) Induction et entretien IV</p><ul class=\"bullet-list\"><li>S0 300 mg</li><li>S2 300 mg</li><li>S6 300 mg</li><li>8 semaines après 300 mg, optimisation possible toutes les 4 semaines</li></ul><p style=\"margin:6px 0 2px\">2) Passage vers forme SC</p><ul class=\"bullet-list\"><li>a 4-8 semaines de la dernière injection : Entyvio 108 mg/14 jours</li></ul></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">ANTI IL12-IL23</p><p style=\"margin:10px 0 4px\"><b>USTEKINUMAB</b> (Stelara, Wezenla, Uzpruvo, Steqeyma)</p><p style=\"margin:6px 0 2px\">S0 IV selon le poids</p><ul class=\"bullet-list\"><li>&lt; 55 kg : 260 mg</li><li>55-85 kg : 390 mg</li><li>&gt; 85 kg : 520 mg</li></ul><ul class=\"bullet-list\"><li>S8 SC 90 mg</li><li>Puis toutes les 8-12 semaines</li></ul></div><div style=\"background:#FBE7EC; border-left:4px solid #9B3355; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9B3355; font-weight:bold\">ANTI IL 23</p><p style=\"margin:10px 0 4px\"><b>RISANKIZUMAB</b> (Skyrizi)</p><ul class=\"bullet-list\"><li>S0 600 mg IV Crohn</li><li>S4 600 mg IV Crohn</li><li>S8 600 mg IV Crohn</li><li>S12 360 mg SC</li><li>Puis toutes les 8 semaines SC</li></ul><p style=\"margin:10px 0 4px\"><b>GUSELKUMAB</b> (Tremfya)</p><p style=\"margin:6px 0 2px\">Induction — IV : Crohn</p><ul class=\"bullet-list\"><li>S0 200 mg</li><li>S4 200 mg</li><li>S8 200 mg</li></ul><p style=\"margin:6px 0 2px\">Induction — SC : Crohn et RCH</p><ul class=\"bullet-list\"><li>S0 400 mg</li><li>S4 400 mg</li><li>S8 400 mg</li></ul><p style=\"margin:6px 0 2px\">Entretien en SC</p><ul class=\"bullet-list\"><li>S16 toutes les 8 semaines 100 mg</li><li>S12 toutes les 4 semaines 200 mg</li></ul></div><div style=\"background:#E4E9FA; border-left:4px solid #35449B; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#35449B; font-weight:bold\">ANTI JAK</p><p style=\"margin:10px 0 4px\"><b>UPADACITINIB</b> (Rinvoq)</p><p style=\"margin:6px 0 2px\">RCH</p><ul class=\"bullet-list\"><li>Induction 45 mg/jour pendant 8 semaines (jusqu'à S16 possible)</li><li>Entretien 15 mg (risque de TVP) ou 30 mg/jour</li></ul><p style=\"margin:6px 0 2px\">Crohn</p><ul class=\"bullet-list\"><li>Induction 45 mg/jour pendant 12 semaines (jusqu'à S24 possible)</li><li>Entretien 15 ou 30 mg/jour</li></ul><p style=\"margin:10px 0 4px\"><b>TOFACITINIB</b> (Xeljanz)</p><ul class=\"bullet-list\"><li>Induction 10 mg x 2/jour pendant 8 semaines (jusqu'à S16 possible)</li><li>Entretien 5 mg x 2/jour</li></ul><p style=\"margin:10px 0 4px\"><b>FILGOTINIB</b> (Jyseleca)</p><ul class=\"bullet-list\"><li>200 mg/jour en induction et entretien</li></ul></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">MODULATEUR DES RÉCEPTEURS DE LA S1P</p><p style=\"margin:10px 0 4px\"><b>ETRASIMOD</b> (Velsipity)</p><p style=\"margin:6px 0 2px\">RCH uniquement</p><ul class=\"bullet-list\"><li>2 mg/jour en induction et entretien</li></ul></div><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">IMMUNOSUPPRESSEURS</p><p style=\"margin:10px 0 4px\"><b>MÉTHOTREXATE</b></p><p style=\"margin:6px 0 2px\">IM/SC ou per os (efficacité moindre)</p><ul class=\"bullet-list\"><li>25 mg IM ou SC</li><li>15 mg IM ou SC surtout en combothérapie</li><li>+ acide folique</li></ul></div>","id": "9a8af9cd-a3dd-4e8d-8999-eed0039fc1b8","tags": ["Biothérapies","GETAID"],"titre": "Biothérapies et immunosuppresseurs dans les MICI","urgent": false},{"categorie": "Anatomie","contenu": "<p style=\"margin:0 0 6px\"><b>ANATOMIE DU FOIE : segmentation, vascularisation</b></p><p style=\"margin:0 0 10px\"><i>Synthèse d'anatomie descriptive et fonctionnelle, utile à la lecture de l'imagerie hépatobiliaire et à la compréhension des résections hépatiques.</i></p><p style=\"margin:0 0 10px\"></p><ul class=\"bullet-list\"><li>Le foie est l'organe le plus <b>volumineux </b>du corps humain.</li><li><b><font color=\"#2e3c5c\">Flèche </font>hépatique </b>= hauteur verticale entre<b><font color=\"#2f316f\"> </font><font color=\"#1512de\">10 et 12 cm.</font></b></li></ul><p></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">1. Deux logiques de division du foie</p><p style=\"margin:0 0 8px\">Le foie peut être divisé selon deux logiques différentes, qui ne se superposent pas :</p><ul class=\"bullet-list\"><li><b>Anatomie morphologique classique</b> : lobe droit et lobe gauche séparés par le <b>ligament falciforme</b>, visible à la surface du foie — c'est la division « anatomique de surface ».</li><li><b>Anatomie fonctionnelle</b> : le foie droit et le foie gauche sont en réalité séparés par un plan qui passe par le lit vésiculaire et la veine cave inférieure, appelé <b>ligne de Cantlie</b>, sans repère visible en surface. C'est cette division qui compte pour la chirurgie, car elle sépare deux territoires vasculaires réellement indépendants.<img src=\"f1ee905fe8c8db05167e8e8d30230a38.png\"></li></ul></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">2. Segmentation de Couinaud (8 segments)</p><p style=\"margin:0 0 8px\">La classification de Couinaud divise le foie en <b>8 segments fonctionnels</b>, chacun doté de sa propre vascularisation portale et artérielle et de son propre drainage biliaire, ce qui permet une résection segmentaire sans dévasculariser le reste du parenchyme.</p><table><thead><tr><th>Segment</th><th>Localisation habituelle</th></tr></thead><tbody><tr><td><b>I</b></td><td>Lobe caudé (lobe de Spiegel) — segment à part, drainé directement dans la veine cave inférieure</td></tr><tr><td><b>II, III</b></td><td>Foie gauche (secteur latéral gauche)</td></tr><tr><td><b>IV (a et b)</b></td><td>Foie gauche (secteur médial, correspondant globalement au lobe carré)</td></tr><tr><td><b>V, VIII</b></td><td>Foie droit, secteur antérieur</td></tr><tr><td><b>VI, VII</b></td><td>Foie droit, secteur postérieur</td></tr></tbody></table><p style=\"margin:10px 0 0\">Le foie droit fonctionnel regroupe les segments V à VIII, le foie gauche fonctionnel les segments II à IV, le segment I formant une entité autonome.</p><p style=\"margin:10px 0 0\"><img src=\"f47eb31deb3ec40a0840e3be235531dd.png\"><br></p><p style=\"margin:10px 0 0\"><img src=\"3143cb6fa221c1046f8c72c0690f1256.png\"><br></p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">3. Vascularisation afférente (pédicule hépatique)</p><p style=\"margin:0 0 8px\">Le foie reçoit un <b>double apport vasculaire</b> :</p><ul class=\"bullet-list\"><li><b>Veine porte</b> (environ 75 % du débit sanguin hépatique, sang riche en nutriments mais pauvre en oxygène) : née de la confluence des veines mésentérique supérieure et splénique, elle se divise en une branche portale droite et une branche portale gauche au niveau du hile.</li><li><b>Artère hépatique propre</b> (environ 25 % du débit, mais assurant la moitié de l'oxygénation hépatique), branche de <b>l'artère hépatique commune</b>, elle-même issue du tronc cœliaque (sort de l'aorte abdominale à hauteur de T12) ; elle se divise également en branches droite et gauche. Le tronc cœliaque se divise en artère hépatique commune (artère hépatique propre et artère gastro-duodénale), artère gastrique gauche et artère splénique.&nbsp;</li></ul><p style=\"margin:0 0 0\">Ces deux vaisseaux, accompagnés de la voie biliaire, cheminent ensemble dans le <b>pédicule hépatique</b> (ou « triade porte »), enveloppé d'une gaine conjonctive qui se prolonge dans le parenchyme autour de chaque ramification : la <b>capsule de Glisson</b>.</p><p style=\"margin:0 0 0\"><img src=\"d4e3d3fe43b7486ecad4ce9bb010c44e.png\"><br></p><p style=\"margin:0 0 0\"><img src=\"b8bb42ad95e6c3267309cb4300f418cf.png\"><br></p><p style=\"margin:0 0 0\"><img src=\"8d2f539b57bc25c646598f544d2cad32.png\"><br></p></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">4. Vascularisation efférente (veines hépatiques)</p><p style=\"margin:0 0 8px\">Le drainage veineux se fait par les <b>veines sus-hépatiques</b> (veines hépatiques), au nombre de trois principales, se jetant directement dans la veine cave inférieure juste sous le diaphragme :</p><ul class=\"bullet-list\"><li><b>Veine hépatique droite</b> : draine le secteur postérieur du foie droit</li><li><b>Veine hépatique médiane</b> : chemine dans le plan de la ligne de Cantlie, à la limite entre foie droit et foie gauche fonctionnels</li><li><b>Veine hépatique gauche</b> : draine le foie gauche</li></ul><p style=\"margin:0\">Le segment I (lobe caudé) se draine à part, par de petites veines accessoires directement dans la veine cave inférieure — particularité qui explique son épargne fréquente lors de certaines obstructions veineuses (syndrome de Budd-Chiari).</p></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">5. Voies biliaires</p><p style=\"margin:0\">Chaque segment est drainé par un canalicule biliaire propre, qui rejoint les canaux sectoriels puis les <b>canaux hépatiques droit et gauche</b>. Leur réunion forme la <b>convergence biliaire supérieure</b>, à l'origine du <b>canal hépatique commun</b>, qui devient <b>canal cholédoque</b> après la jonction avec le canal cystique issu de la vésicule biliaire.</p></div><div style=\"background:#FDF3D6; border-left:4px solid #8A6D0E; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#8A6D0E; font-weight:bold\">6. Ligaments et moyens de fixité</p><ul class=\"bullet-list\"><li><b>Ligament falciforme</b> : relie la face antérieure du foie à la paroi abdominale antérieure et au diaphragme ; il sépare visuellement (mais pas fonctionnellement) le lobe droit du lobe gauche.</li><li><b>Ligament rond du foie</b> (ligamentum teres) : bord libre du ligament falciforme, il contient le reliquat fibreux de la veine ombilicale.</li><li><b>Petit omentum</b> : comprend le <b>ligament hépato duodénal</b>&nbsp;(qui contient le pédicule hépatique : veine porte, artère hépatique, voie biliaire principale) et le <b>ligament hépato gastrique</b>.</li><li><b>Ligament coronaire</b> et <b>ligaments triangulaires</b> (droit et gauche) : réflexions péritonéales fixant le foie au diaphragme, délimitant la <b>area nuda</b> (zone dépourvue de péritoine, en rapport direct avec le diaphragme).</li><li><b>Ligament veineux</b> (ligamentum venosum) : reliquat fibreux du canal veineux d'Arantius, situé entre le lobe caudé et le foie gauche.</li></ul></div><div style=\"background:#E4EEEA; border-left:4px solid #1F4B3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F4B3F; font-weight:bold\"><i>Anecdotes historiques</i></p><ul class=\"bullet-list\"><li><i><b>La ligne de Cantlie (1898)</b> : le chirurgien écossais James Cantlie fut le premier à observer, à partir d'un cas clinique d'atrophie hépatique, que la division fonctionnelle du foie ne suit pas le repère visuel du ligament falciforme, mais un plan passant par le lit vésiculaire et la veine cave inférieure — plus de 50 ans avant la formalisation de la segmentation moderne.</i></li><li><i><b>Claude Couinaud (1922-2008)</b> : ce chirurgien et anatomiste français a formalisé, dans sa thèse de 1957, la segmentation du foie en 8 segments autonomes à partir d'études de moulages vasculaires post-mortem — travail qui reste, plus de 65 ans plus tard, la référence internationale pour décrire l'anatomie chirurgicale du foie et planifier les hépatectomies.</i></li><li><i><b>La capsule de Glisson</b> doit son nom à Francis Glisson, médecin anglais du XVIIe siècle, qui décrivit le premier cette gaine conjonctive entourant le pédicule hépatique et ses ramifications intra-parenchymateuses — concept toujours utilisé aujourd'hui sous le nom de « pédicule glissonien » dans les techniques de résection hépatique.</i></li><li><i><b>Le ligament rond</b> n'est pas qu'un simple repère anatomique : il rappelle que chez le fœtus, la veine ombilicale transportait le sang oxygéné du placenta jusqu'au foie puis, via le canal veineux d'Arantius (futur ligament veineux), directement à la veine cave inférieure, court-circuitant une grande partie de la circulation hépatique.</i></li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : Couinaud C. Le foie : études anatomiques et chirurgicales. Masson, 1957 ; Cantlie J. On a new arrangement of the right and left lobes of the liver. J Anat Physiol 1898;32:iv-ix ; ouvrages d'anatomie de référence (Netter, Rouvière). Anecdotes historiques données à titre culturel.</i></p>","id": "anatomie-hepatique","tags": ["anatomie","foie","Couinaud","segments","vascularisation","ligaments"],"titre": "ANATOMIE DU FOIE","urgent": false},{"categorie": "Général","contenu": "<p style=\"margin:0 0 6px\"><b>Démarche diagnostique</b></p><div style=\"background:#ECEBE5; border-left:4px solid #5A5748; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#5A5748; font-weight:bold\">Définition et principe de la démarche</p><p style=\"margin:0 0 8px\"><b>Définition (OMS)</b> : hémoglobine <b>&lt; 13 g/dL chez l'homme</b>, <b>&lt; 12 g/dL chez la femme</b> (&lt; 11 g/dL chez la femme enceinte).</p><p style=\"margin:0\">La démarche diagnostique repose sur <b>deux paramètres clés</b> de l'hémogramme : le <b>volume globulaire moyen (VGM)</b>, qui oriente vers un mécanisme, et le <b>taux de réticulocytes</b>, qui indique si la moelle osseuse répond de façon adaptée (anémie régénérative) ou non (anémie arégénérative/centrale).</p><p style=\"margin:0\"><img src=\"94d23d92fcd18afca93aa2b50fcb80bc.png\"><br></p></div><div style=\"background:#E4EDF7; border-left:4px solid #24507C; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#24507C; font-weight:bold\">Schéma récapitulatif</p><table><thead><tr><th></th><th>Microcytaire<br>(VGM &lt; 80 fL)</th><th>Normocytaire<br>(VGM 80–100 fL)</th><th>Macrocytaire<br>(VGM &gt; 100 fL)</th></tr></thead><tbody><tr><td><b>Régénérative</b><br>(réticulocytes<br>&gt; 120-150 G/L)</td><td style=\"text-align:left\">Rare (hémolyse chronique avec composante ferriprive associée)</td><td style=\"text-align:left\">Hémorragie aiguë<br>Hémolyse (corpusculaire ou extra-corpusculaire)</td><td style=\"text-align:left\">Réponse médullaire à une hémolyse ou une hémorragie (réticulocytes jeunes, volumineux)</td></tr><tr><td><b>Arégénérative</b><br>(réticulocytes<br>&lt; 120 G/L)</td><td style=\"text-align:left\"><b>Carence martiale</b> (fer)<br>Thalassémie<br>Anémie inflammatoire évoluée<br>Anémie sidéroblastique</td><td style=\"text-align:left\"><b>Anémie inflammatoire</b> (maladie chronique)<br>Insuffisance rénale chronique<br>Insuffisance médullaire (aplasie, envahissement)<br>Carence martiale ou en folates/B12 débutante</td><td style=\"text-align:left\"><b>Carence en vitamine B12 ou en folates</b><br>Alcoolisme chronique<br>Hypothyroïdie<br>Myélodysplasie<br>Insuffisance hépatocellulaire<br>Certains médicaments (hydroxyurée, méthotrexate, certains antirétroviraux)</td></tr></tbody></table></div><div style=\"background:#E3EFEA; border-left:4px solid #1F5C3F; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#1F5C3F; font-weight:bold\">Focus : anémie microcytaire</p><p style=\"margin:0 0 8px\">Presque toujours <b>arégénérative</b>. En pratique gastro-entérologique, la <b>carence martiale</b> domine largement, et toute carence martiale inexpliquée chez l'adulte impose la recherche d'une <b>source digestive occulte</b> (endoscopie haute et coloscopie), en particulier après 50 ans ou en l'absence de cause gynécologique évidente chez la femme.</p><ul class=\"bullet-list\"><li><b>Ferritine basse</b> : confirme la carence martiale.</li><li><b>Ferritine normale ou élevée</b> avec microcytose : évoquer une thalassémie mineure (électrophorèse de l'hémoglobine) ou une anémie inflammatoire évoluée (CRP, contexte).</li></ul></div><div style=\"background:#F1E7F7; border-left:4px solid #6A3D8A; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#6A3D8A; font-weight:bold\">Focus : anémie normocytaire</p><p style=\"margin:0 0 8px\"><b>Régénérative</b> : rechercher en priorité une <b>hémorragie aiguë</b> (dont digestive) ou une <b>hémolyse</b> (haptoglobine effondrée, LDH élevées, bilirubine libre augmentée, test de Coombs).</p><p style=\"margin:0\"><b>Arégénérative</b> : l'<b>anémie inflammatoire</b> (des maladies chroniques, dont les MICI) est la cause la plus fréquente en pratique digestive ; elle associe typiquement une ferritine normale ou élevée et un coefficient de saturation de la transferrine bas. L'insuffisance rénale chronique et l'insuffisance médullaire sont à évoquer selon le contexte.</p></div><div style=\"background:#FCEBDD; border-left:4px solid #9C5A16; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#9C5A16; font-weight:bold\">Focus : anémie macrocytaire</p><p style=\"margin:0 0 8px\">Le plus souvent <b>arégénérative</b>. En gastro-entérologie, penser systématiquement :</p><ul class=\"bullet-list\"><li><b>Carence en vitamine B12</b> : maladie de Biermer (gastrite auto-immune), gastrectomie totale ou partielle, résection iléale terminale ou maladie de Crohn iléale, pullulation bactérienne chronique du grêle.</li><li><b>Carence en folates</b> : malabsorption (maladie cœliaque, résection étendue du grêle), dénutrition, certains traitements (méthotrexate, sulfasalazine).</li><li><b>Insuffisance hépatocellulaire et alcoolisme chronique</b> : cause fréquente de macrocytose, avec ou sans authentique anémie.</li></ul><p style=\"margin:8px 0 0\"><b>Régénérative</b> : une hémolyse ou une hémorragie aiguë en cours de régénération peuvent transitoirement donner une macrocytose, du fait de la libération de réticulocytes jeunes et volumineux.</p></div><div style=\"background:#F5E4DE; border-left:4px solid #A94430; border-radius:8px; padding:14px 18px; margin:16px 0\"><p style=\"margin:0 0 10px; color:#A94430; font-weight:bold\">Pièges pratiques en gastro-entérologie</p><ul class=\"bullet-list\"><li>Une <b>carence martiale associée à une carence en B12 ou en folates</b> peut masquer la macrocytose attendue et donner un VGM faussement normal — toujours interpréter le VGM avec prudence en cas de double carence.</li><li>Devant une <b>anémie ferriprive de l'adulte sans cause gynécologique évidente</b>, l'exploration digestive complète (haute et basse) est systématique, y compris en l'absence de symptôme digestif.</li><li>La <b>ferritine</b> est une protéine de l'inflammation : elle peut être faussement normale ou élevée en cas de carence martiale associée à un syndrome inflammatoire (situation fréquente dans les MICI) — le <b>coefficient de saturation de la transferrine</b> aide alors à trancher.</li></ul></div><p style=\"margin:16px 0 0; color:#6E6A5D\"><i>Sources : recommandations générales d'hématologie (HAS, référentiels d'hématologie) sur la démarche diagnostique devant une anémie ; ECCO, prise en charge de l'anémie dans les MICI. À adapter au contexte clinique et aux comorbidités.</i></p>","id": "anemie-vgm-reticulocytes","tags": ["anémie","VGM","réticulocytes","carence martiale","B12","folates"],"titre": "Anémie","urgent": false},{"categorie": "Endoscopie","contenu": "<p><strong>ANTITHROMBOTIQUES EN ENDOSCOPIE — FICHE FLASH</strong></p><p><i>Karsenti D et al. Hépato-Gastro Onco Dig 2023;30:283-292 (SFED, d'après BSG/ESGE 2021).</i></p><p><u><strong>La règle qui prime</strong><br></u><strong>L'aspirine se poursuit pour toutes les procédures</strong>, <b>SAUF ampullectomie</b>. Son arrêt ne se décide qu'au cas par cas : le risque cardiovasculaire d'une interruption injustifiée dépasse le risque hémorragique de la quasi-totalité des gestes.</p><p><strong><u>1. Risque hémorragique du geste</u></strong></p><table><thead><tr><th style=\"background-color:#E3EFEA; color:#1F5C3F\">Faible risque</th><th style=\"background-color:#FBE7EC; color:#9B3355\">Haut risque</th><th style=\"background-color:#A94430; color:#ffffff\">Très haut risque</th></tr></thead><tbody><tr><td>Gastroscopie / Coloscopie ± biopsie<br>Échoendoscopie sans ponction<br>CPRE sans sphinctérotomie<br>Prothèses digestives<br>Entéroscopie simple ou double ballon</td><td>Polypectomie · Mucosectomie · DSM<br>CPRE avec sphinctérotomie<br>Échoendoscopie avec ponction ou thérapeutique<br>GPE · Endo-sleeve · ligature de VO<br>Plasma argon · Radiofréquence œsophagienne<br>Dilatation digestive<br>Entéroscopie spiralée</td><td><strong>Ampullectomie <i>(</i></strong><i>Hémorragie dans 10,6 % des cas, sévère dans un quart d'entre eux)</i></td></tr></tbody></table><p>Une coloscopie peut être gérée d'emblée comme un geste à haut risque (polypes fréquents) ; idem pour la CPRE si une sphinctérotomie est possible.</p><p><strong><u>2. Risque thrombotique du terrain</u></strong></p><p><strong>Arrêt d'un P2Y12</strong></p><table><thead><tr><th style=\"background-color:#E3EFEA; color:#1F5C3F\">Faible risque</th><th style=\"background-color:#FBE7EC; color:#9B3355\">Haut risque</th></tr></thead><tbody><tr><td>Cardiopathie ischémique sans stent<br>Maladie vasculaire cérébrale<br>Artérite périphérique</td><td>Stent coronarien actif <b>&lt; 12 mois</b><br>Stent coronarien nu <b>&lt; 1 mois</b></td></tr></tbody></table><p><strong>Arrêt d'un AVK</strong></p><table><thead><tr><th style=\"background-color:#E3EFEA; color:#1F5C3F\">Faible risque</th><th style=\"background-color:#FBE7EC; color:#9B3355\">Haut risque</th></tr></thead><tbody><tr><td>Xénogreffe valvulaire cardiaque<br>FA non valvulaire avec accident thromboembolique &gt; 3 mois<br>Thrombophilie (après avis hématologique)<br>Accident thromboembolique &gt; 3 mois</td><td>Valve mécanique mitrale ou aortique<br>Valve prothétique + FA<br>FA + rétrécissement mitral<br>FA + AVC/AIT + CHADS2 ≥ 3<br>Accident thromboembolique &lt; 3 mois</td></tr></tbody></table><p>CHADS2 : insuffisance cardiaque (1), HTA (1), âge &gt; 75 ans (1), diabète (1), AVC/AIT ou embolie systémique (2).</p><p style=\"background-color:#F5E4DE\"><strong style=\"color:#A94430\">Appeler le cardiologue avant de décider</strong> : stent nu &lt; 6 semaines, stent actif &lt; 6 mois, IDM &lt; 6 mois, antécédent de thrombose de stent sous bithérapie ou de CTO, stent sur coronaire unique, &gt; 3 stents ou &gt; 60 mm de stenting.</p><p><strong><u>3. Conduite par molécule</u></strong></p><table><thead><tr><th>Molécule</th><th style=\"background-color:#E3EFEA; color:#1F5C3F\">Geste à faible risque</th><th style=\"background-color:#FBE7EC; color:#9B3355\">Geste à haut risque</th><th>Reprise</th></tr></thead><tbody><tr><td><strong>Aspirine</strong></td><td>Poursuivre</td><td>Poursuivre — dernière prise J-5 si ampullectomie</td><td>—</td></tr><tr><td><strong>Clopidogrel · prasugrel · ticagrélor</strong></td><td>Poursuivre</td><td>Dernière prise <strong>J-7</strong>, relais par aspirine* — avis cardio pour ticagrélor et prasugrel. Ampullectomie : J-5 à J-7</td><td>1 à 2 jours après le geste</td></tr><tr><td><strong>Bithérapie antiplaquettaire</strong></td><td>Poursuivre</td><td>Arrêter le P2Y12, <strong>garder l'aspirine</strong> ; si terrain à haut risque thrombotique, avis du cardiologue interventionnel</td><td>1 à 2 jours après le geste</td></tr><tr><td><strong>AVK</strong></td><td>Poursuivre, INR dans la cible dans la semaine précédente</td><td>Arrêt <strong>J-5</strong>, <strong>INR &lt; 1,5</strong>. Relais HBPM à partir de <strong>J-3</strong> <strong>uniquement si haut risque thrombotique**</strong>, dernière dose ≥ 24 h avant</td><td>Le soir du geste ; HBPM le lendemain jusqu'à l'INR cible si relais</td></tr><tr><td><strong>AOD — apixaban, rivaroxaban</strong></td><td>Omettre la dose du matin</td><td>Dernière prise <strong>J-3</strong></td><td>2 à 3 jours après un geste à haut risque</td></tr><tr><td><strong>AOD — dabigatran</strong></td><td>Omettre la dose du matin</td><td>Dernière prise <strong>J-3</strong> — <strong>J-5 si ClCr 30-50 mL/min</strong></td><td>2 à 3 jours après un geste à haut risque</td></tr></tbody></table><p><strong>Jamais de relais pour les AOD</strong> : plus d'hémorragies majeures sans bénéfice thromboembolique. <b>L'arrêt temporaire sans relais est sûr.</b></p><p>* Relais par l'aspirine possible seulement en l'absence de stent actif &lt; 12 mois ou de stent nu &lt; 1 mois.<br>** Relais AVK seulement si valve mécanique, valve + FA, rétrécissement mitral + FA, FA + AVC/AIT &lt; 3 mois, FA + CHADS &gt; 3, TVP &lt; 3 mois, antécédent de TVP sous AVK.</p><p>- Après une DSM, il peut être souhaitable de retarder la reprise au-delà de ces délais.</p><p>- Thrombose veineuse &lt; 3 mois : ne pas interrompre l'anticoagulation, et reporter si possible un geste à haut risque au-delà de 3 mois.</p><p><strong><u>4. Pièges à connaître</u></strong></p><ul><li>Le moment le plus à risque d'une polypectomie n'est pas le geste mais <strong>la reprise du traitement</strong>. Hémorragie tardive possible <b>jusqu'à 2 semaines</b> : le patient doit savoir qui joindre, à toute heure.</li><li><strong>Polype &lt; 1 cm sous Clopidogrel seul</strong> : résection relativement sûre, de préférence à l'anse froide. Alternative : substituer l'Aspirine au Clopidogrel 7 jours avant.</li><li><strong>Clips prophylactiques</strong> après polypectomie chez les patients sous antithrombotiques. Après DSM : IPP, clips, colles, poudres hémostatiques.</li><li><strong>Échoendoscopie avec ponction</strong> (position SFED) : seule l'aspirine peut être maintenue pour les lésions tissulaires ; l'interrompre si possible avant la ponction d'une lésion kystique. Kysto-gastrostomie et nécrosectomie = <b>haut risque</b>.</li><li><strong>Entéroscopie spiralée</strong> : anticoagulation curative contre-indiquée.&nbsp;</li><li><strong>Endo-sleeve</strong> (position SFED) : antithrombotiques contre-indiqués hors aspirine faible dose.</li><li><strong>DSM</strong> : saignement retardé de 16 % sous AVK ou AOD, y compris avec relais par héparine.</li></ul><p><strong><u>5. Si hémorragie digestive aiguë</u></strong></p><ul><li><strong>Aspirine</strong> : arrêt définitif envisageable en prévention primaire. En prévention secondaire, ne pas arrêter systématiquement ; si arrêtée, reprendre dès l'hémostase obtenue.</li><li><strong>Bithérapie + stent coronarien</strong> : poursuivre si possible, en lien avec le cardiologue interventionnel. Si le P2Y12 doit être arrêté, garder l'aspirine et le réintroduire dans les 5 jours.</li><li><strong>Anticoagulants</strong> : arrêt + correction de la coagulopathie selon la sévérité, sans retarder l'endoscopie. Instabilité sous AVK → vitamine K IV + PPSB (ou PFC). Instabilité sous AOD → IDARUCIZUMAB (dabigatran), ANDEXANET (anti-Xa), ou PPSB IV.</li><li><strong>Reprise</strong> : après 7 jours si faible risque thrombotique ; plus précoce avec relais héparine, de préférence dans les 3 jours, si haut risque.</li></ul><p><i>Source : Karsenti D, Fassler I, Barret M, et al. Gestion des antiagrégants et anticoagulants en endoscopie (document SFED 2023 à partir des recommandations BSG/ESGE 2021). Hépato-Gastro et Oncologie Digestive 2023;30(3):283-292. doi:10.1684/hpg.2023.2545.</i></p>","id": "antithrombotiques-endoscopie-sfed2023","tags": ["endoscopie","antithrombotiques","SFED","anticoagulants"],"titre": "Antithrombotiques en endoscopie - FICHE FLASH (SFED 2023)","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Affirmer la maladie hépatique avancée, coter le pronostic, dépister l’hypertension portale cliniquement significative — sans mesure du gradient de pression.</p><div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">L'essentiel</p><ul>\n<li>L’<strong>élastographie hépatique</strong> (à jeun) est le point d’entrée : < 10 kPa écarte la maladie avancée, > 15 kPa la rend très probable.</li>\n<li>L’hypertension portale cliniquement significative (<strong>HTP-CS</strong>, historiquement définie par un gradient de pression sus-hépatique ≥ 10 mmHg) se dépiste désormais par des tests non invasifs validés.</li>\n<li>C’est la présence d’une HTP-CS — et non celle de varices — qui déclenche le traitement par bêtabloquant.</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Affirmer la maladie chronique avancée du foie compensée</p>\n<p>Le terme retenu par Baveno est <strong>cACLD</strong> (<em>compensated advanced chronic liver disease</em>) : il désigne le continuum fibrose sévère – cirrhose, identifié au lit du malade, sans recours à l'histologie. Il est préféré à « cirrhose compensée » quand le diagnostic repose sur des tests non invasifs.</p>\n\n<table>\n<tr><th>Élastographie hépatique</th><th>Interprétation</th></tr>\n<tr><td><strong>< 10 kPa</strong></td><td>Écarte la maladie avancée, en l’absence d’autre signe clinique ou d’imagerie. Risque de décompensation et de décès hépatique à 3 ans ≤ 1 %</td></tr>\n<tr><td><strong>10–15 kPa</strong></td><td>Évocateur</td></tr>\n<tr><td><strong>> 15 kPa</strong></td><td>Très évocateur</td></tr>\n</table>\n\n<ul>\n<li>La mesure se fait <strong>toujours à jeun</strong>, que ce soit pour le diagnostic de maladie avancée ou pour celui d’HTP-CS.</li>\n<li>Si la première valeur est ≥ 10 kPa : <strong>répéter la mesure</strong>, ou la compléter par un autre test non invasif validé de fibrose avancée.</li>\n<li>Tout patient avec une maladie avancée doit être <strong>adressé à un hépatologue</strong> pour la suite du bilan.</li>\n</ul>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Piège</p><p>Élastographie <strong>< 10 kPa mais signes d’hypertension portale</strong> (varices, splénomégalie, collatérales, thrombopénie) : penser à une <strong>maladie vasculaire du foie</strong> — maladie vasculaire porto-sinusoïdale, thrombose porte. Les seuils d’élastographie de la cirrhose ne s’y appliquent pas.</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Coter le pronostic : la règle des 5</p>\n<p>Les seuils <strong>10 – 15 – 20 – 25 kPa</strong> définissent des paliers de risque croissant de décompensation et de décès hépatique, quelle que soit l’étiologie.</p>\n<p>L’évolution des valeurs a une valeur pronostique, mais c’est <strong>la valeur la plus récente qui guide la décision</strong>.</p>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Rechercher l'hypertension portale cliniquement significative</p>\n<p>Les tests non invasifs validés sont suffisamment performants pour exclure ou affirmer l’HTP-CS et prédisent la décompensation aussi bien que la mesure du gradient. Le couple <strong>élastographie + plaquettes</strong> et leurs dérivés (modèles ANTICIPATE) en constituent la base ; l’<strong>élastographie splénique</strong> améliore le classement des cas intermédiaires.</p>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Écarter l'HTP-CS</p>\n<ul>\n<li><strong>Élastographie hépatique ≤ 15 kPa <em>et</em> plaquettes ≥ 150 G/L</strong> (valeur prédictive négative > 90 %)</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Affirmer l'HTP-CS — un seul critère suffit</p>\n<ul>\n<li>Probabilité estimée <strong>≥ 75 %</strong> par <strong>ANTICIPATE</strong>, <strong>ANTICIPATE-NASH</strong> (à utiliser si stéatopathie métabolique avec IMC ≥ 30 kg/m²) ou <strong>NICER</strong></li>\n<li><strong>Élastographie hépatique ≥ 25 kPa</strong> : valable en étiologie virale, alcoolique, et stéatopathie métabolique <em>non obèse</em> (IMC < 30)</li>\n<li><strong>Élastographie splénique (100 Hz) > 55 kPa</strong></li>\n<li>Varices à l’endoscopie, collatérales porto-systémiques en imagerie, ou gradient ≥ 10 mmHg</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Zone grise</p>\n<p>Patient ne remplissant ni les critères d’exclusion ni les critères diagnostiques : <strong>réévaluer à 12 mois</strong>, éventuellement en ajoutant l’élastographie splénique.</p>\n\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Changement de paradigme</p><p>Baveno VIII acte le passage de l’estimation de la probabilité d’HTP-CS vers la <strong>prédiction directe du risque de décompensation</strong>, qui dépend de trois éléments : présence d’une HTP-CS, fonction hépatique, et facteur étiologique.</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Rythme de surveillance</p>\n<ul>\n<li>Tests non invasifs d’HTP-CS <strong>tous les 12 mois</strong></li>\n<li>Après traitement étiologique efficace : la pression portale baisse, mais <strong>l’HTP-CS peut persister et doit être réévaluée</strong></li>\n<li>Chez un patient recompensé : la disparition de l’HTP-CS se confirme par un gradient < 10 mmHg mesuré sous arrêt du bêtabloquant, ou par élastographie hépatique < 10 kPa, ou < 15 kPa associée à une élastographie splénique < 25 kPa</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Situations particulières</p>\n<ul>\n<li><strong>Carcinome hépatocellulaire</strong> : élastographie ≤ 15 kPa + plaquettes ≥ 150 G/L écartent l’HTP-CS aux stades BCLC 0–C ; une probabilité ANTICIPATE ≥ 75 % est très évocatrice aux stades 0–A sans nodule > 5 cm du foie droit. <strong>En cas d’invasion macrovasculaire, les tests non invasifs ne sont pas applicables</strong>.</li>\n<li><strong>Maladie vasculaire porto-sinusoïdale</strong> : seuils spécifiques, voir fiche dédiée — les critères d’élastographie de la cirrhose sont invalides.</li>\n<li><strong>Quand demander un gradient de pression ?</strong> Il n’est plus nécessaire en routine. Il reste utile en cas de discordance des tests non invasifs, en protocole de recherche, dans le bilan pré-opératoire, et devant une suspicion de maladie vasculaire porto-sinusoïdale.</li>\n</ul><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche1","tags": ["Baveno VIII","hypertension portale"],"titre": "Évaluation de l’hypertension portale","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Diagnostic par la ponction, antibioth&eacute;rapie et albumine, prophylaxie secondaire — et quand l&rsquo;arr&ecirc;ter.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Diagnostic</p>\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Diagnostic — EASL 2018</p><ul>\n<li><strong>Ponction exploratrice</strong> devant toute ascite à l&rsquo;admission, toute d&eacute;compensation, toute h&eacute;morragie digestive, toute d&eacute;gradation clinique ou biologique</li>\n<li><strong>Polynucl&eacute;aires neutrophiles &ge; 250/mm&sup3;</strong> = infection, m&ecirc;me sans germe identifi&eacute;</li>\n<li>Ensemencement au lit du malade dans des flacons d&rsquo;h&eacute;moculture + h&eacute;mocultures p&eacute;riph&eacute;riques</li>\n<li>Exclure une p&eacute;ritonite secondaire (protides &eacute;lev&eacute;s, glucose bas, LDH &eacute;lev&eacute;es, polymicrobisme)</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Traitement</p>\n<ul>\n<li><strong>Antibioth&eacute;rapie sans d&eacute;lai</strong>, empirique, adapt&eacute;e à l&rsquo;épid&eacute;miologie locale et à la gravit&eacute;</li>\n<li><strong>Albumine</strong>&nbsp;: administration de courte dur&eacute;e indiqu&eacute;e</li>\n<li><strong>Suspendre ou r&eacute;duire les b&eacute;tabloquants</strong> en cas d&rsquo;hypotension persistante ou de syndrome h&eacute;pator&eacute;nal</li>\n</ul>\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Posologies — EASL 2018</p><ul>\n<li><strong>Infection communautaire</strong>&nbsp;: c&eacute;fotaxime 2 g/8 h IV, ou ceftriaxone 1–2 g/j — dur&eacute;e 5 à 7 jours</li>\n<li><strong>Nosocomiale / risque de multir&eacute;sistance</strong>&nbsp;: élargir le spectre puis d&eacute;sescalader</li>\n<li><strong>Albumine</strong>&nbsp;: 1,5 g/kg à J1 et 1 g/kg à J3</li>\n<li><strong>Contr&ocirc;le à 48 h</strong>&nbsp;: nouvelle ponction, baisse des PNN ≥ 25 % = efficacité</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Prophylaxie</p>\n<table>\n<tr><th>Situation</th><th>Conduite</th></tr>\n<tr><td><strong>Ant&eacute;c&eacute;dent d&rsquo;infection du liquide d&rsquo;ascite</strong></td><td><strong>Antibioprophylaxie à consid&eacute;rer</strong> — norfloxacine 400 mg/j ou ciprofloxacine 500 mg/j</td></tr>\n<tr><td><strong>Recompensation obtenue</strong></td><td><strong>Arr&ecirc;ter la prophylaxie</strong></td></tr>\n<tr><td>Apr&egrave;s une 1re d&eacute;compensation sans ant&eacute;c&eacute;dent</td><td><strong>Pas d&rsquo;antibioprophylaxie primaire au long cours</strong></td></tr>\n<tr><td><strong>H&eacute;morragie digestive</strong></td><td>Antibioprophylaxie d&egrave;s l&rsquo;admission par c&eacute;phalosporine de 3e g&eacute;n&eacute;ration</td></tr>\n</table>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Piège</p><p>Chez un patient jusque-là compensé, l&rsquo;infection peut être la porte d&rsquo;entrée de la décompensation. Devant un ictère isolé ou une dégradation inexpliquée, rechercher une infection bactérienne immédiatement et de façon exhaustive, même asymptomatique.</p></div><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026. Les posologies proviennent des recommandations EASL 2018 ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche10","tags": ["Baveno VIII","hypertension portale"],"titre": "Infection du liquide d’ascite","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">D&eacute;pister, d&eacute;crire selon les crit&egrave;res VALDIG, d&eacute;cider d&rsquo;anticoaguler, choisir la mol&eacute;cule et la dur&eacute;e, situer le TIPS.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. D&eacute;pister et d&eacute;crire</p>\n<ul>\n<li><strong>D&eacute;pistage lors de la surveillance radiologique du CHC</strong>, au m&ecirc;me rythme</li>\n<li><strong>&Eacute;cho-doppler en premi&egrave;re intention</strong> ; scanner multiphasique pour confirmer et pr&eacute;ciser l&rsquo;extension</li>\n</ul>\n\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Crit&egrave;res VALDIG</p><p><strong>Degr&eacute; d&rsquo;occlusion</strong>&nbsp;: minime (lumi&egrave;re r&eacute;siduelle &ge; 50 %), partielle (&lt; 50 %), compl&egrave;te (nulle).</p><p><strong>Anciennet&eacute;</strong>&nbsp;: r&eacute;cente (&lt; 6 mois) vs chronique (&gt; 6 mois, avec ou sans cavernome).</p></div>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Piège</p><p>Une thrombose porte chez un patient porteur d&rsquo;un CHC n&rsquo;est pas la preuve d&rsquo;un envahissement vasculaire&nbsp;: imagerie et crit&egrave;res standardis&eacute;s n&eacute;cessaires pour trancher.</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Qui anticoaguler ?</p>\n<ul>\n<li><strong>Candidat à la transplantation</strong>&nbsp;: anticoagulation recommandée pour toute thrombose porte</li>\n<li>Thrombose r&eacute;cente partielle ou compl&egrave;te du tronc porte, ou symptomatique&nbsp;: anticoagulation à consid&eacute;rer</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Dur&eacute;e</p>\n<ul>\n<li><strong>Candidat à la transplantation</strong>&nbsp;: jusqu&rsquo;à la greffe</li>\n<li><strong>Autres</strong>&nbsp;: au moins 6 mois, puis poursuite au long cours à discuter</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Choix de l'anticoagulant</p>\n<ul>\n<li>HBPM, AVK et AOD tous acceptables</li>\n<li><strong>AOD</strong>&nbsp;: s&ucirc;rs en Child-Pugh A, prudence en B, non recommand&eacute;s en C hors recherche</li>\n</ul>\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Facteurs de sur-risque h&eacute;morragique</p><p>&Acirc;ge, fragilit&eacute;, DFG &lt; 30 mL/min, cirrhose d&eacute;compens&eacute;e, plaquettes &lt; 50 G/L. D&eacute;cision individualis&eacute;e, r&eacute;&eacute;valu&eacute;e r&eacute;guli&egrave;rement.</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Place du TIPS</p>\n<ul>\n<li>Thrombose du tronc porte sans am&eacute;lioration sous anticoagulation, avec complications d&rsquo;HTP ou candidature à la transplantation</li>\n<li>En 1re intention si contre-indication à l&rsquo;anticoagulation</li>\n<li>Pas d&rsquo;anticoagulation syst&eacute;matique apr&egrave;s TIPS</li>\n</ul><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026. Les posologies proviennent des recommandations EASL 2018 ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche11","tags": ["Baveno VIII","hypertension portale"],"titre": "Thrombose porte du patient cirrhotique","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Qui endoscoper, qui ne plus endoscoper, et à quel rythme répéter l'examen.</p><div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Principe</p><p>L'endoscopie de dépistage n'a d'intérêt que si son résultat <strong>modifie la prise en charge</strong>. Chez un patient déjà sous bêtabloquant non sélectif, elle ne change rien : elle n'est plus recommandée.</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Maladie avancée du foie compensée / cirrhose compensée</p>\n<table>\n<tr><th>Situation</th><th>Conduite</th></tr>\n<tr><td><strong>Patient sous carvédilol ou autre bêtabloquant non sélectif</strong></td><td><strong>Pas d'endoscopie de dépistage</strong></td></tr>\n<tr><td><strong>Contre-indication ou intolérance aux bêtabloquants</strong></td><td><strong>Endoscopie</strong>, sauf si élastographie hépatique < 20 kPa <em>et</em> plaquettes ≥ 150 G/L (critères Baveno VI), <em>ou</em> élastographie splénique < 40 kPa</td></tr>\n<tr><td><strong>Première endoscopie sans varices</strong>, patient toujours inéligible aux bêtabloquants</td><td>Répéter à <strong>2 ans</strong> si le facteur étiologique reste actif, à <strong>3 ans</strong> si l'étiologie a été supprimée ou contrôlée — sauf si les critères ci-dessus sont atteints entre-temps</td></tr>\n<tr><td><strong>Varices œsophagiennes larges ou varices gastro-œsophagiennes de type 1</strong></td><td><strong>Ligature élastique</strong> en prévention de la première hémorragie</td></tr>\n</table>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Piège fréquent</p><p>Une endoscopie normale ne dispense <strong>pas</strong> du traitement de l'hypertension portale. Le carvédilol se prescrit sur la <strong>présence d'une hypertension portale cliniquement significative</strong>, pas sur la présence de varices. Inversement, la ligature seule n'a aucun effet sur les autres événements de décompensation (ascite, encéphalopathie).</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Carcinome hépatocellulaire associé</p>\n<ul>\n<li>Stades BCLC 0–C : élastographie ≤ 15 kPa + plaquettes ≥ 150 G/L écartent l'hypertension portale cliniquement significative — l'endoscopie peut être évitée</li>\n<li><strong>Invasion macrovasculaire</strong> : les tests non invasifs ne sont pas applicables — recourir à l'endoscopie</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Maladies vasculaires du foie</p>\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Maladie vasculaire porto-sinusoïdale / fibrose portale non cirrhotique</p>\n<ul>\n<li>Endoscopie <strong>au diagnostic</strong></li>\n<li>Elle peut être évitée, au diagnostic comme en suivi, si <strong>élastographie splénique < 40 kPa et bilirubine < 17 µmol/L</strong> (< 1 mg/dL) : la probabilité de varices est alors faible</li>\n<li><strong>Les critères d'élastographie hépatique utilisés dans la cirrhose ne s'appliquent pas</strong></li>\n<li>Le dépistage des varices doit être fait dès le diagnostic posé</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">Thrombose porte sans cirrhose</p>\n<ul>\n<li>Endoscopie <strong>au diagnostic</strong> ; en l'absence de varices à haut risque, à répéter à <strong>12 mois</strong> puis <strong>tous les 2 ans</strong></li>\n<li>Élastographie splénique < 40 kPa : endoscopie évitable</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Ce qui ne relève pas du dépistage</p>\n<ul>\n<li><strong>Hémorragie digestive aiguë</strong> : endoscopie <strong>dans les 12 heures</strong> suivant l'admission, plus tôt si instabilité hémodynamique — voir fiche hémorragie</li>\n<li><strong>Après ligature</strong> en prévention secondaire : séances répétées toutes les <strong>2 à 4 semaines jusqu'à éradication</strong> (algorithme Baveno VIII), puis surveillance endoscopique selon le protocole local</li>\n</ul><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche2","tags": ["Baveno VIII","hypertension portale"],"titre": "Indications des endoscopies de dépistage","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Carvédilol en première intention : qui traiter, à quelle dose, comment surveiller, quand arrêter.</p><div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">L'essentiel</p><ul>\n<li>On traite l'<strong>hypertension portale cliniquement significative</strong>, pas les varices.</li>\n<li><strong>Carvédilol préféré</strong> au propranolol et au nadolol dans presque toutes les situations.</li>\n<li>Le gradient de pression n'est pas nécessaire pour décider de traiter (énoncé Baveno VI/VII toujours valide).</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">1. Qui traiter ?</p>\n<table>\n<tr><th>Situation</th><th>Conduite</th></tr>\n<tr><td>Maladie avancée compensée <strong>avec</strong> hypertension portale cliniquement significative</td><td><strong>Carvédilol</strong> (préféré) ou bêtabloquant non sélectif conventionnel, pour prévenir la décompensation et améliorer la survie</td></tr>\n<tr><td>Maladie avancée compensée <strong>sans</strong> hypertension portale cliniquement significative</td><td><strong>Ne pas prescrire</strong> : aucun bénéfice sur la décompensation ni la mortalité</td></tr>\n<tr><td>Varices gastriques chez un patient compensé</td><td>Leur présence signe l'hypertension portale cliniquement significative → carvédilol</td></tr>\n<tr><td><strong>Ascite + varices</strong></td><td>Carvédilol (préféré) pour prévenir la première hémorragie <em>et</em> réduire les complications liées à l'ascite</td></tr>\n<tr><td>Après hémorragie de varices œsophagiennes (prévention secondaire)</td><td><strong>Bêtabloquant + ligature</strong>, carvédilol préféré, même si le patient était déjà sous bêtabloquant en prévention primaire</td></tr>\n<tr><td>Gastropathie d'hypertension portale</td><td>Le traitement repose sur la baisse de la pression portale par bêtabloquant</td></tr>\n<tr><td>Récidive hémorragique malgré bêtabloquant + ligature</td><td>Échec de la prévention secondaire → <strong>TIPS</strong></td></tr>\n</table>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">2. Posologie</p>\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Posologie — EASL 2018 / usage courant</p><ul>\n<li><strong>Carvédilol</strong> : début à <strong>6,25 mg/j</strong>, puis <strong>12,5 mg/j</strong> en une ou deux prises après 3 à 7 jours si la tolérance est bonne. <strong>Ne pas dépasser 12,5 mg/j</strong> dans cette indication.</li>\n<li><strong>Propranolol</strong> : 20–40 mg × 2/j, augmentation par paliers ; maximum 160 mg/j (320 mg/j en l'absence d'ascite).</li>\n<li><strong>Nadolol</strong> : 20–40 mg/j en une prise, titration progressive.</li>\n<li><strong>Cibles de titration</strong> : fréquence cardiaque de repos autour de 55–60/min <em>et</em> pression artérielle systolique ≥ 90 mmHg. La tolérance prime sur la cible chiffrée.</li>\n</ul></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">3. Contre-indications et intolérance</p>\n<ul>\n<li><strong>Contre-indications classiques</strong> (usage courant) : asthme, bloc auriculo-ventriculaire de haut degré, bradycardie sévère, hypotension symptomatique.</li>\n<li><strong>Réduire la dose ou arrêter</strong> en cas de : pression artérielle systolique < 90 mmHg ou moyenne < 65 mmHg de façon persistante, <strong>et/ou syndrome hépatorénal avec insuffisance rénale aiguë</strong>.</li>\n<li><strong>La reprise est possible</strong> : réintroduire et re-titrer une fois le syndrome hépatorénal résolu et/ou la pression artérielle remontée. Un arrêt ponctuel n'est pas un arrêt définitif.</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">4. Si le patient ne peut pas recevoir de bêtabloquant</p>\n<ul>\n<li><strong>Maladie compensée</strong> : endoscopie, puis <strong>ligature élastique</strong> si varices œsophagiennes larges ou varices gastro-œsophagiennes de type 1.</li>\n<li><strong>Ascite + varices</strong> : traitement endoscopique seul pour prévenir la première hémorragie.</li>\n<li><strong>Varices gastriques à haut risque</strong> de type GOV2 ou IGV1 (cardio-fundiques) : traitement local en centre expert — injection endoscopique, traitement guidé par écho-endoscopie, ou obturation transveineuse.</li>\n<li><strong>Après une hémorragie</strong>, si ni ligature ni bêtabloquant ne sont possibles : maintenir en <strong>monothérapie</strong> le traitement toléré.</li>\n</ul>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">5. Quand arrêter définitivement ?</p>\n<p>Uniquement chez un patient <strong>recompensé</strong> et seulement si la <strong>disparition de l'hypertension portale cliniquement significative est confirmée</strong> :</p>\n<ul>\n<li>gradient de pression sus-hépatique < 10 mmHg, mesuré <strong>sous arrêt du bêtabloquant</strong> ; ou</li>\n<li>élastographie hépatique < 10 kPa ; ou < 15 kPa associée à une élastographie splénique < 25 kPa</li>\n<li>À l'inverse, une élastographie hépatique > 25 kPa affirme la persistance de l'hypertension portale</li>\n</ul>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">Piège</p><p>La <strong>persistance de varices ou de collatérales</strong> après recompensation n'est <strong>pas</strong> un marqueur fiable d'hypertension portale persistante : elles peuvent subsister alors que l'hypertension portale a disparu, et leur risque hémorragique semble alors faible.</p></div>\n\n<p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">6. Surveillance</p>\n<ul>\n<li>Pression artérielle et fréquence cardiaque à chaque consultation et après chaque changement de dose.</li>\n<li>Réévaluation systématique lors de tout épisode d'ascite réfractaire, d'infection, de sepsis, d'hémorragie ou d'insuffisance rénale.</li>\n<li>L'objectif est la prévention de la décompensation : le traitement se poursuit indéfiniment tant que l'hypertension portale persiste.</li>\n</ul><p style=\"margin:20px 0 0;font-size:0.82em;color:#6E6A5D;\"><i>Source : Baveno VIII — Advancing Consensus in Portal Hypertension, Journal of Hepatology 2026 (version pre-proof du 31/07/2026). Les posologies proviennent des recommandations EASL 2018 sur la cirrhose décompensée ou de l’usage courant, et sont à adapter aux protocoles locaux.</i></p>","id": "baveno-htp-fiche3","tags": ["Baveno VIII","hypertension portale"],"titre": "Bêtabloquants non sélectifs : indications, contre-indications, prescription","urgent": false},{"categorie": "Hépatologie","contenu": "<p style=\"margin:0 0 14px;font-style:italic;color:#6E6A5D;\">Urgence : les 12 premières heures, le traitement endoscopique selon la source, le TIPS préemptif, l'échec d'hémostase. Puis gastropathie, ectasies antrales et ulcère post-ligature.</p><p style=\"margin:20px 0 10px;color:#1F5C3F;font-weight:bold;font-size:1.05em;border-bottom:1px solid #DAD5C8;padding-bottom:4px;\">A. HÉMORRAGIE AIGUË PAR RUPTURE DE VARICES</p>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.1 Définition</p>\n<p>Saignement d'une varice œsophagienne, gastrique ou ectopique (jet ou suintement) ; ou varice portant des <strong>signes de saignement récent</strong> (caillot adhérent, clou plaquettaire blanc) ; ou varices sans autre source identifiée en présence de sang dans l'estomac.</p>\n\n<div style=\"background:#E3EFEA;border-left:4px solid #1F5C3F;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#1F5C3F;font-weight:bold;\">Les 5 gestes qui sauvent</p><ol>\n<li><strong>Unité de soins intensifs</strong> ou surveillance continue</li>\n<li><strong>Transfusion restrictive</strong>, hémoglobine cible <strong>7–8 g/dL</strong></li>\n<li><strong>Vasoactif immédiat</strong>, dès la suspicion</li>\n<li><strong>Antibioprophylaxie</strong> dès l'admission</li>\n<li><strong>Endoscopie dans les 12 heures</strong></li>\n</ol></div>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.2 Réanimation initiale</p>\n<ul>\n<li>Objectif : <strong>préserver la perfusion d'organe</strong> ; le remplissage vise à restaurer et maintenir la stabilité hémodynamique, sans sur-remplissage qui aggrave l'hypertension portale</li>\n<li>Transfusion de culots globulaires <strong>restrictive : cible 7–8 g/dL</strong> ; individualiser en cas de cardiopathie, d'âge avancé, d'instabilité ou de saignement actif</li>\n<li><strong>Intubation</strong> avant l'endoscopie si troubles de conscience ou hématémèse active, avec <strong>extubation la plus précoce possible</strong> après le geste</li>\n<li>Manipulation des voies aériennes et pose de sonde nasogastrique avec prudence : risque d'inhalation et d'infection pulmonaire</li>\n</ul>\n\n<p style=\"margin:12px 0 4px;color:#6E6A5D;font-weight:bold;font-size:0.82em;text-transform:uppercase;letter-spacing:0.03em;\">A.3 Traitements à débuter immédiatement</p>\n<ul>\n<li><strong>Vasoactif</strong> (terlipressine, somatostatine ou octéotride) dès la suspicion, poursuivi <strong>2 à 5 jours</strong> ou jusqu'à la pose d'un TIPS. Une durée courte (24 h) est envisageable après hémostase endoscopique réussie, <strong>à condition d'introduire ensuite un bêtabloquant</strong>.<br><strong>Surveiller la natrémie</strong> sous terlipressine : risque d'hyponatrémie.</li>\n<li><strong>Antibioprophylaxie</strong> dès la prise en charge, par <strong>céphalosporine de 3e génération</strong>, en tenant compte de l'écologie et de la politique locales. Chez le patient <strong>Child-Pugh A</strong>, une durée raccourcie voire l'abstention peuvent se discuter.</li>\n<li><strong>Lactulose</strong> par voie orale ou en lavements, pour prévenir ou traiter l'encéphalopathie en accélérant l'élimination digestive du sang.</li>\n<li><strong>Érythromycine 250 mg par voie intraveineuse, 30 à 90 minutes avant l'endoscopie</strong>, en l'absence d'allongement du QT : améliore la vacuité gastrique et la visibilité, réduit les besoins transfusionnels.</li>\n<li><strong>Inhibiteurs de la pompe à protons</strong> : s'ils ont été débutés avant l'endoscopie, les <strong>arrêter</strong> une fois l'origine liée à l'hypertension portale confirmée, sauf indication propre.</li>\n</ul>\n\n<div style=\"background:#E4EDF7;border-left:4px solid #24507C;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#24507C;font-weight:bold;\">Posologies — EASL 2018 / usage courant</p><ul>\n<li><strong>Terlipressine</strong> : 2 mg en bolus intraveineux, puis 1–2 mg toutes les 4 à 6 heures</li>\n<li><strong>Somatostatine</strong> : bolus 250 µg, puis 250 µg/h en continu</li>\n<li><strong>Octéotride</strong> : bolus 50 µg, puis 50 µg/h en continu</li>\n<li><strong>Ceftriaxone</strong> 1 g/24 h par voie intraveineuse, 5 à 7 jours (ou norfloxacine per os si forme peu sévère)</li>\n<li><strong>Lactulose</strong> : 25 mL × 2/j, adapté pour obtenir 2 à 3 selles molles par jour ; lavements si troubles de conscience</li>\n</ul></div>\n\n<div style=\"background:#F5E4DE;border-left:4px solid #A94430;border-radius:8px;padding:12px 16px;margin:14px 0;\"><p style=\"margin:0 0 8px;color:#A94430;font-weight:bold;\">À ne PAS faire</p><ul>\n<li>Pas de <strong>plasma frais congelé</strong> systématique : il ne corrige pas la coagulopathie et majore la volémie et l'hypertension portale</li>\n<li>Pas de transfusion systématique de <strong>pla
